<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLOZE TEXT: FURTHER PRACTICE - Làm bài Test 1 (Samples 1-4)</title>
<style>
:root{ --fs:17px; --brown:#8a5a12; --green:#1e8e4f; --red:#d33; --orange:#e07b00; --line:#d8d8d8; --blue:#3b6fd4; }
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Times New Roman",sans-serif;background:#f4f4f6;color:#1c1c1e;font-size:var(--fs)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:1.15em;margin:0;font-family:"Times New Roman",serif;letter-spacing:.5px}
header .sub{color:#666;font-size:.82em;width:100%}
.chip{background:#eef1f6;border:1px solid #c3cede;color:#243b6b;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9em}
button.tool{background:#fff;border:1px solid #bbb;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.9em}
button.tool.on{background:#fff3cd;border-color:#e0a800}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select#picker{font-size:.95em;padding:6px;border-radius:8px;border:1px solid #bbb;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.schip{border:1px solid #bbb;background:#fff;border-radius:6px;padding:2px 7px;font-size:.78em;cursor:pointer}
.schip.full{background:#e8eefc;border-color:var(--blue);color:#1e3a8a;font-weight:700}
.schip.cur{outline:2px solid #333}
main{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:start}
@media (max-width:860px){ main{grid-template-columns:1fr} }
.pane{padding:14px;overflow-y:auto;max-height:calc(100vh - 150px)}
@media (max-width:860px){ .pane{max-height:none;overflow:visible} }
.pane.left{border-right:1px solid var(--line);background:#fff}
.topic{font-family:"Times New Roman",serif;font-weight:700;text-align:center;font-size:1.12em;margin:2px 0 10px}
.passage{font-family:"Times New Roman",serif;font-size:1.06em;line-height:1.65;text-align:justify}
.blank{display:inline-block;min-width:2em;text-align:center;background:#eef;border:1px dashed #88a;border-radius:6px;padding:0 4px;font-weight:700;color:#335}
.blank.picked{background:#e8eefc;border:1px solid var(--blue);color:#1e3a8a}
.blank.filled{background:#e6f4ea;border:1px solid var(--green);color:#14532d}
.blank.wrongfill{background:#fdecec;border:1px solid var(--red);color:#a00}
.blank.shown{background:#fff4e0;border:1px solid var(--orange);color:#8a5200}
.wv{color:var(--brown);cursor:pointer;border-bottom:1px dotted var(--brown)}
mark.hl{background:#ffe98a;border-radius:2px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.qcard .qhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.qcard .st{font-size:.85em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:480px){ .opts{grid-template-columns:1fr} }
.opt{border:1px solid #bbb;background:#fff;border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font-size:.95em}
.opt:hover{border-color:#666}
.opt.sel{background:#e8eefc;border-color:var(--blue);font-weight:700}
.opt.right{background:#e6f4ea;border-color:var(--green);font-weight:700}
.opt.wrongpick{background:#fdecec;border-color:var(--red);color:#a00}
.opt:disabled{cursor:default;opacity:.92}
.expl{display:none;background:#f7f9f7;border-left:3px solid var(--green);padding:8px 10px;margin-top:8px;font-size:.92em;line-height:1.5}
.expl.show{display:block}
.submitbar{background:#fff;border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
#submitBtn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:12px 44px;font-size:1.05em;font-weight:700;cursor:pointer}
#submitBtn:hover{background:#17703d}
#result{display:none;background:#e6f4ea;border:1px solid var(--green);color:#14532d;border-radius:10px;padding:10px 18px;font-weight:700;font-size:1.05em;text-align:center}
#modal,#cmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
#modal.open,#cmodal.open{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:430px;width:100%;padding:22px 22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.3);position:relative;text-align:center}
.mbox .term{font-size:1.5em;font-weight:800;color:var(--brown)}
.mbox .ipa{font-size:1.15em;color:#444;margin:6px 0}
.mbox .vn{font-size:1.12em;line-height:1.5}
.mbox .x{position:absolute;top:6px;right:12px;background:none;border:none;font-size:1.5em;cursor:pointer;color:#888}
.cbtns{margin-top:16px;display:flex;gap:8px;justify-content:center}
#cYes{background:var(--green);color:#fff;border-color:var(--green);font-weight:700;padding:8px 18px}
#cNo{padding:8px 18px}
.hint{color:#666;font-size:.85em;padding:6px 14px}
</style>
</head>
<body>
<header>
  <h1>CLOZE TEXT: FURTHER PRACTICE</h1>
  <span class="chip" id="score">Đã làm: 0/24</span>
  <button class="tool" id="zoomOut">A-</button>
  <button class="tool" id="zoomIn">A+</button>

</header>
<div class="bar">
  <button class="tool" id="prevBtn">‹ Trước</button>
  <select id="picker"></select>
  <button class="tool" id="nextBtn">Sau ›</button>
  <div class="chips" id="chips"></div>
</div>
<main>
  <section class="pane left">
    <div class="topic" id="topic"></div>
    <div class="passage" id="passage"></div>
  </section>
  <section class="pane right" id="questions"></section>
</main>
<div class="submitbar">
  <button id="submitBtn">Nộp bài</button>
  <div id="result"></div>
</div>
<div id="modal"><div class="mbox">
  <button class="x" id="modalX">×</button>
  <div class="term" id="mTerm"></div>
  <div class="ipa" id="mIpa"></div>
  <div class="vn" id="mVn"></div>
</div></div>
<div id="cmodal"><div class="mbox">
  <div class="term" style="color:var(--green);font-size:1.25em">Nộp bài?</div>
  <div class="vn" id="cText" style="font-size:1em;margin-top:8px"></div>
  <div class="cbtns">
    <button class="tool" id="cYes">Nộp bài ngay</button>
    <button class="tool" id="cNo">Làm tiếp</button>
  </div>
</div></div>
<script>
const DATA = [
{"n": 1, "topic": "THE HIDDEN COST OF ENERGY DRINKS", "html": "Energy drinks are marketed as a quick way to stay <span class=\"wv\" data-term=\"alert\" data-ipa=\"/əˈlɜːt/\" data-vn=\"tỉnh táo, nhanh nhạy\">alert</span>, yet doctors are increasingly <span class=\"wv\" data-term=\"concerned\" data-ipa=\"/kənˈsɜːnd/\" data-vn=\"lo ngại, quan ngại\">concerned</span> about the <span class=\"wv\" data-term=\"damage\" data-ipa=\"/ˈdæmɪdʒ/\" data-vn=\"tổn hại, thiệt hại\">damage</span> they can do. Each can contains as much <span class=\"wv\" data-term=\"caffeine\" data-ipa=\"/ˈkæfiːn/\" data-vn=\"caffeine, chất kích thích có trong cà phê và trà\">caffeine</span> as two cups of coffee, plus sugar that the body <span class=\"wv\" data-term=\"absorb\" data-ipa=\"/əbˈzɔːb/\" data-vn=\"hấp thụ, thấm vào cơ thể\">absorbs</span> almost <span class=\"wv\" data-term=\"instantly\" data-ipa=\"/ˈɪnstəntli/\" data-vn=\"ngay lập tức\">instantly</span>. Teenagers who <span class=\"wv\" data-term=\"rely on\" data-ipa=\"/rɪˈlaɪ ɒn/\" data-vn=\"dựa vào, trông cậy vào\">rely on</span> these drinks to <span class=\"wv\" data-term=\"revise\" data-ipa=\"/rɪˈvaɪz/\" data-vn=\"ôn tập (trước kỳ thi)\">revise</span> for exams often find that the habit <span class=\"blank\" data-q=\"1\">(1)</span> on their sleep: wide awake at midnight, they are <span class=\"wv\" data-term=\"exhausted\" data-ipa=\"/ɪɡˈzɔːstɪd/\" data-vn=\"kiệt sức, mệt rã rời\">exhausted</span> the next morning. Worse still, the drinks <span class=\"blank\" data-q=\"2\">(2)</span> to a <span class=\"wv\" data-term=\"racing (heart)\" data-ipa=\"/ˈreɪsɪŋ/\" data-vn=\"đập nhanh dồn dập (tim)\">racing</span> heart and raised <span class=\"wv\" data-term=\"blood pressure\" data-ipa=\"/blʌd ˈpreʃə(r)/\" data-vn=\"huyết áp\">blood pressure</span> in several recent studies. Even if schools <span class=\"blank\" data-q=\"3\">(3)</span> the drinks tomorrow, many students would simply buy them from shops near the school instead. Health experts argue that schools should take a far <span class=\"wv\" data-term=\"strict\" data-ipa=\"/ˈstrɪktə(r)/\" data-vn=\"nghiêm ngặt hơn, chặt chẽ hơn\">stricter</span> <span class=\"blank\" data-q=\"4\">(4)</span>, <span class=\"wv\" data-term=\"ban\" data-ipa=\"/bæn/\" data-vn=\"cấm, việc cấm\">banning</span> sales to anyone under sixteen, as some countries have already done. Until that happens, teenagers themselves must read the <span class=\"wv\" data-term=\"label\" data-ipa=\"/ˈleɪbl/\" data-vn=\"nhãn mác (trên lon, chai)\">label</span> and <span class=\"wv\" data-term=\"think twice\" data-ipa=\"/θɪŋk twaɪs/\" data-vn=\"suy nghĩ thật kỹ trước khi làm gì\">think twice</span> before <span class=\"blank\" data-q=\"5\">(5)</span> another can <span class=\"wv\" data-term=\"out of habit\" data-ipa=\"/aʊt əv ˈhæbɪt/\" data-vn=\"theo thói quen (chứ không phải vì thật sự cần)\">out of habit</span> rather than real need. What begins as a harmless <span class=\"wv\" data-term=\"boost\" data-ipa=\"/buːst/\" data-vn=\"cú hích, sự tăng lực tạm thời\">boost</span> can <span class=\"wv\" data-term=\"quietly\" data-ipa=\"/ˈkwaɪətli/\" data-vn=\"âm thầm, lặng lẽ\">quietly</span> turn into a real <span class=\"blank\" data-q=\"6\">(6)</span> that is hard to <span class=\"wv\" data-term=\"shake off\" data-ipa=\"/ʃeɪk ɒf/\" data-vn=\"rũ bỏ, thoát khỏi (thói quen xấu, cơn bệnh)\">shake off</span>.", "blanks": [{"options": ["pays its price", "does its harm", "takes its toll", "makes its effort"], "key": 2, "explain": "Cụm cố định 'take its toll on' = gây tác hại dần dần lên (giấc ngủ). 'Pay the price' phải đi với 'for' và chủ ngữ là người chịu hậu quả; hai cụm còn lại không tồn tại trong tiếng Anh."}, {"options": ["have linked", "have been linking", "were linking", "have been linked"], "key": 3, "explain": "Nước uống không tự 'liên kết' mình với bệnh - chúng 'được liên hệ' tới nhịp tim nhanh trong các nghiên cứu, nên cần bị động 'have been linked to'. 'Have been linking' sai thể (chủ động), 'have linked themselves' sai vì không có nghĩa phản thân ở đây, 'were linking' sai cả thể lẫn thì."}, {"options": ["banned", "will ban", "ban", "would ban"], "key": 0, "explain": "'Even if schools banned the drinks tomorrow, students would buy them elsewhere' - vế sau dùng 'would' nên đây là điều kiện loại 2, mệnh đề if dùng quá khứ đơn 'banned' dù nói về ngày mai. Phải đọc tới cuối câu mới chọn đúng."}, {"options": ["ban", "line", "limit", "side"], "key": 1, "explain": "'Take a line' = giữ lập trường/thái độ (take a stricter line = cứng rắn hơn). Không nói 'take a limit/ban/side' trong cấu trúc này."}, {"options": ["opening", "opened", "to open", "open"], "key": 0, "explain": "Sau giới từ 'before' phải dùng V-ing: 'before opening another can'. Đây là bẫy kinh điển vì nhiều HS quen dùng to-V sau động từ."}, {"options": ["pressure", "flavour", "behaviour", "addiction"], "key": 3, "explain": "Thứ 'khó rũ bỏ' (hard to shake off) bắt đầu từ một cú hích vô hại chính là 'addiction' - sự nghiện. Các từ còn lại không đi với 'turn into' theo nghĩa này."}]},
{"n": 2, "topic": "WHEN GRANDPARENTS JOIN SOCIAL MEDIA", "html": "When seventy-year-old Mrs Lan decided to sign <span class=\"blank\" data-q=\"1\">(1)</span> for her first social media account, her grandchildren were <span class=\"wv\" data-term=\"amused\" data-ipa=\"/əˈmjuːzd/\" data-vn=\"thấy buồn cười, thích thú\">amused</span>. Within weeks, however, she was <span class=\"wv\" data-term=\"post\" data-ipa=\"/pəʊst/\" data-vn=\"đăng (bài, ảnh lên mạng)\">posting</span> family photos, joining <span class=\"wv\" data-term=\"community\" data-ipa=\"/kəˈmjuːnəti/\" data-vn=\"cộng đồng\">community</span> groups and even correcting her grandson&#x27;s spelling in the comments. Far from <span class=\"blank\" data-q=\"2\">(2)</span> the <span class=\"wv\" data-term=\"generation gap\" data-ipa=\"/ˌdʒenəˈreɪʃn ˈɡæp/\" data-vn=\"khoảng cách thế hệ\">generation gap</span>, technology was quietly helping to close it. Research suggests that older people who use social <span class=\"wv\" data-term=\"platform\" data-ipa=\"/ˈplætfɔːm/\" data-vn=\"nền tảng (mạng xã hội, ứng dụng)\">platforms</span> regularly feel less <span class=\"wv\" data-term=\"lonely\" data-ipa=\"/ˈləʊnli/\" data-vn=\"cô đơn\">lonely</span>, provided they <span class=\"blank\" data-q=\"3\">(3)</span> how to protect their <span class=\"wv\" data-term=\"privacy\" data-ipa=\"/ˈprɪvəsi/\" data-vn=\"sự riêng tư, quyền riêng tư\">privacy</span> online. Problems arise when the generations disagree about what should be shared: a photograph that a grandmother finds <span class=\"wv\" data-term=\"adorable\" data-ipa=\"/əˈdɔːrəbl/\" data-vn=\"đáng yêu\">adorable</span> may leave a teenager wishing it <span class=\"blank\" data-q=\"4\">(4)</span> posted at all. A careless joke by a grandson can also lead a grandparent to <span class=\"blank\" data-q=\"5\">(5)</span> offence, even though none was <span class=\"wv\" data-term=\"intend\" data-ipa=\"/ɪnˈtend/\" data-vn=\"có chủ ý, nhằm mục đích\">intended</span>. Families who talk about these <span class=\"wv\" data-term=\"boundary\" data-ipa=\"/ˈbaʊndəri/\" data-vn=\"ranh giới, giới hạn (trong quan hệ)\">boundaries</span> <span class=\"wv\" data-term=\"openly\" data-ipa=\"/ˈəʊpənli/\" data-vn=\"một cách cởi mở, thẳng thắn\">openly</span>, researchers find, usually discover that they have far more in <span class=\"blank\" data-q=\"6\">(6)</span> than they had imagined - and the <span class=\"wv\" data-term=\"occasional\" data-ipa=\"/əˈkeɪʒənl/\" data-vn=\"thỉnh thoảng mới xảy ra\">occasional</span> <span class=\"wv\" data-term=\"argument\" data-ipa=\"/ˈɑːɡjumənt/\" data-vn=\"cuộc tranh cãi, cãi vã\">argument</span> is soon forgotten.", "blanks": [{"options": ["out", "off", "up", "in"], "key": 2, "explain": "'Sign up for' = đăng kí (tài khoản mới); 'sign in' là đăng nhập vào tài khoản đã có. Cụm từ 'her first account' phía sau khẳng định đây là lần đăng kí đầu tiên."}, {"options": ["widen", "widening", "to widen", "widened"], "key": 1, "explain": "Cấu trúc 'far from + V-ing' = hoàn toàn không hề. Sau giới từ 'from' bắt buộc dùng V-ing 'widening' (nới rộng khoảng cách) - và nghĩa cũng đối lập với 'close it' ở vế sau."}, {"options": ["would learn", "learn", "learned", "will learn"], "key": 1, "explain": "'Provided (that)' mở đầu mệnh đề điều kiện nên dùng hiện tại đơn 'learn' dù ý nghĩa hướng về tương lai, giống mệnh đề if."}, {"options": ["has never been", "is never", "had never been", "was never being"], "key": 2, "explain": "'Wishing it had never been posted' = ước gì nó chưa từng được đăng - wish + quá khứ hoàn thành bị động cho điều trái với quá khứ. Đây là chỗ trống khó nhất bài: phải nhận ra cả yếu tố 'wish', 'quá khứ' lẫn 'bị động'."}, {"options": ["take", "hold", "make", "give"], "key": 0, "explain": "'Take offence' = cảm thấy bị xúc phạm, phật ý. Người đùa là cháu, ông bà là người nhận trò đùa nên chỉ có thể 'take offence'; 'give offence' là làm người khác phật ý - ngược vai hoàn toàn. Không có cụm 'make/hold offence'."}, {"options": ["similarity", "contact", "touch", "common"], "key": 3, "explain": "Cụm cố định 'have (a lot) in common' = có nhiều điểm chung. 'In touch' và 'in contact' nói về việc giữ liên lạc, không đi với 'have far more'."}]},
{"n": 3, "topic": "TREES ON TOWERS: THE VERTICAL FOREST", "html": "Imagine an <span class=\"wv\" data-term=\"apartment block\" data-ipa=\"/əˈpɑːtmənt blɒk/\" data-vn=\"tòa nhà chung cư\">apartment block</span> whose <span class=\"wv\" data-term=\"balcony\" data-ipa=\"/ˈbælkəni/\" data-vn=\"ban công\">balconies</span> are covered in trees and <span class=\"wv\" data-term=\"shrub\" data-ipa=\"/ʃrʌb/\" data-vn=\"cây bụi\">shrubs</span>. Such &#x27;vertical forests&#x27; already <span class=\"blank\" data-q=\"1\">(1)</span> in Milan and Singapore, and architects believe they will become standard within a decade. The plants <span class=\"wv\" data-term=\"absorb\" data-ipa=\"/əbˈzɔːb/\" data-vn=\"hấp thụ, hút vào\">absorb</span> <span class=\"wv\" data-term=\"carbon dioxide\" data-ipa=\"/ˈkɑːbən daɪˈɒksaɪd/\" data-vn=\"khí carbon dioxide (CO2)\">carbon dioxide</span> and <span class=\"wv\" data-term=\"release\" data-ipa=\"/rɪˈliːs/\" data-vn=\"thải ra, giải phóng\">release</span> <span class=\"wv\" data-term=\"oxygen\" data-ipa=\"/ˈɒksɪdʒən/\" data-vn=\"khí oxy\">oxygen</span>, while their leaves <span class=\"wv\" data-term=\"shade\" data-ipa=\"/ʃeɪd/\" data-vn=\"che bóng, tạo bóng mát\">shade</span> the rooms behind them, so <span class=\"wv\" data-term=\"resident\" data-ipa=\"/ˈrezɪdənt/\" data-vn=\"cư dân, người sống trong tòa nhà\">residents</span> need far less <span class=\"wv\" data-term=\"air conditioning\" data-ipa=\"/ˈeə kəndɪʃənɪŋ/\" data-vn=\"hệ thống điều hòa không khí\">air conditioning</span>. Critics point out that the trees must be carefully <span class=\"wv\" data-term=\"maintain\" data-ipa=\"/meɪnˈteɪn/\" data-vn=\"bảo trì, chăm sóc, duy trì\">maintained</span>: if a large <span class=\"wv\" data-term=\"branch\" data-ipa=\"/brɑːntʃ/\" data-vn=\"cành cây\">branch</span> <span class=\"blank\" data-q=\"2\">(2)</span> during a storm, it could damage the floors below. Supporters reply that the same <span class=\"wv\" data-term=\"objection\" data-ipa=\"/əbˈdʒekʃn/\" data-vn=\"ý kiến phản đối, điểm bất cập\">objection</span> <span class=\"wv\" data-term=\"apply to\" data-ipa=\"/əˈplaɪ tuː/\" data-vn=\"cũng đúng với, áp dụng cho\">applies to</span> any tall <span class=\"wv\" data-term=\"structure\" data-ipa=\"/ˈstrʌktʃə(r)/\" data-vn=\"công trình, kết cấu\">structure</span>, and that the benefits far <span class=\"blank\" data-q=\"3\">(3)</span> the risks. Whatever the objections, the idea is clearly <span class=\"blank\" data-q=\"4\">(4)</span> root: similar projects are now planned in Paris, Toronto and Nanjing. Cities are <span class=\"wv\" data-term=\"run out of\" data-ipa=\"/rʌn aʊt ɒv/\" data-vn=\"sắp cạn kiệt, hết dần\">running out of</span> ground space, so we shall have to grow <span class=\"wv\" data-term=\"upwards\" data-ipa=\"/ˈʌpwədz/\" data-vn=\"theo hướng lên trên, lên cao\">upwards</span> - and a wiser approach is to concentrate on working with nature rather than <span class=\"blank\" data-q=\"5\">(5)</span> it. Studies link green <span class=\"wv\" data-term=\"surroundings\" data-ipa=\"/səˈraʊndɪŋz/\" data-vn=\"môi trường xung quanh\">surroundings</span> to lower stress and better <span class=\"wv\" data-term=\"mental health\" data-ipa=\"/ˈmentl helθ/\" data-vn=\"sức khỏe tinh thần\">mental health</span>, benefits that can <span class=\"blank\" data-q=\"6\">(6)</span> only when nature is brought back into the city.", "blanks": [{"options": ["stay", "lie", "remain", "stand"], "key": 3, "explain": "Công trình, tòa nhà dùng động từ 'stand' (sừng sững, tọa lạc). 'Lie' dùng cho thị trấn/vùng đất trải rộng; 'stay/remain' không mô tả vị trí của tòa nhà theo cách này."}, {"options": ["falls", "will fall", "has fallen", "would fall"], "key": 0, "explain": "Mệnh đề if nói về khả năng có thật trong tương lai/tình huống chung dùng hiện tại đơn 'falls', dù mệnh đề chính dùng 'could'. Không dùng will/would sau if trong cấu trúc này."}, {"options": ["overlook", "outweigh", "outnumber", "overtake"], "key": 1, "explain": "'Outweigh' = có giá trị/nặng ký hơn khi cân nhắc (benefits outweigh risks). 'Outnumber' là đông hơn về số lượng, 'overtake' là vượt qua khi di chuyển, 'overlook' = bỏ qua, không để ý - cần chủ ngữ là người, 'lợi ích' không thể 'bỏ qua' rủi ro."}, {"options": ["putting", "setting", "taking", "getting"], "key": 2, "explain": "Cụm 'take root' = bén rễ, bắt đầu phát triển và lan rộng (dùng cho ý tưởng, phong trào). Không có cụm 'get/set/put root'."}, {"options": ["fighting", "fight", "to fight", "fought"], "key": 0, "explain": "Cấu trúc song song: 'concentrate on working with nature rather than fighting it' - sau 'rather than' phải dùng cùng dạng V-ing với 'working' ở vế trước. Đây là bẫy song song kinh điển: HS hay chọn 'fight' hoặc 'to fight' vì quen với cấu trúc 'would rather... than'."}, {"options": ["achieve", "achieved", "achieving", "be achieved"], "key": 3, "explain": "'Benefits that can be achieved' - lợi ích là thứ 'được đạt được' (bị động) nhờ hành động của con người, nên sau 'can' phải dùng 'be achieved'. 'Achieve' trần sẽ biến 'benefits' thành chủ thể tự đạt được điều gì đó, vô nghĩa."}]},
{"n": 4, "topic": "A FORUM RUN BY THE YOUNG", "html": "Next month, two hundred students from across Southeast Asia will <span class=\"wv\" data-term=\"gather\" data-ipa=\"/ˈɡæðə(r)/\" data-vn=\"tụ họp, tập trung\">gather</span> in Da Nang for a youth forum on the region&#x27;s future. The event is organised entirely by students, who believe young people <span class=\"wv\" data-term=\"deserve\" data-ipa=\"/dɪˈzɜːv/\" data-vn=\"xứng đáng được\">deserve</span> a stronger voice in decisions shaping their lives. In discussion groups, participants will <span class=\"wv\" data-term=\"debate\" data-ipa=\"/dɪˈbeɪt/\" data-vn=\"tranh luận, thảo luận\">debate</span> issues <span class=\"wv\" data-term=\"range from ... to ...\" data-ipa=\"/reɪndʒ frɒm/\" data-vn=\"bao gồm từ ... đến ...\">ranging from</span> <span class=\"wv\" data-term=\"climate change\" data-ipa=\"/ˈklaɪmət tʃeɪndʒ/\" data-vn=\"biến đổi khí hậu\">climate change</span> to <span class=\"wv\" data-term=\"digital\" data-ipa=\"/ˈdɪdʒɪtl/\" data-vn=\"thuộc kỹ thuật số, trên mạng\">digital</span> safety, and each group will be asked to <span class=\"blank\" data-q=\"1\">(1)</span> a set of <span class=\"wv\" data-term=\"proposal\" data-ipa=\"/prəˈpəʊzl/\" data-vn=\"đề xuất, kiến nghị\">proposals</span> to present to real <span class=\"wv\" data-term=\"official\" data-ipa=\"/əˈfɪʃl/\" data-vn=\"quan chức, cán bộ\">officials</span> on the final day. By then, each group will already <span class=\"blank\" data-q=\"2\">(2)</span> its <span class=\"wv\" data-term=\"proposal\" data-ipa=\"/prəˈpəʊzl/\" data-vn=\"đề xuất, kiến nghị\">proposals</span> at least twice, with help from teachers acting as <span class=\"wv\" data-term=\"adviser\" data-ipa=\"/ədˈvaɪzə(r)/\" data-vn=\"người cố vấn\">advisers</span>. Reaching agreement will not be easy: the delegates come from eleven countries, <span class=\"blank\" data-q=\"3\">(3)</span> <span class=\"wv\" data-term=\"priority\" data-ipa=\"/praɪˈɒrəti/\" data-vn=\"việc được ưu tiên, mối quan tâm hàng đầu\">priorities</span> do not always <span class=\"wv\" data-term=\"coincide\" data-ipa=\"/ˌkəʊɪnˈsaɪd/\" data-vn=\"trùng khớp, đồng nhất (quan điểm)\">coincide</span>. <span class=\"wv\" data-term=\"nevertheless\" data-ipa=\"/ˌnevəðəˈles/\" data-vn=\"tuy nhiên, dù vậy\">Nevertheless</span>, the organisers remain <span class=\"wv\" data-term=\"committed (to)\" data-ipa=\"/kəˈmɪtɪd/\" data-vn=\"cam kết, quyết tâm thực hiện\">committed</span> to <span class=\"blank\" data-q=\"4\">(4)</span> every participant a fair chance to speak, whatever their level of English. If the forum succeeds, its greatest <span class=\"wv\" data-term=\"achievement\" data-ipa=\"/əˈtʃiːvmənt/\" data-vn=\"thành tựu, thành quả\">achievement</span> may be the experience of finding <span class=\"blank\" data-q=\"5\">(5)</span> ground with people whose lives are very different from one&#x27;s own - and friendships that could <span class=\"blank\" data-q=\"6\">(6)</span> a lifetime.", "blanks": [{"options": ["come up", "sum up", "draw up", "take up"], "key": 2, "explain": "'Draw up' = soạn thảo (văn bản, danh sách đề xuất). 'Come up' phải đi với 'with'; 'sum up' = tóm tắt lại nội dung đã có, không phải soạn mới; 'take up' = bắt đầu (sở thích/vấn đề)."}, {"options": ["be revising", "have revised", "revise", "revised"], "key": 1, "explain": "'By then' + 'already' khóa chặt tương lai hoàn thành 'will already have revised' - hành động đã hoàn tất trước mốc tương lai. 'Will already revise' sai cấu trúc với 'already'; 'will be revising' mâu thuẫn với 'at least twice' (đếm số lần hoàn thành)."}, {"options": ["their", "whose", "of which", "which"], "key": 1, "explain": "Cần đại từ quan hệ sở hữu 'whose' (ưu tiên của họ - của các đại biểu). 'Of which' không dùng cho người theo cách này; 'their' làm câu thiếu liên kết mệnh đề."}, {"options": ["given", "give", "to give", "giving"], "key": 3, "explain": "'Be committed to' - chữ 'to' ở đây là giới từ, nên theo sau là V-ing 'giving'. Đây là bẫy nổi tiếng: HS thường chọn 'to give' vì thấy chữ to."}, {"options": ["common", "solid", "mutual", "joint"], "key": 0, "explain": "Cụm cố định 'common ground' = điểm chung, cơ sở đồng thuận. 'Solid ground' là ẩn dụ về chỗ đứng vững chắc, không dùng cho điểm chung giữa người với người; không nói 'joint/mutual ground' trong cụm này."}, {"options": ["stay", "keep", "last", "remain"], "key": 2, "explain": "'Last a lifetime' = kéo dài suốt đời, bền lâu trọn đời. 'Remain/stay/keep' không đi với tân ngữ khoảng thời gian 'a lifetime' theo cấu trúc này."}]}
];
const LS = 'advcloze_exam_t1_v1';
const TOTAL = 24;
let S = { cur: 1, sel: {}, fs: 100, hlHtml: {}, submitted: false, correct: null };
try { const s = JSON.parse(localStorage.getItem(LS)); if (s) S = Object.assign(S, s); } catch(e) {}
if (!S.sel) S.sel = {};
if (!S.hlHtml) S.hlHtml = {};
if (!DATA.some(function(x){ return x.n === S.cur; })) S.cur = DATA[0].n;
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {} }
const $ = function(id){ return document.getElementById(id); };
const picker = $('picker');
DATA.forEach(function(s){ const o = document.createElement('option'); o.value = s.n; o.textContent = 'Sample ' + s.n + ' - ' + s.topic; picker.appendChild(o); });

function keyOf(n, q){ return n + '_' + q; }
function curSample(){ return DATA.find(function(x){ return x.n === S.cur; }) || DATA[0]; }
function curIdx(){ return DATA.findIndex(function(x){ return x.n === S.cur; }); }
function answeredIn(n){ let c = 0; for (let q = 1; q <= 6; q++){ if (S.sel[keyOf(n, q)] != null) c++; } return c; }
function answeredTotal(){ return DATA.reduce(function(t, s){ return t + answeredIn(s.n); }, 0); }
function grade(){
  let correct = 0; const detail = [];
  DATA.forEach(function(s){ s.blanks.forEach(function(b, i){
    const v = S.sel[keyOf(s.n, i + 1)];
    detail.push(v == null ? -1 : v);
    if (v === b.key) correct++;
  }); });
  return { correct: correct, detail: detail };
}

function render(){
  const s = curSample();
  picker.value = S.cur;
  $('topic').textContent = s.topic;
  const pg = $('passage');
  pg.innerHTML = (S.hlHtml && S.hlHtml[S.cur]) ? S.hlHtml[S.cur] : s.html;
  for (let q = 1; q <= 6; q++){
    const bl = pg.querySelector('.blank[data-q="' + q + '"]');
    if (!bl) continue;
    const b = s.blanks[q - 1], v = S.sel[keyOf(S.cur, q)];
    bl.className = 'blank';
    if (!S.submitted){
      if (v != null){ bl.textContent = b.options[v]; bl.classList.add('picked'); }
      else bl.textContent = '(' + q + ')';
    } else {
      if (v != null){ bl.textContent = b.options[v]; bl.classList.add(v === b.key ? 'filled' : 'wrongfill'); }
      else { bl.textContent = b.options[b.key]; bl.classList.add('shown'); }
    }
  }
  const wrap = $('questions'); wrap.innerHTML = '';
  s.blanks.forEach(function(b, i){
    const q = i + 1, v = S.sel[keyOf(S.cur, q)];
    const card = document.createElement('div'); card.className = 'qcard';
    let st = '';
    if (S.submitted){
      if (v === b.key) st = '<span style="color:var(--green)">✔ Đúng</span>';
      else if (v == null) st = '<span style="color:var(--orange)">Chưa làm</span>';
      else st = '<span style="color:var(--red)">✘ Sai</span>';
    }
    card.innerHTML = '<div class="qhead"><span>Câu ' + q + '</span><span class="st">' + st + '</span></div>';
    const opts = document.createElement('div'); opts.className = 'opts';
    b.options.forEach(function(op, oi){
      const btn = document.createElement('button'); btn.className = 'opt';
      btn.textContent = 'ABCD'[oi] + '. ' + op;
      if (!S.submitted){
        if (v === oi) btn.classList.add('sel');
        btn.onclick = function(){ pick(q, oi); };
      } else {
        btn.disabled = true;
        if (oi === b.key) btn.classList.add('right');
        if (v === oi && v !== b.key) btn.classList.add('wrongpick');
      }
      opts.appendChild(btn);
    });
    card.appendChild(opts);
    const ex = document.createElement('div');
    ex.className = 'expl' + (S.submitted ? ' show' : '');
    ex.textContent = S.submitted ? b.explain : '';
    card.appendChild(ex);
    wrap.appendChild(card);
  });
  $('score').textContent = 'Đã làm: ' + answeredTotal() + '/' + TOTAL;
  const rb = $('result');
  if (S.submitted){
    const y = Math.round(S.correct / TOTAL * 100) / 10;
    rb.style.display = 'block';
    rb.textContent = 'Kết quả: ' + S.correct + '/' + TOTAL + ' đúng - điểm ' + y + '/10';
    $('submitBtn').style.display = 'none';
  } else {
    rb.style.display = 'none';
    $('submitBtn').style.display = '';
  }
  renderChips();
}
function renderChips(){
  const c = $('chips'); c.innerHTML = '';
  DATA.forEach(function(s){
    const a = answeredIn(s.n);
    const el = document.createElement('button');
    el.className = 'schip' + (a === 6 ? ' full' : '') + (s.n === S.cur ? ' cur' : '');
    el.textContent = s.n + ': ' + a + '/6';
    el.onclick = function(){ S.cur = s.n; save(); render(); };
    c.appendChild(el);
  });
}
function pick(q, oi){
  if (S.submitted) return;
  S.sel[keyOf(S.cur, q)] = oi; save();
  const s = curSample(), b = s.blanks[q - 1];
  const card = $('questions').children[q - 1];
  if (card){
    const btns = card.querySelectorAll('.opt');
    btns.forEach(function(btn, bi){ btn.classList.toggle('sel', bi === oi); });
  }
  const bl = $('passage').querySelector('.blank[data-q="' + q + '"]');
  if (bl){ bl.textContent = b.options[oi]; bl.className = 'blank picked'; }
  $('score').textContent = 'Đã làm: ' + answeredTotal() + '/' + TOTAL;
  renderChips();
}
function doSubmit(){
  if (S.submitted) return;
  const r = grade();
  S.submitted = true; S.correct = r.correct; save();
  if (typeof window.hwSendResult === 'function'){ try { window.hwSendResult(r.correct, TOTAL, r.detail); } catch(e) {} }
  $('cmodal').classList.remove('open');
  render();
}
$('submitBtn').onclick = function(){
  if (S.submitted) return;
  const missing = TOTAL - answeredTotal();
  $('cText').textContent = 'Sau khi nộp bài, đáp án sẽ bị khóa và không sửa lại được.' + (missing > 0
    ? ' Bạn còn ' + missing + ' câu chưa làm - câu chưa làm sẽ tính là sai.'
    : ' Bạn đã làm đủ ' + TOTAL + ' câu.');
  $('cmodal').classList.add('open');
};
$('cYes').onclick = function(){ doSubmit(); };
$('cNo').onclick = function(){ $('cmodal').classList.remove('open'); };
$('cmodal').addEventListener('click', function(e){ if (e.target === $('cmodal')) $('cmodal').classList.remove('open'); });
window.hwOnTimeUp = function(){ if (!S.submitted) doSubmit(); };
picker.onchange = function(){ S.cur = +picker.value; save(); render(); };
$('prevBtn').onclick = function(){ const i = curIdx(); if (i > 0){ S.cur = DATA[i - 1].n; save(); render(); } };
$('nextBtn').onclick = function(){ const i = curIdx(); if (i < DATA.length - 1){ S.cur = DATA[i + 1].n; save(); render(); } };
// vocab pop-up (center)
document.addEventListener('click', function(e){
  const w = e.target.closest('.wv');
  if (w){
    $('mTerm').textContent = w.dataset.term;
    $('mIpa').textContent = w.dataset.ipa;
    $('mVn').textContent = w.dataset.vn;
    $('modal').classList.add('open');
  }
});
$('modalX').onclick = function(){ $('modal').classList.remove('open'); };
$('modal').addEventListener('click', function(e){ if (e.target === $('modal')) $('modal').classList.remove('open'); });
// zoom
function applyFs(){ document.documentElement.style.setProperty('--fs', (17 * S.fs / 100) + 'px'); }
$('zoomIn').onclick = function(){ S.fs = Math.min(140, S.fs + 10); save(); applyFs(); };
$('zoomOut').onclick = function(){ S.fs = Math.max(80, S.fs - 10); save(); applyFs(); };
applyFs();
// highlight (snapshot-based persistence)
let hlOn = false;
$('hlBtn').onclick = function(){ hlOn = !hlOn; $('hlBtn').classList.toggle('on', hlOn); };
document.addEventListener('mouseup', function(){
  if (!hlOn) return;
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const pg = $('passage');
  if (!pg.contains(range.startContainer) || range.startContainer !== range.endContainer || range.startContainer.nodeType !== 3) return;
  if (range.startContainer.parentElement.closest('.blank')) return;
  const mark = document.createElement('mark'); mark.className = 'hl';
  try { range.surroundContents(mark); } catch(e) { return; }
  S.hlHtml = S.hlHtml || {}; S.hlHtml[S.cur] = pg.innerHTML; save(); sel.removeAllRanges();
});
document.addEventListener('click', function(e){
  if (hlOn && e.target.tagName === 'MARK'){
    const pg = $('passage');
    const parent = e.target.parentNode;
    parent.replaceChild(document.createTextNode(e.target.textContent), e.target);
    parent.normalize();
    S.hlHtml = S.hlHtml || {}; S.hlHtml[S.cur] = pg.innerHTML; save();
  }
});
render();
</script>
<script>
/* HW Bridge v1 - gui ket qua ve Homework Space khi bai duoc nhung trong app.
   Goi: hwSendResult(correct, total, answers) sau khi HS nop bai trong file. */
window.hwSendResult = function (correct, total, answers) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(
        { type: 'hw-result', v: 1, correct: correct, total: total, answers: answers || [] },
        '*'
      );
    }
  } catch (e) { /* mo file doc lap: bo qua */ }
};
/* Nhan dien app: khi duoc nhung, app gui {type:'hw-hello', v:1, code, assignmentId} luc tai xong.
   Nhan hw-timeup nghia la het gio - file nen tu khoa bai / tu nop giup HS. */
window.addEventListener('message', function (e) {
  var d = e && e.data;
  if (!d || d.v !== 1) return;
  if (d.type === 'hw-hello') { window.hwStudentCode = d.code; window.hwAssignmentId = d.assignmentId; }
  if (d.type === 'hw-timeup' && typeof window.hwOnTimeUp === 'function') { window.hwOnTimeUp(); }
});
</script>
