<script>
const DATA = {"A": [{"n": 1, "stem": "Local businesses ______ a large sum of money to build a new library for the village children.", "options": ["participated", "donated", "volunteered", "delivered"], "key": 1, "expl": "<span class=\"bw\" data-w=\"donate\">Donate</span> money = quyên góp tiền cho mục đích từ thiện."}, {"n": 2, "stem": "She is always willing to share what she has with others. She is very ______.", "options": ["endless", "remote", "generous", "homeless"], "key": 2, "expl": "<span class=\"bw\" data-w=\"generous\">Generous</span> = hào phóng, sẵn sàng chia sẻ với người khác."}, {"n": 3, "stem": "Our school is holding a charity run to ______ money for children with heart disease.", "options": ["grow", "lift", "rise", "raise"], "key": 3, "expl": "Raise money = gây quỹ; rise không đi với tân ngữ."}, {"n": 4, "stem": "Volunteers ______ hot meals to <span class=\"bw\" data-w=\"elderly\">elderly</span> people who live alone every Sunday.", "options": ["raise", "donate", "deliver", "spend"], "key": 2, "expl": "Deliver = mang đến tận nơi: phát suất ăn tận nhà cho người già neo đơn."}, {"n": 5, "stem": "This clean-water programme will bring great ______ to farmers in <span class=\"bw\" data-w=\"remote\">remote</span> areas.", "options": ["advertisements", "benefits", "applications", "items"], "key": 1, "expl": "Bring <span class=\"bw\" data-w=\"benefits\">benefits</span> to = mang lại lợi ích cho ai."}, {"n": 6, "stem": "Teenagers who ______ in community work often become more confident and responsible.", "options": ["appear", "deliver", "participate", "donate"], "key": 2, "expl": "<span class=\"bw\" data-w=\"participate\">Participate</span> in = tham gia vào hoạt động cộng đồng."}, {"n": 7, "stem": "You need to send in your ______ before the deadline if you want to join the volunteer team.", "options": ["application", "advertisement", "item", "announcement"], "key": 0, "expl": "<span class=\"bw\" data-w=\"application\">Application</span> = đơn đăng ký; send in your <span class=\"bw\" data-w=\"application\">application</span> = nộp đơn."}, {"n": 8, "stem": "While I ______ dinner, the phone rang three times.", "options": ["am cooking", "cook", "cooked", "was cooking"], "key": 3, "expl": "Hành động dài đang diễn ra (đang nấu ăn) bị hành động ngắn xen vào: quá khứ tiếp diễn."}, {"n": 9, "stem": "She ______ her <span class=\"bw\" data-w=\"ankle\">ankle</span> while she ______ in the park.", "options": ["was twisting - ran", "twisted - runs", "twists - is running", "twisted - was running"], "key": 3, "expl": "Bị trẹo chân (hành động ngắn, quá khứ đơn) trong khi đang chạy (quá khứ tiếp diễn)."}, {"n": 10, "stem": "At 7 o&#x27;clock last night, the volunteers ______ food <span class=\"bw\" data-w=\"parcels\">parcels</span> for the flood <span class=\"bw\" data-w=\"victims\">victims</span>.", "options": ["packed", "were packing", "pack", "have packed"], "key": 1, "expl": "Hành động đang diễn ra tại một thời điểm xác định trong quá khứ: quá khứ tiếp diễn."}, {"n": 11, "stem": "He ______ TV when the power suddenly went out.", "options": ["watches", "has watched", "watched", "was watching"], "key": 3, "expl": "Đang xem TV (hành động dài) thì mất điện (hành động ngắn xen vào)."}, {"n": 12, "stem": "While the teacher ______ the instructions, two students were <span class=\"bw\" data-w=\"whispering\">whispering</span> at the back of the class.", "options": ["explained", "explains", "was explaining", "explain"], "key": 2, "expl": "Hai hành động song song đang diễn ra với While: đều dùng quá khứ tiếp diễn."}, {"n": 13, "stem": "They ______ in a small village when the storm hit the coast.", "options": ["were staying", "stay", "are staying", "stayed"], "key": 0, "expl": "Đang ở tại làng (nền dài) thì bão ập đến (hành động ngắn): were staying."}, {"n": 14, "stem": "I met an old friend while I ______ for the bus.", "options": ["was waiting", "waited", "am waiting", "wait"], "key": 0, "expl": "Gặp bạn cũ (hành động ngắn) trong lúc đang chờ xe buýt (hành động dài)."}, {"n": 15, "stem": "The children were playing outside when it suddenly ______ to rain heavily.", "options": ["was starting", "started", "has started", "starts"], "key": 1, "expl": "Bắt đầu mưa là hành động ngắn xen vào hành động đang chơi: quá khứ đơn."}], "C1": {"tpl": "Last summer, students from my school built a small library for children in a {16} mountain village. For two months, they collected used books from friends and <span class=\"bw\" data-w=\"neighbours\">neighbours</span>. A local bookshop also {17} 300 new books to the project. Before the trip, all the students {18} in a training course to learn how to run reading games for young children. On the opening day, the children {19} outside the school gate long before the group arrived. Now the library opens every weekend. Older pupils read stories to the younger ones, and parents can <span class=\"bw\" data-w=\"borrow\">borrow</span> books to read at home. The project has brought real {20} to the village. For the students, it was a {21} <span class=\"bw\" data-w=\"experience\">experience</span>: they saw with their own eyes how a small action can {22} a big <span class=\"bw\" data-w=\"difference\">difference</span> to other people&#x27;s lives.", "blanks": [{"n": 16, "options": ["remote", "rich", "noisy", "crowded"], "key": 0, "expl": "<span class=\"bw\" data-w=\"remote\">Remote</span> = xa xôi, hẻo lánh: ngôi làng miền núi xa xôi."}, {"n": 17, "options": ["bought", "donated", "sold", "raised"], "key": 1, "expl": "<span class=\"bw\" data-w=\"donate\">Donate</span> = tặng, quyên góp: hiệu sách tặng 300 cuốn sách mới cho dự án."}, {"n": 18, "options": ["entered", "joined", "participated", "attended"], "key": 2, "expl": "<span class=\"bw\" data-w=\"participate\">Participate</span> in = tham gia vào; join/attend/enter không đi với giới từ in trong câu này."}, {"n": 19, "options": ["were waiting", "waited", "wait", "are waiting"], "key": 0, "expl": "Trẻ em đang chờ sẵn từ trước khi nhóm đến (hành động đang diễn ra): quá khứ tiếp diễn."}, {"n": 20, "options": ["benefits", "items", "applications", "chances"], "key": 0, "expl": "Bring <span class=\"bw\" data-w=\"benefits\">benefits</span> to = mang lại lợi ích cho cả làng."}, {"n": 21, "options": ["meant", "meaningful", "meaningless", "meaning"], "key": 1, "expl": "Sau mạo từ a cần tính từ: <span class=\"bw\" data-w=\"meaningful\">meaningful</span> = có ý nghĩa."}, {"n": 22, "options": ["give", "do", "make", "take"], "key": 2, "expl": "Cụm cố định: make a <span class=\"bw\" data-w=\"difference\">difference</span> = tạo ra thay đổi tích cực."}]}, "C2": {"tpl": "Last October, heavy rain fell for three days in our town. On the third night, while most people {23}, the river suddenly rose and water entered the streets. Mr Nam, a <span class=\"bw\" data-w=\"retired\">retired</span> teacher, {24} the <span class=\"bw\" data-w=\"alarm\">alarm</span> bell at the village hall. At once, dozens of young volunteers rushed out of their homes. While some of them {25} <span class=\"bw\" data-w=\"sandbags\">sandbags</span> along the river bank, others knocked on doors to wake families up. Mrs Hoa {26} her two <span class=\"bw\" data-w=\"grandchildren\">grandchildren</span> to the hall when a strong young man offered to carry them on his motorbike. By midnight, everyone {27} <span class=\"bw\" data-w=\"safely\">safely</span> inside the hall. The next morning, the rain {28}, and people went home to clean their houses. “<b>We were lucky,</b>” Mr Nam said. “<b>When <span class=\"bw\" data-w=\"neighbours\">neighbours</span> help <span class=\"bw\" data-w=\"neighbours\">neighbours</span>, no one {29} alone in hard times.</b>”", "blanks": [{"n": 23, "options": ["slept", "were sleeping", "sleep", "are sleeping"], "key": 1, "expl": "While + hành động dài đang diễn ra trong quá khứ: were sleeping."}, {"n": 24, "options": ["rang", "rings", "ring", "was ringing"], "key": 0, "expl": "Hành động ngắn, hoàn tất (rung chuông báo động)       return '<div class="item"><div class="stem">' + w.n + '. ' + w.orig + '</div>' +
        '<div class="note">(' + w.direct + ')</div>' +
        '<textarea class="rw ' + cls + '" data-rw="' + w.n + '" placeholder="Gõ câu viết lại vào đây..." ' + (locked ? 'disabled' : '') + '>' + v.replace(/</g, '&lt;') + '</textarea>' + acts +
        '<div class="model' + (modelOpen ? ' open' : '') + '"><b>Đáp án mẫu:</b> ' + w.model + '<br>' + w.expl + '</div></div>';
    }).join('');
  document.querySelectorAll('[data-rw]').forEach(t => t.oninput = () => { S.rw[+t.dataset.rw] = t.value; save(); refreshTop(); });
  document.querySelectorAll('[data-rchk]').forEach(b => b.onclick = () => {
    const w = DATA.W.find(x => x.n === +b.dataset.rchk);
    if (rwOK(w)){ S.st[w.n] = 'ok'; save(); renderAll(); }
    else {
      const t = document.querySelector('textarea[data-rw="' + w.n + '"]');
      if (t) { t.classList.add('bad'); setTimeout(() => t.classList.remove('bad'), 900); }
      const h = $('hint' + w.n); if (h) h.classList.add('on');
    }
  });
  document.querySelectorAll('[data-rshow]').forEach(b => b.onclick = () => {
    S.st[+b.dataset.rshow] = 'shown'; save(); renderAll();
  });
}
/* ---------- Render all ---------- */
function renderAll(){ renderA(); renderC('C1'); renderC('C2'); renderR(); renderW(); refreshTop(); }
/* ---------- Tabs ---------- */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  document.querySelectorAll('section.blk').forEach(s => s.classList.remove('on'));
  $('sec' + b.dataset.t).classList.add('on');
});
/* ---------- Brown vocab pop-up ---------- */
document.addEventListener('click', e => {
  const bw = e.target.closest('.bw');
  if (bw) { e.stopPropagation(); openPop(bw.dataset.w); }
});
function openPop(w){
  const v = DATA.VOCAB[w]; if (!v) return;
  $('popw').textContent = w;
  $('popmeta').textContent = v.type + ' · ' + v.ipa;
  $('popen').textContent = v.en;
  $('popvn').textContent = v.vn;
  $('popwrap').style.display = 'flex';
}
$('popx').onclick = () => $('popwrap').style.display = 'none';
$('popwrap').onclick = e => { if (e.target.id === 'popwrap') e.target.style.display = 'none'; };
/* ---------- Highlight (reading passage, persisted) ---------- */
let hlOn = false;
$('hlBtn').onclick = () => { hlOn = !hlOn; $('hlBtn').classList.toggle('on', hlOn); };
document.addEventListener('mouseup', () => {
  if (!hlOn) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const rp = $('readpass');
  if (!rp || !$('secR').classList.contains('on')) return;
  if (!rp.contains(range.commonAncestorContainer)) return;
  try {
    const mark = document.createElement('mark'); mark.className = 'hl';
    mark.appendChild(range.extractContents());
    range.insertNode(mark);
    sel.removeAllRanges();
    S.hl = rp.innerHTML; save();
  } catch (err) {}
});
$('hlClear').onclick = () => {
  const rp = $('readpass');
  if (rp) rp.querySelectorAll('mark.hl').forEach(mk => mk.replaceWith(...mk.childNodes));
  S.hl = ''; save();
};
/* ---------- Zoom / reset ---------- */
let zoom = S.zoom || 1;
function applyZoom(){ document.documentElement.style.setProperty('--zoom', zoom); }
applyZoom();
$('zin').onclick = () => { zoom = Math.min(1.5, +(zoom + 0.1).toFixed(2)); S.zoom = zoom; save(); applyZoom(); };
$('zout').onclick = () => { zoom = Math.max(0.75, +(zoom - 0.1).toFixed(2)); S.zoom = zoom; save(); applyZoom(); };
$('resetBtn').onclick = () => { localStorage.removeItem(LS); location.reload(); };
/* ---------- Submit ---------- */
function doSubmit(force){
  if (S.submitted) return;
  const left = 40 - answered();
  if (!force && left > 0 && !confirm('Còn ' + left + ' câu chưa làm. Nộp bài luôn?')) return;
  S.correct = correctCount();
  S.submitted = true; save();
  renderAll();
  const answers = [];
  for (let n = 1; n <= 35; n++) answers.push((ALLMCQ[n] ? S.sel[n] : S.cz[n]) !== undefined ? (ALLMCQ[n] ? S.sel[n] : S.cz[n]) : -1);
  DATA.W.forEach(w => answers.push(S.rw[w.n] || ''));
  if (typeof window.hwSendResult === 'function') window.hwSendResult(S.correct, 40, answers);
  window.scrollTo(0, 0);
}
$('submitBtn').onclick = () => doSubmit(false);
window.hwOnTimeUp = function(){ doSubmit(true); };
window.__T = {get S(){ return S; }, DATA, doSubmit, correctCount};
renderAll();
</script>
<script>
/* HW Bridge v1 - gui ket qua ve Homework Space khi bai duoc nhung trong app. */
window.hwSendResult = function (correct, total, answers) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(
        { type: 'hw-result', v: 1, correct: correct, total: total, answers: answers || [] },
        '*'
      );
    }
  } catch (e) { /* mo file doc lap: bo qua */ }
};
window.addEventListener('message', function (e) {
  var d = e && e.data;
  if (!d || d.v !== 1) return;
  if (d.type === 'hw-hello') { window.hwStudentCode = d.code; window.hwAssignmentId = d.assignmentId; }
  if (d.type === 'hw-timeup' && typeof window.hwOnTimeUp === 'function') { window.hwOnTimeUp(); }
});
</script>
