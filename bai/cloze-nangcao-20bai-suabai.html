<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLOZE TEXT: FURTHER PRACTICE - Sửa bài</title>
<style>
:root{ --fs:17px; --brown:#8a5a12; --green:#1e8e4f; --red:#d33; --orange:#e07b00; --line:#d8d8d8; }
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Times New Roman",sans-serif;background:#f4f4f6;color:#1c1c1e;font-size:var(--fs)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:1.15em;margin:0;font-family:"Times New Roman",serif;letter-spacing:.5px}
header .sub{color:#666;font-size:.82em;width:100%}
.chip{background:#eef6f0;border:1px solid #bfe3cc;color:#14532d;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9em}
button.tool{background:#fff;border:1px solid #bbb;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.9em}
button.tool.on{background:#fff3cd;border-color:#e0a800}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select#picker{font-size:.95em;padding:6px;border-radius:8px;border:1px solid #bbb;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.schip{border:1px solid #bbb;background:#fff;border-radius:6px;padding:2px 7px;font-size:.78em;cursor:pointer}
.schip.done{background:#e6f4ea;border-color:var(--green);color:#14532d;font-weight:700}
.schip.cur{outline:2px solid #333}
main{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:start}
@media (max-width:860px){ main{grid-template-columns:1fr} }
.pane{padding:14px;overflow-y:auto;max-height:calc(100vh - 150px)}
@media (max-width:860px){ .pane{max-height:none;overflow:visible} }
.pane.left{border-right:1px solid var(--line);background:#fff}
.topic{font-family:"Times New Roman",serif;font-weight:700;text-align:center;font-size:1.12em;margin:2px 0 10px}
.passage{font-family:"Times New Roman",serif;font-size:1.06em;line-height:1.65;text-align:justify}
.blank{display:inline-block;min-width:2em;text-align:center;background:#eef;border:1px dashed #88a;border-radius:6px;padding:0 4px;font-weight:700;color:#335}
.blank.filled{background:#e6f4ea;border:1px solid var(--green);color:#14532d}
.blank.shown{background:#fff4e0;border:1px solid var(--orange);color:#8a5200}
.wv{color:var(--brown);cursor:pointer;border-bottom:1px dotted var(--brown)}
mark.hl{background:#ffe98a;border-radius:2px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.qcard .qhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.qcard .st{font-size:.85em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:480px){ .opts{grid-template-columns:1fr} }
.opt{border:1px solid #bbb;background:#fff;border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font-size:.95em}
.opt:hover{border-color:#666}
.opt.right{background:#e6f4ea;border-color:var(--green);font-weight:700}
.opt.wrong{background:#fdecec;border-color:var(--red);color:#a00;text-decoration:line-through}
.opt:disabled{cursor:default;opacity:.92}
.fb{font-size:.88em;margin-top:6px;min-height:1.1em}
.fb.bad{color:var(--red)} .fb.good{color:var(--green);font-weight:700} .fb.shown{color:var(--orange)}
.expl{display:none;background:#f7f9f7;border-left:3px solid var(--green);padding:8px 10px;margin-top:8px;font-size:.92em;line-height:1.5}
.expl.show{display:block}
.showbtn{background:none;border:none;color:#06c;cursor:pointer;font-size:.85em;padding:2px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:430px;width:100%;padding:22px 22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.3);position:relative;text-align:center}
.mbox .term{font-size:1.5em;font-weight:800;color:var(--brown)}
.mbox .ipa{font-size:1.15em;color:#444;margin:6px 0}
.mbox .vn{font-size:1.12em;line-height:1.5}
.mbox .x{position:absolute;top:6px;right:12px;background:none;border:none;font-size:1.5em;cursor:pointer;color:#888}
.hint{color:#666;font-size:.85em;padding:6px 14px}
</style>
</head>
<body>
<header>
  <h1>CLOZE TEXT: FURTHER PRACTICE</h1>
  <span class="chip" id="score">Đúng: 0/120</span>
  <button class="tool" id="zoomOut">A-</button>
  <button class="tool" id="zoomIn">A+</button>
  <button class="tool" id="hlBtn">🖍 Tô sáng</button>
  <button class="tool" id="resetBtn">↺ Làm lại từ đầu</button>
  <div class="sub">Advanced Cloze · 20 Samples · 120 câu &nbsp;|&nbsp; Chạm vào <b style="color:#8a5a12">từ màu nâu</b> trong bài đọc để xem phiên âm và nghĩa.</div>
</header>
<div class="bar">
  <button class="tool" id="prevBtn">‹ Trước</button>
  <select id="picker"></select>
  <button class="tool" id="nextBtn">Sau ›</button>
  <div class="chips" id="chips"></div>
</div>
<main>
  <section class="pane left">
    <div class="topic" id="topic"></div>
    <div class="passage" id="passage"></div>
  </section>
  <section class="pane right" id="questions"></section>
</main>
<div id="modal"><div class="mbox">
  <button class="x" id="modalX">×</button>
  <div class="term" id="mTerm"></div>
  <div class="ipa" id="mIpa"></div>
  <div class="vn" id="mVn"></div>
</div></div>
<script>
const DATA = [{"n": 1, "topic": "THE HIDDEN COST OF ENERGY DRINKS", "html": "Energy drinks are marketed as a quick way to stay <span class=\"wv\" data-term=\"alert\" data-ipa=\"/əˈlɜːt/\" data-vn=\"tỉnh táo, nhanh nhạy\">alert</span>, yet doctors are increasingly <span class=\"wv\" data-term=\"concerned\" data-ipa=\"/kənˈsɜːnd/\" data-vn=\"lo ngại, quan ngại\">concerned</span> about the <span class=\"wv\" data-term=\"damage\" data-ipa=\"/ˈdæmɪdʒ/\" data-vn=\"tổn hại, thiệt hại\">damage</span> they can do. Each can contains as much <span class=\"wv\" data-term=\"caffeine\" data-ipa=\"/ˈkæfiːn/\" data-vn=\"caffeine, chất kích thích có trong cà phê và trà\">caffeine</span> as two cups of coffee, plus sugar that the body <span class=\"wv\" data-term=\"absorb\" data-ipa=\"/əbˈzɔːb/\" data-vn=\"hấp thụ, thấm vào cơ thể\">absorbs</span> almost <span class=\"wv\" data-term=\"instantly\" data-ipa=\"/ˈɪnstəntli/\" data-vn=\"ngay lập tức\">instantly</span>. Teenagers who <span class=\"wv\" data-term=\"rely on\" data-ipa=\"/rɪˈlaɪ ɒn/\" data-vn=\"dựa vào, trông cậy vào\">rely on</span> these drinks to <span class=\"wv\" data-term=\"revise\" data-ipa=\"/rɪˈvaɪz/\" data-vn=\"ôn tập (trước kỳ thi)\">revise</span> for exams often find that the habit <span class=\"blank\" data-q=\"1\">(1)</span> on their sleep: wide awake at midnight, they are <span class=\"wv\" data-term=\"exhausted\" data-ipa=\"/ɪɡˈzɔːstɪd/\" data-vn=\"kiệt sức, mệt rã rời\">exhausted</span> the next morning. Worse still, the drinks <span class=\"blank\" data-q=\"2\">(2)</span> to a <span class=\"wv\" data-term=\"racing (heart)\" data-ipa=\"/ˈreɪsɪŋ/\" data-vn=\"đập nhanh dồn dập (tim)\">racing</span> heart and raised <span class=\"wv\" data-term=\"blood pressure\" data-ipa=\"/blʌd ˈpreʃə(r)/\" data-vn=\"huyết áp\">blood pressure</span> in several recent studies. Even if schools <span class=\"blank\" data-q=\"3\">(3)</span> the drinks tomorrow, many students would simply buy them from shops near the school instead. Health experts argue that schools should take a far <span class=\"wv\" data-term=\"strict\" data-ipa=\"/ˈstrɪktə(r)/\" data-vn=\"nghiêm ngặt hơn, chặt chẽ hơn\">stricter</span> <span class=\"blank\" data-q=\"4\">(4)</span>, <span class=\"wv\" data-term=\"ban\" data-ipa=\"/bæn/\" data-vn=\"cấm, việc cấm\">banning</span> sales to anyone under sixteen, as some countries have already done. Until that happens, teenagers themselves must read the <span class=\"wv\" data-term=\"label\" data-ipa=\"/ˈleɪbl/\" data-vn=\"nhãn mác (trên lon, chai)\">label</span> and <span class=\"wv\" data-term=\"think twice\" data-ipa=\"/θɪŋk twaɪs/\" data-vn=\"suy nghĩ thật kỹ trước khi làm gì\">think twice</span> before <span class=\"blank\" data-q=\"5\">(5)</span> another can <span class=\"wv\" data-term=\"out of habit\" data-ipa=\"/aʊt əv ˈhæbɪt/\" data-vn=\"theo thói quen (chứ không phải vì thật sự cần)\">out of habit</span> rather than real need. What begins as a harmless <span class=\"wv\" data-term=\"boost\" data-ipa=\"/buːst/\" data-vn=\"cú hích, sự tăng lực tạm thời\">boost</span> can <span class=\"wv\" data-term=\"quietly\" data-ipa=\"/ˈkwaɪətli/\" data-vn=\"âm thầm, lặng lẽ\">quietly</span> turn into a real <span class=\"blank\" data-q=\"6\">(6)</span> that is hard to <span class=\"wv\" data-term=\"shake off\" data-ipa=\"/ʃeɪk ɒf/\" data-vn=\"rũ bỏ, thoát khỏi (thói quen xấu, cơn bệnh)\">shake off</span>.", "blanks": [{"options": ["pays its price", "does its harm", "takes its toll", "makes its effort"], "key": 2, "explain": "Cụm cố định 'take its toll on' = gây tác hại dần dần lên (giấc ngủ). 'Pay the price' phải đi với 'for' và chủ ngữ là người chịu hậu quả; hai cụm còn lại không tồn tại trong tiếng Anh."}, {"options": ["have linked", "have been linking", "were linking", "have been linked"], "key": 3, "explain": "Nước uống không tự 'liên kết' mình với bệnh - chúng 'được liên hệ' tới nhịp tim nhanh trong các nghiên cứu, nên cần bị động 'have been linked to'. 'Have been linking' sai thể (chủ động), 'have linked themselves' sai vì không có nghĩa phản thân ở đây, 'were linking' sai cả thể lẫn thì."}, {"options": ["banned", "will ban", "ban", "would ban"], "key": 0, "explain": "'Even if schools banned the drinks tomorrow, students would buy them elsewhere' - vế sau dùng 'would' nên đây là điều kiện loại 2, mệnh đề if dùng quá khứ đơn 'banned' dù nói về ngày mai. Phải đọc tới cuối câu mới chọn đúng."}, {"options": ["ban", "line", "limit", "side"], "key": 1, "explain": "'Take a line' = giữ lập trường/thái độ (take a stricter line = cứng rắn hơn). Không nói 'take a limit/ban/side' trong cấu trúc này."}, {"options": ["opening", "opened", "to open", "open"], "key": 0, "explain": "Sau giới từ 'before' phải dùng V-ing: 'before opening another can'. Đây là bẫy kinh điển vì nhiều HS quen dùng to-V sau động từ."}, {"options": ["pressure", "flavour", "behaviour", "addiction"], "key": 3, "explain": "Thứ 'khó rũ bỏ' (hard to shake off) bắt đầu từ một cú hích vô hại chính là 'addiction' - sự nghiện. Các từ còn lại không đi với 'turn into' theo nghĩa này."}]}, {"n": 2, "topic": "WHEN GRANDPARENTS JOIN SOCIAL MEDIA", "html": "When seventy-year-old Mrs Lan decided to sign <span class=\"blank\" data-q=\"1\">(1)</span> for her first social media account, her grandchildren were <span class=\"wv\" data-term=\"amused\" data-ipa=\"/əˈmjuːzd/\" data-vn=\"thấy buồn cười, thích thú\">amused</span>. Within weeks, however, she was <span class=\"wv\" data-term=\"post\" data-ipa=\"/pəʊst/\" data-vn=\"đăng (bài, ảnh lên mạng)\">posting</span> family photos, joining <span class=\"wv\" data-term=\"community\" data-ipa=\"/kəˈmjuːnəti/\" data-vn=\"cộng đồng\">community</span> groups and even correcting her grandson&#x27;s spelling in the comments. Far from <span class=\"blank\" data-q=\"2\">(2)</span> the <span class=\"wv\" data-term=\"generation gap\" data-ipa=\"/ˌdʒenəˈreɪʃn ˈɡæp/\" data-vn=\"khoảng cách thế hệ\">generation gap</span>, technology was quietly helping to close it. Research suggests that older people who use social <span class=\"wv\" data-term=\"platform\" data-ipa=\"/ˈplætfɔːm/\" data-vn=\"nền tảng (mạng xã hội, ứng dụng)\">platforms</span> regularly feel less <span class=\"wv\" data-term=\"lonely\" data-ipa=\"/ˈləʊnli/\" data-vn=\"cô đơn\">lonely</span>, provided they <span class=\"blank\" data-q=\"3\">(3)</span> how to protect their <span class=\"wv\" data-term=\"privacy\" data-ipa=\"/ˈprɪvəsi/\" data-vn=\"sự riêng tư, quyền riêng tư\">privacy</span> online. Problems arise when the generations disagree about what should be shared: a photograph that a grandmother finds <span class=\"wv\" data-term=\"adorable\" data-ipa=\"/əˈdɔːrəbl/\" data-vn=\"đáng yêu\">adorable</span> may leave a teenager wishing it <span class=\"blank\" data-q=\"4\">(4)</span> posted at all. A careless joke by a grandson can also lead a grandparent to <span class=\"blank\" data-q=\"5\">(5)</span> offence, even though none was <span class=\"wv\" data-term=\"intend\" data-ipa=\"/ɪnˈtend/\" data-vn=\"có chủ ý, nhằm mục đích\">intended</span>. Families who talk about these <span class=\"wv\" data-term=\"boundary\" data-ipa=\"/ˈbaʊndəri/\" data-vn=\"ranh giới, giới hạn (trong quan hệ)\">boundaries</span> <span class=\"wv\" data-term=\"openly\" data-ipa=\"/ˈəʊpənli/\" data-vn=\"một cách cởi mở, thẳng thắn\">openly</span>, researchers find, usually discover that they have far more in <span class=\"blank\" data-q=\"6\">(6)</span> than they had imagined - and the <span class=\"wv\" data-term=\"occasional\" data-ipa=\"/əˈkeɪʒənl/\" data-vn=\"thỉnh thoảng mới xảy ra\">occasional</span> <span class=\"wv\" data-term=\"argument\" data-ipa=\"/ˈɑːɡjumənt/\" data-vn=\"cuộc tranh cãi, cãi vã\">argument</span> is soon forgotten.", "blanks": [{"options": ["out", "off", "up", "in"], "key": 2, "explain": "'Sign up for' = đăng kí (tài khoản mới); 'sign in' là đăng nhập vào tài khoản đã có. Cụm từ 'her first account' phía sau khẳng định đây là lần đăng kí đầu tiên."}, {"options": ["widen", "widening", "to widen", "widened"], "key": 1, "explain": "Cấu trúc 'far from + V-ing' = hoàn toàn không hề. Sau giới từ 'from' bắt buộc dùng V-ing 'widening' (nới rộng khoảng cách) - và nghĩa cũng đối lập với 'close it' ở vế sau."}, {"options": ["would learn", "learn", "learned", "will learn"], "key": 1, "explain": "'Provided (that)' mở đầu mệnh đề điều kiện nên dùng hiện tại đơn 'learn' dù ý nghĩa hướng về tương lai, giống mệnh đề if."}, {"options": ["has never been", "is never", "had never been", "was never being"], "key": 2, "explain": "'Wishing it had never been posted' = ước gì nó chưa từng được đăng - wish + quá khứ hoàn thành bị động cho điều trái với quá khứ. Đây là chỗ trống khó nhất bài: phải nhận ra cả yếu tố 'wish', 'quá khứ' lẫn 'bị động'."}, {"options": ["take", "hold", "make", "give"], "key": 0, "explain": "'Take offence' = cảm thấy bị xúc phạm, phật ý. Người đùa là cháu, ông bà là người nhận trò đùa nên chỉ có thể 'take offence'; 'give offence' là làm người khác phật ý - ngược vai hoàn toàn. Không có cụm 'make/hold offence'."}, {"options": ["similarity", "contact", "touch", "common"], "key": 3, "explain": "Cụm cố định 'have (a lot) in common' = có nhiều điểm chung. 'In touch' và 'in contact' nói về việc giữ liên lạc, không đi với 'have far more'."}]}, {"n": 3, "topic": "TREES ON TOWERS: THE VERTICAL FOREST", "html": "Imagine an <span class=\"wv\" data-term=\"apartment block\" data-ipa=\"/əˈpɑːtmənt blɒk/\" data-vn=\"tòa nhà chung cư\">apartment block</span> whose <span class=\"wv\" data-term=\"balcony\" data-ipa=\"/ˈbælkəni/\" data-vn=\"ban công\">balconies</span> are covered in trees and <span class=\"wv\" data-term=\"shrub\" data-ipa=\"/ʃrʌb/\" data-vn=\"cây bụi\">shrubs</span>. Such &#x27;vertical forests&#x27; already <span class=\"blank\" data-q=\"1\">(1)</span> in Milan and Singapore, and architects believe they will become standard within a decade. The plants <span class=\"wv\" data-term=\"absorb\" data-ipa=\"/əbˈzɔːb/\" data-vn=\"hấp thụ, hút vào\">absorb</span> <span class=\"wv\" data-term=\"carbon dioxide\" data-ipa=\"/ˈkɑːbən daɪˈɒksaɪd/\" data-vn=\"khí carbon dioxide (CO2)\">carbon dioxide</span> and <span class=\"wv\" data-term=\"release\" data-ipa=\"/rɪˈliːs/\" data-vn=\"thải ra, giải phóng\">release</span> <span class=\"wv\" data-term=\"oxygen\" data-ipa=\"/ˈɒksɪdʒən/\" data-vn=\"khí oxy\">oxygen</span>, while their leaves <span class=\"wv\" data-term=\"shade\" data-ipa=\"/ʃeɪd/\" data-vn=\"che bóng, tạo bóng mát\">shade</span> the rooms behind them, so <span class=\"wv\" data-term=\"resident\" data-ipa=\"/ˈrezɪdənt/\" data-vn=\"cư dân, người sống trong tòa nhà\">residents</span> need far less <span class=\"wv\" data-term=\"air conditioning\" data-ipa=\"/ˈeə kəndɪʃənɪŋ/\" data-vn=\"hệ thống điều hòa không khí\">air conditioning</span>. Critics point out that the trees must be carefully <span class=\"wv\" data-term=\"maintain\" data-ipa=\"/meɪnˈteɪn/\" data-vn=\"bảo trì, chăm sóc, duy trì\">maintained</span>: if a large <span class=\"wv\" data-term=\"branch\" data-ipa=\"/brɑːntʃ/\" data-vn=\"cành cây\">branch</span> <span class=\"blank\" data-q=\"2\">(2)</span> during a storm, it could damage the floors below. Supporters reply that the same <span class=\"wv\" data-term=\"objection\" data-ipa=\"/əbˈdʒekʃn/\" data-vn=\"ý kiến phản đối, điểm bất cập\">objection</span> <span class=\"wv\" data-term=\"apply to\" data-ipa=\"/əˈplaɪ tuː/\" data-vn=\"cũng đúng với, áp dụng cho\">applies to</span> any tall <span class=\"wv\" data-term=\"structure\" data-ipa=\"/ˈstrʌktʃə(r)/\" data-vn=\"công trình, kết cấu\">structure</span>, and that the benefits far <span class=\"blank\" data-q=\"3\">(3)</span> the risks. Whatever the objections, the idea is clearly <span class=\"blank\" data-q=\"4\">(4)</span> root: similar projects are now planned in Paris, Toronto and Nanjing. Cities are <span class=\"wv\" data-term=\"run out of\" data-ipa=\"/rʌn aʊt ɒv/\" data-vn=\"sắp cạn kiệt, hết dần\">running out of</span> ground space, so we shall have to grow <span class=\"wv\" data-term=\"upwards\" data-ipa=\"/ˈʌpwədz/\" data-vn=\"theo hướng lên trên, lên cao\">upwards</span> - and a wiser approach is to concentrate on working with nature rather than <span class=\"blank\" data-q=\"5\">(5)</span> it. Studies link green <span class=\"wv\" data-term=\"surroundings\" data-ipa=\"/səˈraʊndɪŋz/\" data-vn=\"môi trường xung quanh\">surroundings</span> to lower stress and better <span class=\"wv\" data-term=\"mental health\" data-ipa=\"/ˈmentl helθ/\" data-vn=\"sức khỏe tinh thần\">mental health</span>, benefits that can <span class=\"blank\" data-q=\"6\">(6)</span> only when nature is brought back into the city.", "blanks": [{"options": ["stay", "lie", "remain", "stand"], "key": 3, "explain": "Công trình, tòa nhà dùng động từ 'stand' (sừng sững, tọa lạc). 'Lie' dùng cho thị trấn/vùng đất trải rộng; 'stay/remain' không mô tả vị trí của tòa nhà theo cách này."}, {"options": ["falls", "will fall", "has fallen", "would fall"], "key": 0, "explain": "Mệnh đề if nói về khả năng có thật trong tương lai/tình huống chung dùng hiện tại đơn 'falls', dù mệnh đề chính dùng 'could'. Không dùng will/would sau if trong cấu trúc này."}, {"options": ["overlook", "outweigh", "outnumber", "overtake"], "key": 1, "explain": "'Outweigh' = có giá trị/nặng ký hơn khi cân nhắc (benefits outweigh risks). 'Outnumber' là đông hơn về số lượng, 'overtake' là vượt qua khi di chuyển, 'overlook' = bỏ qua, không để ý - cần chủ ngữ là người, 'lợi ích' không thể 'bỏ qua' rủi ro."}, {"options": ["putting", "setting", "taking", "getting"], "key": 2, "explain": "Cụm 'take root' = bén rễ, bắt đầu phát triển và lan rộng (dùng cho ý tưởng, phong trào). Không có cụm 'get/set/put root'."}, {"options": ["fighting", "fight", "to fight", "fought"], "key": 0, "explain": "Cấu trúc song song: 'concentrate on working with nature rather than fighting it' - sau 'rather than' phải dùng cùng dạng V-ing với 'working' ở vế trước. Đây là bẫy song song kinh điển: HS hay chọn 'fight' hoặc 'to fight' vì quen với cấu trúc 'would rather... than'."}, {"options": ["achieve", "achieved", "achieving", "be achieved"], "key": 3, "explain": "'Benefits that can be achieved' - lợi ích là thứ 'được đạt được' (bị động) nhờ hành động của con người, nên sau 'can' phải dùng 'be achieved'. 'Achieve' trần sẽ biến 'benefits' thành chủ thể tự đạt được điều gì đó, vô nghĩa."}]}, {"n": 4, "topic": "A FORUM RUN BY THE YOUNG", "html": "Next month, two hundred students from across Southeast Asia will <span class=\"wv\" data-term=\"gather\" data-ipa=\"/ˈɡæðə(r)/\" data-vn=\"tụ họp, tập trung\">gather</span> in Da Nang for a youth forum on the region&#x27;s future. The event is organised entirely by students, who believe young people <span class=\"wv\" data-term=\"deserve\" data-ipa=\"/dɪˈzɜːv/\" data-vn=\"xứng đáng được\">deserve</span> a stronger voice in decisions shaping their lives. In discussion groups, participants will <span class=\"wv\" data-term=\"debate\" data-ipa=\"/dɪˈbeɪt/\" data-vn=\"tranh luận, thảo luận\">debate</span> issues <span class=\"wv\" data-term=\"range from ... to ...\" data-ipa=\"/reɪndʒ frɒm/\" data-vn=\"bao gồm từ ... đến ...\">ranging from</span> <span class=\"wv\" data-term=\"climate change\" data-ipa=\"/ˈklaɪmət tʃeɪndʒ/\" data-vn=\"biến đổi khí hậu\">climate change</span> to <span class=\"wv\" data-term=\"digital\" data-ipa=\"/ˈdɪdʒɪtl/\" data-vn=\"thuộc kỹ thuật số, trên mạng\">digital</span> safety, and each group will be asked to <span class=\"blank\" data-q=\"1\">(1)</span> a set of <span class=\"wv\" data-term=\"proposal\" data-ipa=\"/prəˈpəʊzl/\" data-vn=\"đề xuất, kiến nghị\">proposals</span> to present to real <span class=\"wv\" data-term=\"official\" data-ipa=\"/əˈfɪʃl/\" data-vn=\"quan chức, cán bộ\">officials</span> on the final day. By then, each group will already <span class=\"blank\" data-q=\"2\">(2)</span> its <span class=\"wv\" data-term=\"proposal\" data-ipa=\"/prəˈpəʊzl/\" data-vn=\"đề xuất, kiến nghị\">proposals</span> at least twice, with help from teachers acting as <span class=\"wv\" data-term=\"adviser\" data-ipa=\"/ədˈvaɪzə(r)/\" data-vn=\"người cố vấn\">advisers</span>. Reaching agreement will not be easy: the delegates come from eleven countries, <span class=\"blank\" data-q=\"3\">(3)</span> <span class=\"wv\" data-term=\"priority\" data-ipa=\"/praɪˈɒrəti/\" data-vn=\"việc được ưu tiên, mối quan tâm hàng đầu\">priorities</span> do not always <span class=\"wv\" data-term=\"coincide\" data-ipa=\"/ˌkəʊɪnˈsaɪd/\" data-vn=\"trùng khớp, đồng nhất (quan điểm)\">coincide</span>. <span class=\"wv\" data-term=\"nevertheless\" data-ipa=\"/ˌnevəðəˈles/\" data-vn=\"tuy nhiên, dù vậy\">Nevertheless</span>, the organisers remain <span class=\"wv\" data-term=\"committed (to)\" data-ipa=\"/kəˈmɪtɪd/\" data-vn=\"cam kết, quyết tâm thực hiện\">committed</span> to <span class=\"blank\" data-q=\"4\">(4)</span> every participant a fair chance to speak, whatever their level of English. If the forum succeeds, its greatest <span class=\"wv\" data-term=\"achievement\" data-ipa=\"/əˈtʃiːvmənt/\" data-vn=\"thành tựu, thành quả\">achievement</span> may be the experience of finding <span class=\"blank\" data-q=\"5\">(5)</span> ground with people whose lives are very different from one&#x27;s own - and friendships that could <span class=\"blank\" data-q=\"6\">(6)</span> a lifetime.", "blanks": [{"options": ["come up", "sum up", "draw up", "take up"], "key": 2, "explain": "'Draw up' = soạn thảo (văn bản, danh sách đề xuất). 'Come up' phải đi với 'with'; 'sum up' = tóm tắt lại nội dung đã có, không phải soạn mới; 'take up' = bắt đầu (sở thích/vấn đề)."}, {"options": ["be revising", "have revised", "revise", "revised"], "key": 1, "explain": "'By then' + 'already' khóa chặt tương lai hoàn thành 'will already have revised' - hành động đã hoàn tất trước mốc tương lai. 'Will already revise' sai cấu trúc với 'already'; 'will be revising' mâu thuẫn với 'at least twice' (đếm số lần hoàn thành)."}, {"options": ["their", "whose", "of which", "which"], "key": 1, "explain": "Cần đại từ quan hệ sở hữu 'whose' (ưu tiên của họ - của các đại biểu). 'Of which' không dùng cho người theo cách này; 'their' làm câu thiếu liên kết mệnh đề."}, {"options": ["given", "give", "to give", "giving"], "key": 3, "explain": "'Be committed to' - chữ 'to' ở đây là giới từ, nên theo sau là V-ing 'giving'. Đây là bẫy nổi tiếng: HS thường chọn 'to give' vì thấy chữ to."}, {"options": ["common", "solid", "mutual", "joint"], "key": 0, "explain": "Cụm cố định 'common ground' = điểm chung, cơ sở đồng thuận. 'Solid ground' là ẩn dụ về chỗ đứng vững chắc, không dùng cho điểm chung giữa người với người; không nói 'joint/mutual ground' trong cụm này."}, {"options": ["stay", "keep", "last", "remain"], "key": 2, "explain": "'Last a lifetime' = kéo dài suốt đời, bền lâu trọn đời. 'Remain/stay/keep' không đi với tân ngữ khoảng thời gian 'a lifetime' theo cấu trúc này."}]}, {"n": 5, "topic": "THE GAS NOBODY TALKS ABOUT", "html": "When people discuss <span class=\"wv\" data-term=\"global warming\" data-ipa=\"/ˈɡləʊbl ˈwɔːmɪŋ/\" data-vn=\"sự nóng lên toàn cầu\">global warming</span>, carbon dioxide takes most of the <span class=\"wv\" data-term=\"take the blame\" data-ipa=\"/bleɪm/\" data-vn=\"chịu phần lỗi, bị đổ lỗi (take the blame)\">blame</span>. Yet methane, a gas <span class=\"blank\" data-q=\"1\">(1)</span> by farming, waste and <span class=\"wv\" data-term=\"fossil fuel\" data-ipa=\"/ˈfɒsl fjuːəl/\" data-vn=\"nhiên liệu hóa thạch (than, dầu, khí đốt)\">fossil fuel</span> <span class=\"wv\" data-term=\"extraction\" data-ipa=\"/ɪkˈstrækʃn/\" data-vn=\"việc khai thác (dầu khí, khoáng sản)\">extraction</span>, is far more powerful in the short term: it <span class=\"wv\" data-term=\"trap\" data-ipa=\"/træp/\" data-vn=\"giữ lại, bẫy lại (nhiệt, ánh sáng)\">traps</span> over eighty times more heat than carbon dioxide in its first twenty years in the atmosphere. The good news is that methane <span class=\"wv\" data-term=\"break down\" data-ipa=\"/breɪk daʊn/\" data-vn=\"phân hủy, tan rã (về hóa học)\">breaks down</span> within about a decade, so cutting <span class=\"wv\" data-term=\"emission\" data-ipa=\"/ɪˈmɪʃn/\" data-vn=\"khí thải, lượng phát thải\">emissions</span> now would slow warming <span class=\"wv\" data-term=\"remarkably\" data-ipa=\"/rɪˈmɑːkəbli/\" data-vn=\"một cách đáng kinh ngạc\">remarkably</span> fast. The sources, however, are not always easy to <span class=\"wv\" data-term=\"pin down\" data-ipa=\"/pɪn daʊn/\" data-vn=\"xác định chính xác (nguồn gốc, nguyên nhân)\">pin down</span>. Some of the largest leaks come from <span class=\"wv\" data-term=\"ageing\" data-ipa=\"/ˈeɪdʒɪŋ/\" data-vn=\"đang cũ đi, lão hóa (đường ống, máy móc)\">ageing</span> <span class=\"wv\" data-term=\"pipeline\" data-ipa=\"/ˈpaɪplaɪn/\" data-vn=\"đường ống dẫn (dầu, khí)\">pipelines</span> and <span class=\"wv\" data-term=\"abandoned\" data-ipa=\"/əˈbændənd/\" data-vn=\"bị bỏ hoang, bỏ không\">abandoned</span> wells, many of <span class=\"blank\" data-q=\"2\">(2)</span> were built long before modern safety standards existed. Satellites can now <span class=\"wv\" data-term=\"detect\" data-ipa=\"/dɪˈtekt/\" data-vn=\"phát hiện, dò tìm\">detect</span> major leaks from space, <span class=\"blank\" data-q=\"3\">(3)</span> the worst <span class=\"wv\" data-term=\"offender\" data-ipa=\"/əˈfendə(r)/\" data-vn=\"kẻ vi phạm; ở đây: nguồn gây hại lớn nhất\">offenders</span> nowhere to hide. <span class=\"wv\" data-term=\"campaigner\" data-ipa=\"/kæmˈpeɪnə(r)/\" data-vn=\"người vận động cho một mục tiêu xã hội\">Campaigners</span> argue that governments have been too slow to act, instead <span class=\"blank\" data-q=\"4\">(4)</span> a blind eye to leaks the <span class=\"wv\" data-term=\"industry\" data-ipa=\"/ˈɪndəstri/\" data-vn=\"ngành công nghiệp\">industry</span> has known about for years. Few climate measures offer so much benefit with so little <span class=\"blank\" data-q=\"5\">(5)</span> to daily life - which is why methane cuts are called the low-hanging <span class=\"blank\" data-q=\"6\">(6)</span> of climate <span class=\"wv\" data-term=\"policy\" data-ipa=\"/ˈpɒləsi/\" data-vn=\"chính sách\">policy</span>.", "blanks": [{"options": ["releasing", "release", "to release", "released"], "key": 3, "explain": "Mệnh đề quan hệ rút gọn bị động: 'a gas (which is) released by...' - khí bị thải ra bởi nông nghiệp nên dùng phân từ quá khứ 'released'. 'Releasing' sẽ biến khí thành chủ thể tự thải ra thứ khác."}, {"options": ["whom", "which", "them", "that"], "key": 1, "explain": "Sau 'many of' chỉ vật phải dùng 'which' (many of which were built...). 'Whom' chỉ người; 'that' không đứng sau giới từ/cụm 'of' như vậy."}, {"options": ["leave", "left", "leaving", "to leave"], "key": 2, "explain": "Cụm phân từ chỉ kết quả: vệ tinh phát hiện rò rỉ, 'leaving the worst offenders nowhere to hide' (khiến kẻ vi phạm không còn chỗ trốn). Chủ ngữ của 'leaving' chính là mệnh đề trước - cấu trúc V-ing rút gọn nâng cao."}, {"options": ["turning", "shutting", "closing", "making"], "key": 0, "explain": "Thành ngữ 'turn a blind eye to' = làm ngơ, nhắm mắt bỏ qua. Không có 'close/shut/make a blind eye'."}, {"options": ["destruction", "disruption", "distraction", "disagreement"], "key": 1, "explain": "'Disruption to daily life' = sự xáo trộn đời sống hằng ngày - collocation chuẩn. 'Destruction' (phá hủy) quá mạnh và không đi với 'to daily life'; 'distraction' là sự xao nhãng; 'disagreement' là sự bất đồng - đều sai nghĩa."}, {"options": ["target", "prize", "option", "fruit"], "key": 3, "explain": "Thành ngữ 'low-hanging fruit' = việc dễ thực hiện mà hiệu quả cao ('quả ở cành thấp, dễ hái') - khớp với ý cắt giảm methane ít xáo trộn mà lợi ích lớn. Các từ còn lại không tạo thành thành ngữ này."}]}, {"n": 6, "topic": "RESTORING THE VILLAGE PAGODA", "html": "When <span class=\"wv\" data-term=\"craftsman\" data-ipa=\"/ˈkrɑːftsmən/\" data-vn=\"thợ thủ công, nghệ nhân\">craftsmen</span> began <span class=\"wv\" data-term=\"restore\" data-ipa=\"/rɪˈstɔː(r)/\" data-vn=\"khôi phục, trùng tu\">restoring</span> the village pagoda, they expected the work to take six months. Two years later, they are still there. The building, which <span class=\"blank\" data-q=\"1\">(1)</span> without repair for over a century before the <span class=\"wv\" data-term=\"craftsman\" data-ipa=\"/ˈkrɑːftsmən/\" data-vn=\"thợ thủ công, nghệ nhân\">craftsmen</span> arrived, turned out to be far more <span class=\"wv\" data-term=\"fragile\" data-ipa=\"/ˈfrædʒaɪl/\" data-vn=\"mỏng manh, dễ hư hỏng\">fragile</span> than expected: its <span class=\"wv\" data-term=\"beam\" data-ipa=\"/biːm/\" data-vn=\"xà, dầm (gỗ, thép)\">beams</span> were <span class=\"wv\" data-term=\"rotten\" data-ipa=\"/ˈrɒtn/\" data-vn=\"mục nát, bị mối mọt\">rotten</span> and several <span class=\"wv\" data-term=\"statue\" data-ipa=\"/ˈstætʃuː/\" data-vn=\"tượng\">statues</span> had <span class=\"wv\" data-term=\"cracked\" data-ipa=\"/krækt/\" data-vn=\"bị nứt, rạn vỡ\">cracked</span>. The restoration <span class=\"wv\" data-term=\"charter\" data-ipa=\"/ˈtʃɑːtə(r)/\" data-vn=\"điều lệ, quy chế hoạt động\">charter</span> <span class=\"wv\" data-term=\"insist\" data-ipa=\"/ɪnˈsɪst/\" data-vn=\"khăng khăng yêu cầu, quy định chặt\">insists</span> that every damaged piece <span class=\"blank\" data-q=\"2\">(2)</span> photographed and recorded before it is touched. The team leader, himself the grandson of a <span class=\"wv\" data-term=\"carpenter\" data-ipa=\"/ˈkɑːpəntə(r)/\" data-vn=\"thợ mộc\">carpenter</span> who once worked on the same roof, objects to <span class=\"blank\" data-q=\"3\">(3)</span> modern materials, arguing that the pagoda&#x27;s value lies <span class=\"wv\" data-term=\"precisely\" data-ipa=\"/prɪˈsaɪsli/\" data-vn=\"chính xác là, đúng là\">precisely</span> in its original wood and <span class=\"wv\" data-term=\"tile\" data-ipa=\"/taɪl/\" data-vn=\"ngói, gạch lát\">tiles</span>. <span class=\"wv\" data-term=\"funding\" data-ipa=\"/ˈfʌndɪŋ/\" data-vn=\"nguồn kinh phí, tiền tài trợ\">Funding</span> is another worry: the project <span class=\"wv\" data-term=\"depend on\" data-ipa=\"/dɪˈpend ɒn/\" data-vn=\"phụ thuộc hoàn toàn vào\">depends entirely on</span> the <span class=\"blank\" data-q=\"4\">(4)</span> of local people, and if the money <span class=\"wv\" data-term=\"run out\" data-ipa=\"/rʌn aʊt/\" data-vn=\"cạn, hết (tiền, thời gian)\">runs out</span>, work will stop with the roof half finished. For the villagers, the pagoda is not just an old building but a <span class=\"blank\" data-q=\"5\">(5)</span> link between past and present. The project also trains young villagers in <span class=\"wv\" data-term=\"carving\" data-ipa=\"/ˈkɑːvɪŋ/\" data-vn=\"nghệ thuật chạm khắc\">carving</span> and <span class=\"wv\" data-term=\"joinery\" data-ipa=\"/ˈdʒɔɪnəri/\" data-vn=\"nghề mộc ghép nối đồ gỗ\">joinery</span>, skills that have almost <span class=\"blank\" data-q=\"6\">(6)</span> in the area.", "blanks": [{"options": ["had been left", "has been left", "leaves", "is left"], "key": 0, "explain": "Cụm 'before the craftsmen arrived' khóa mốc quá khứ: tòa nhà 'đã bị bỏ mặc' hơn một thế kỉ trước khi thợ đến - quá khứ hoàn thành bị động 'had been left'. 'Has been left' tính từ hiện tại nên bị loại bởi chính cue này."}, {"options": ["is", "was", "be", "being"], "key": 2, "explain": "Sau 'insist that' (yêu cầu, quy định) dùng thể giả định: động từ nguyên mẫu trần 'be photographed'. Đây là cấu trúc nâng cao rất hay bị HS bỏ qua, chọn 'is' theo thói quen."}, {"options": ["used", "to use", "use", "using"], "key": 3, "explain": "'Object to' = phản đối - chữ 'to' là giới từ nên theo sau là V-ing 'using'. Cùng họ bẫy với 'be committed to', 'look forward to'."}, {"options": ["generous", "generosity", "generation", "generously"], "key": 1, "explain": "Sau mạo từ 'the' và trước 'of' phải là danh từ 'generosity' (sự hào phóng). 'Generation' là danh từ nhưng sai nghĩa (thế hệ); hai từ còn lại sai loại từ."}, {"options": ["life", "live", "living", "alive"], "key": 2, "explain": "'A living link' = mối liên kết sống động, vẫn đang tồn tại. 'Alive' không đứng trước danh từ; 'live link' gợi nghĩa liên kết trực tiếp/phát sóng; 'life' là danh từ không làm tính từ ở đây."}, {"options": ["died out", "faded out", "passed out", "worn out"], "key": 0, "explain": "'Die out' = mai một, biến mất dần (dùng cho nghề, phong tục, loài). 'Pass out' = ngất xỉu; 'worn out' = mòn/sờn hoặc kiệt sức; 'fade out' dùng cho âm thanh, hình ảnh mờ dần."}]}, {"n": 7, "topic": "THE GAP YEAR DEBATE", "html": "When Mai told her parents she wanted to <span class=\"wv\" data-term=\"take a year out\" data-ipa=\"/teɪk ə jɪər aʊt/\" data-vn=\"nghỉ một năm (trước khi vào đại học)\">take a year out</span> before university, they were <span class=\"wv\" data-term=\"horrified\" data-ipa=\"/ˈhɒrɪfaɪd/\" data-vn=\"kinh hoàng, bị sốc nặng\">horrified</span>. In their view, a gap year was wasted time: she would <span class=\"wv\" data-term=\"fall behind\" data-ipa=\"/fɔːl bɪˈhaɪnd/\" data-vn=\"tụt lại phía sau, chậm hơn người khác\">fall behind</span> friends who went straight to university. Mai saw it differently. &#x27;If I <span class=\"blank\" data-q=\"1\">(1)</span> straight into another three years of study,&#x27; she argued, &#x27;I would <span class=\"wv\" data-term=\"burn out\" data-ipa=\"/bɜːn aʊt/\" data-vn=\"kiệt sức vì học/làm việc quá độ\">burn out</span> before I even started.&#x27; It is high time students <span class=\"blank\" data-q=\"2\">(2)</span> that a <span class=\"wv\" data-term=\"degree\" data-ipa=\"/dɪˈɡriː/\" data-vn=\"bằng đại học\">degree</span> is not the only <span class=\"wv\" data-term=\"route\" data-ipa=\"/ruːt/\" data-vn=\"con đường, hướng đi (nghĩa bóng)\">route</span> to a good career: what matters is whether the path chosen is <span class=\"blank\" data-q=\"3\">(3)</span> with their strengths and interests. Mai&#x27;s parents <span class=\"wv\" data-term=\"come round to\" data-ipa=\"/kʌm raʊnd tuː/\" data-vn=\"dần chấp nhận, thay đổi ý kiến theo\">came round to</span> the idea once they saw her plan <span class=\"blank\" data-q=\"4\">(4)</span> down in detail; her <span class=\"wv\" data-term=\"determination\" data-ipa=\"/dɪˌtɜːmɪˈneɪʃn/\" data-vn=\"sự quyết tâm\">determination</span> <span class=\"wv\" data-term=\"win somebody over\" data-ipa=\"/wɪn ˈəʊvə(r)/\" data-vn=\"thuyết phục được ai, làm ai xiêu lòng\">won them over</span> <span class=\"wv\" data-term=\"in the end\" data-ipa=\"/ɪn ðiː end/\" data-vn=\"cuối cùng thì\">in the end</span>. A year later, Mai began her <span class=\"wv\" data-term=\"degree\" data-ipa=\"/dɪˈɡriː/\" data-vn=\"bằng đại học\">degree</span> with a far clearer idea of what she wanted to study. Looking back, she calls the year out an <span class=\"wv\" data-term=\"essential\" data-ipa=\"/ɪˈsenʃl/\" data-vn=\"thiết yếu, không thể thiếu\">essential</span> part of her education - time she would not <span class=\"blank\" data-q=\"5\">(5)</span> for anything. Students who <span class=\"wv\" data-term=\"rush into\" data-ipa=\"/rʌʃ ˈɪntuː/\" data-vn=\"vội vàng lao vào (việc chưa nghĩ kỹ)\">rush into</span> the wrong course often end up <span class=\"blank\" data-q=\"6\">(6)</span> of it halfway through, at <span class=\"wv\" data-term=\"considerable\" data-ipa=\"/kənˈsɪdərəbl/\" data-vn=\"đáng kể, không nhỏ\">considerable</span> cost to themselves and their families.", "blanks": [{"options": ["had rushed", "rushed", "rush", "will rush"], "key": 1, "explain": "Mệnh đề chính 'I would burn out' cho thấy đây là điều kiện loại 2 (giả định hiện tại) nên mệnh đề if dùng quá khứ đơn 'rushed'. HS phải đọc tới vế sau mới chọn được - không thể quyết định ngay tại chỗ trống."}, {"options": ["realised", "had realised", "realise", "will realise"], "key": 0, "explain": "Cấu trúc 'It is high time + S + V2' = đã đến lúc phải làm gì (dù việc chưa xảy ra). Dùng quá khứ đơn 'realised' nhưng ý nghĩa là hiện tại/tương lai - bẫy kinh điển."}, {"options": ["equal", "similar", "suitable", "consistent"], "key": 3, "explain": "'Consistent with' = phù hợp, nhất quán với (điểm mạnh và sở thích). 'Similar' phải đi với 'to'; 'suitable' đi với 'for'; 'equal' đi với 'to' và sai nghĩa."}, {"options": ["writing", "wrote", "written", "write"], "key": 2, "explain": "'Saw her plan written down' = nhìn thấy bản kế hoạch (đã) được viết ra - cấu trúc see + O + V3 mang nghĩa bị động. 'Writing' sẽ biến bản kế hoạch thành chủ thể tự viết."}, {"options": ["sell", "give", "swap", "lose"], "key": 2, "explain": "'Would not swap it for anything' = không đổi lấy bất cứ thứ gì (quá quý giá). 'Give/lose/sell it for anything' không tạo thành thành ngữ này."}, {"options": ["dropping out", "walking out", "breaking out", "giving up"], "key": 0, "explain": "'Drop out of (a course)' = bỏ học giữa chừng. 'Give up' không đi với 'of'; 'walk out' là bỏ đi khỏi cuộc họp/sự kiện; 'break out' dùng cho chiến tranh, dịch bệnh bùng phát."}]}, {"n": 8, "topic": "FIRST FLAT, FIRST LESSONS", "html": "When Tuan moved into his first flat at eighteen, he thought <span class=\"wv\" data-term=\"independence\" data-ipa=\"/ˌɪndɪˈpendəns/\" data-vn=\"sự độc lập, tự lập\">independence</span> meant doing whatever he liked. Reality taught him <span class=\"wv\" data-term=\"otherwise\" data-ipa=\"/ˈʌðəwaɪz/\" data-vn=\"nếu không thì; theo cách khác\">otherwise</span> within a week. The <span class=\"wv\" data-term=\"rent\" data-ipa=\"/rent/\" data-vn=\"tiền thuê nhà\">rent</span>, the <span class=\"wv\" data-term=\"bill\" data-ipa=\"/bɪl/\" data-vn=\"hóa đơn (điện, nước, điện thoại)\">bills</span> and the food shopping all had to come out of one small <span class=\"wv\" data-term=\"salary\" data-ipa=\"/ˈsæləri/\" data-vn=\"tiền lương tháng\">salary</span>, and making ends <span class=\"blank\" data-q=\"1\">(1)</span> became a monthly <span class=\"wv\" data-term=\"battle\" data-ipa=\"/ˈbætl/\" data-vn=\"cuộc vật lộn, cuộc chiến (nghĩa bóng)\">battle</span>. His mother had always <span class=\"blank\" data-q=\"2\">(2)</span> the <span class=\"wv\" data-term=\"household\" data-ipa=\"/ˈhaʊshəʊld/\" data-vn=\"hộ gia đình; việc nhà\">household</span> so <span class=\"wv\" data-term=\"smoothly\" data-ipa=\"/ˈsmuːðli/\" data-vn=\"trơn tru, suôn sẻ\">smoothly</span> that he had never noticed how much work it involved; now, when the washing machine <span class=\"wv\" data-term=\"flood\" data-ipa=\"/flʌd/\" data-vn=\"làm ngập, tràn nước\">flooded</span> the kitchen, there was nobody to call, and he had no choice but <span class=\"blank\" data-q=\"3\">(3)</span> the problem himself. Slowly, however, he learned. He set himself a weekly <span class=\"wv\" data-term=\"budget\" data-ipa=\"/ˈbʌdʒɪt/\" data-vn=\"ngân sách, kế hoạch chi tiêu\">budget</span> and <span class=\"wv\" data-term=\"stick to\" data-ipa=\"/stɪk tuː/\" data-vn=\"kiên trì bám theo (kế hoạch, nguyên tắc)\">stuck to</span> it, and he stopped <span class=\"blank\" data-q=\"4\">(4)</span> his parents for every small problem, dealing with things on his own instead. Nobody had <span class=\"wv\" data-term=\"warn\" data-ipa=\"/wɔːn/\" data-vn=\"cảnh báo, báo trước\">warned</span> him how many hours a week disappear into simple <span class=\"wv\" data-term=\"household\" data-ipa=\"/ˈhaʊshəʊld/\" data-vn=\"hộ gia đình; việc nhà\">household</span> <span class=\"blank\" data-q=\"5\">(5)</span> - the cleaning, the <span class=\"wv\" data-term=\"laundry\" data-ipa=\"/ˈlɔːndri/\" data-vn=\"việc giặt ủi; quần áo cần giặt\">laundry</span>, the endless <span class=\"wv\" data-term=\"washing-up\" data-ipa=\"/ˌwɒʃɪŋ ˈʌp/\" data-vn=\"việc rửa bát đĩa\">washing-up</span>. A year on, he would not go back. <span class=\"wv\" data-term=\"independence\" data-ipa=\"/ˌɪndɪˈpendəns/\" data-vn=\"sự độc lập, tự lập\">Independence</span>, he says, is not about being left alone; it is about standing on your own two <span class=\"blank\" data-q=\"6\">(6)</span> and knowing you can <span class=\"wv\" data-term=\"cope\" data-ipa=\"/kəʊp/\" data-vn=\"xoay xở, đối phó được\">cope</span>.", "blanks": [{"options": ["match", "meet", "connect", "join"], "key": 1, "explain": "Thành ngữ 'make ends meet' = xoay xở đủ sống với thu nhập ít ỏi. Ba từ còn lại đều có nghĩa 'nối/khớp' nhưng không tạo thành thành ngữ này."}, {"options": ["running", "runs", "ran", "run"], "key": 3, "explain": "Sau 'had always' cần phân từ quá khứ của 'run' - và V3 của run vẫn là 'run' (run - ran - run). Đây là bẫy dạng từ: HS rất hay chọn 'ran' vì thấy quen mắt."}, {"options": ["fix", "fixed", "to fix", "fixing"], "key": 0, "explain": "Cấu trúc 'have no choice but + V nguyên mẫu trần': 'he had no choice but fix the problem himself'. Sau 'but' trong cấu trúc này không dùng to-V hay V-ing."}, {"options": ["to call", "call", "calling", "called"], "key": 2, "explain": "'Stopped calling' = ngừng hẳn việc gọi (thói quen cũ chấm dứt), được khẳng định bởi vế sau 'dealing with things on his own instead'. 'Stop to call' sẽ là dừng việc khác lại để gọi - ngược nghĩa."}, {"options": ["appliances", "chores", "names", "waste"], "key": 1, "explain": "'Household chores' = việc nhà lặt vặt - đúng các ví dụ liệt kê phía sau (dọn dẹp, giặt giũ, rửa bát đều là việc, không phải vật). 'Appliances' là thiết bị, 'waste' là rác thải, 'household names' là thành ngữ chỉ người/vật nổi tiếng - đều không khớp với các ví dụ."}, {"options": ["legs", "shoes", "grounds", "feet"], "key": 3, "explain": "Thành ngữ 'stand on your own two feet' = tự lập, tự đứng vững trên đôi chân của mình. Đây là cụm cố định, không thay bằng legs/shoes được."}]}, {"n": 9, "topic": "THE CRUELTY OF THE CROWD: CYBERBULLYING", "html": "Few experiences are more <span class=\"wv\" data-term=\"frightening\" data-ipa=\"/ˈfraɪtənɪŋ/\" data-vn=\"đáng sợ, gây hoảng sợ\">frightening</span> for a teenager than waking up to find a private photo shared with the whole school. Cyberbullying differs from playground <span class=\"wv\" data-term=\"cruelty\" data-ipa=\"/ˈkruːəlti/\" data-vn=\"sự tàn nhẫn, ác ý\">cruelty</span> in one <span class=\"wv\" data-term=\"crucial\" data-ipa=\"/ˈkruːʃl/\" data-vn=\"cực kỳ quan trọng, then chốt\">crucial</span> way: it never really stops. The <span class=\"wv\" data-term=\"victim\" data-ipa=\"/ˈvɪktɪm/\" data-vn=\"nạn nhân\">victim</span> cannot <span class=\"wv\" data-term=\"escape\" data-ipa=\"/ɪˈskeɪp/\" data-vn=\"trốn thoát, thoát khỏi\">escape</span> it by going home, because the messages follow them everywhere. It is essential that schools <span class=\"blank\" data-q=\"1\">(1)</span> the problem seriously and act before real harm is done. Victims often <span class=\"wv\" data-term=\"suffer in silence\" data-ipa=\"/ˈsʌfə(r) ɪn ˈsaɪləns/\" data-vn=\"âm thầm chịu đựng, không dám nói ra\">suffer in silence</span>, afraid that telling an adult will make things worse; some even blame themselves for <span class=\"blank\" data-q=\"2\">(2)</span> the photograph in the first place. Experts point to <span class=\"wv\" data-term=\"warning sign\" data-ipa=\"/ˈwɔːnɪŋ saɪn/\" data-vn=\"dấu hiệu cảnh báo\">warning signs</span> - <span class=\"wv\" data-term=\"withdrawal\" data-ipa=\"/wɪðˈdrɔːəl/\" data-vn=\"sự thu mình, rút lui khỏi mọi người\">withdrawal</span>, lost sleep and a sudden <span class=\"wv\" data-term=\"reluctance\" data-ipa=\"/rɪˈlʌktəns/\" data-vn=\"sự miễn cưỡng, không muốn làm\">reluctance</span> to <span class=\"blank\" data-q=\"3\">(3)</span> school. The law is <span class=\"wv\" data-term=\"catch up\" data-ipa=\"/kætʃ ʌp/\" data-vn=\"bắt kịp, theo kịp (sự thay đổi)\">catching up</span>, and those who share such images can now face <span class=\"wv\" data-term=\"punishment\" data-ipa=\"/ˈpʌnɪʃmənt/\" data-vn=\"hình phạt, sự trừng phạt\">punishment</span>. But <span class=\"wv\" data-term=\"punishment\" data-ipa=\"/ˈpʌnɪʃmənt/\" data-vn=\"hình phạt, sự trừng phạt\">punishment</span> alone will not change the culture. If every <span class=\"wv\" data-term=\"bystander\" data-ipa=\"/ˈbaɪstændə(r)/\" data-vn=\"người ngoài cuộc, người đứng xem\">bystander</span> <span class=\"blank\" data-q=\"4\">(4)</span> the image instead of <span class=\"wv\" data-term=\"forward\" data-ipa=\"/ˈfɔːwəd/\" data-vn=\"chuyển tiếp (tin nhắn, hình ảnh)\">forwarding</span> it, the <span class=\"wv\" data-term=\"cruelty\" data-ipa=\"/ˈkruːəlti/\" data-vn=\"sự tàn nhẫn, ác ý\">cruelty</span> would quickly lose its <span class=\"wv\" data-term=\"audience\" data-ipa=\"/ˈɔːdiəns/\" data-vn=\"khán giả, đám đông người xem\">audience</span>. What is needed is for <span class=\"wv\" data-term=\"witness\" data-ipa=\"/ˈwɪtnəs/\" data-vn=\"người chứng kiến, nhân chứng\">witnesses</span> to stand up <span class=\"blank\" data-q=\"5\">(5)</span> the <span class=\"wv\" data-term=\"victim\" data-ipa=\"/ˈvɪktɪm/\" data-vn=\"nạn nhân\">victim</span>. A single message of <span class=\"wv\" data-term=\"support\" data-ipa=\"/səˈpɔːt/\" data-vn=\"sự ủng hộ, hỗ trợ (tinh thần)\">support</span> can make a real <span class=\"blank\" data-q=\"6\">(6)</span> to someone who feels the whole world is against them.", "blanks": [{"options": ["took", "take", "will take", "takes"], "key": 1, "explain": "Sau 'It is essential that' dùng thể giả định: 'schools take' - động từ nguyên mẫu trần dù chủ ngữ là số nhiều hay số ít. HS quen chia 'takes' theo chủ ngữ schools sẽ sai."}, {"options": ["sharing", "to share", "share", "shared"], "key": 0, "explain": "'Blame themselves for sharing' - sau giới từ 'for' dùng V-ing. Việc chia sẻ đã xảy ra trong quá khứ nhưng dạng sau giới từ vẫn là V-ing, không phải 'shared'."}, {"options": ["reach", "arrive", "go", "attend"], "key": 3, "explain": "Cụm 'reluctance to attend school' - 'attend school' = đi học (trang trọng). 'Go' sẽ cần thêm 'to' phía sau ('go to school') và 'arrive' cần 'at', nhưng cấu trúc câu đã là 'to § school' nên cả hai đều không dùng được; 'reach school' không phải collocation."}, {"options": ["would delete", "delete", "deleted", "will delete"], "key": 2, "explain": "Vế sau 'would quickly lose' báo hiệu điều kiện loại 2, nên mệnh đề if dùng quá khứ đơn 'deleted' dù nói về hành động tương lai. Phải đọc hết câu mới quyết định được."}, {"options": ["with", "for", "by", "behind"], "key": 1, "explain": "'Stand up for somebody' = đứng ra bảo vệ, bênh vực ai. 'Stand by' nghĩa là đứng cạnh/ở bên (hoặc chuẩn bị sẵn sàng), không có cụm 'stand up by/with'."}, {"options": ["improvement", "support", "change", "difference"], "key": 3, "explain": "Cụm cố định 'make a (real) difference' = tạo ra thay đổi có ý nghĩa cho hoàn cảnh của ai. 'Make an improvement' thường dùng cho việc cải thiện một thứ/hệ thống cụ thể; 'make a change' là thực hiện một thay đổi - cả hai đều không diễn tả được ý 'tạo khác biệt cho nạn nhân' như 'difference'."}]}, {"n": 10, "topic": "THE WOLVES THAT CHANGED A RIVER", "html": "When wolves were <span class=\"wv\" data-term=\"reintroduce\" data-ipa=\"/ˌriːɪntrəˈdjuːs/\" data-vn=\"đưa trở lại (loài vật về tự nhiên)\">reintroduced</span> into Yellowstone National Park in 1995, nobody expected them to change the <span class=\"wv\" data-term=\"landscape\" data-ipa=\"/ˈlændskeɪp/\" data-vn=\"cảnh quan, địa hình\">landscape</span> itself. For seventy years the park&#x27;s elk, having no natural <span class=\"wv\" data-term=\"predator\" data-ipa=\"/ˈpredətə(r)/\" data-vn=\"động vật săn mồi\">predators</span>, had <span class=\"wv\" data-term=\"graze\" data-ipa=\"/ɡreɪz/\" data-vn=\"gặm cỏ\">grazed</span> the valleys <span class=\"wv\" data-term=\"bare\" data-ipa=\"/beə(r)/\" data-vn=\"trơ trụi, không còn gì (bị ăn sạch)\">bare</span>, <span class=\"blank\" data-q=\"1\">(1)</span> young trees before they could grow. The wolves changed the elk&#x27;s behaviour: afraid of being hunted, the <span class=\"wv\" data-term=\"herd\" data-ipa=\"/hɜːd/\" data-vn=\"bầy, đàn (thú)\">herds</span> avoided the open valley floors, and the trees began to <span class=\"wv\" data-term=\"recover\" data-ipa=\"/rɪˈkʌvə(r)/\" data-vn=\"hồi phục, mọc trở lại\">recover</span>. As the forests returned, birds and beavers came back too. According to some <span class=\"wv\" data-term=\"ecologist\" data-ipa=\"/ɪˈkɒlədʒɪst/\" data-vn=\"nhà sinh thái học\">ecologists</span>, the recovering trees <span class=\"wv\" data-term=\"strengthen\" data-ipa=\"/ˈstreŋθn/\" data-vn=\"làm cho chắc khỏe, vững hơn\">strengthened</span> the <span class=\"wv\" data-term=\"riverbank\" data-ipa=\"/ˈrɪvəbæŋk/\" data-vn=\"bờ sông\">riverbanks</span>, so the rivers began to <span class=\"wv\" data-term=\"wander\" data-ipa=\"/ˈwɒndə(r)/\" data-vn=\"uốn lượn, chảy ngoằn ngoèo\">wander</span> less and flow more <span class=\"wv\" data-term=\"steadily\" data-ipa=\"/ˈstedɪli/\" data-vn=\"đều đặn, ổn định\">steadily</span>. The wolves had set off a <span class=\"wv\" data-term=\"chain reaction\" data-ipa=\"/tʃeɪn riˈækʃn/\" data-vn=\"phản ứng dây chuyền, hiệu ứng lan truyền\">chain reaction</span> <span class=\"blank\" data-q=\"2\">(2)</span> <span class=\"wv\" data-term=\"ecologist\" data-ipa=\"/ɪˈkɒlədʒɪst/\" data-vn=\"nhà sinh thái học\">ecologists</span> call a &#x27;<span class=\"wv\" data-term=\"trophic cascade\" data-ipa=\"/ˈtrɒfɪk kæˈskeɪd/\" data-vn=\"thác dinh dưỡng: hiệu ứng lan truyền qua các bậc của chuỗi thức ăn\">trophic cascade</span>&#x27;. <span class=\"wv\" data-term=\"ecosystem\" data-ipa=\"/ˈiːkəʊsɪstəm/\" data-vn=\"hệ sinh thái\">Ecosystems</span> are held together by relationships so complex that removing a single <span class=\"wv\" data-term=\"species\" data-ipa=\"/ˈspiːʃiːz/\" data-vn=\"loài (sinh vật)\">species</span> can bring the whole structure <span class=\"blank\" data-q=\"3\">(3)</span> - while restoring one can bring benefits that <span class=\"blank\" data-q=\"4\">(4)</span> still being discovered decades later. <span class=\"wv\" data-term=\"predator\" data-ipa=\"/ˈpredətə(r)/\" data-vn=\"động vật săn mồi\">Predators</span> are the <span class=\"wv\" data-term=\"architect\" data-ipa=\"/ˈɑːkɪtekt/\" data-vn=\"kiến trúc sư; nghĩa bóng: kẻ kiến tạo\">architects</span> of the landscapes in which other animals live, shaping the valleys, the forests and even the <span class=\"blank\" data-q=\"5\">(5)</span> of the rivers. Protecting a <span class=\"wv\" data-term=\"species\" data-ipa=\"/ˈspiːʃiːz/\" data-vn=\"loài (sinh vật)\">species</span>, <span class=\"wv\" data-term=\"conservationist\" data-ipa=\"/ˌkɒnsəˈveɪʃənɪst/\" data-vn=\"nhà bảo tồn thiên nhiên\">conservationists</span> argue, means protecting the web of life around it - a web in which every <span class=\"blank\" data-q=\"6\">(6)</span> matters.", "blanks": [{"options": ["destroyed", "to destroy", "destroying", "destroy"], "key": 2, "explain": "Cụm phân từ hiện tại chỉ hành động đồng thời: đàn nai sừng tấm vừa gặm trơ thung lũng vừa 'destroying young trees'. Chủ ngữ của V-ing là 'the elk' ở mệnh đề trước - phải tự suy ra chủ ngữ này mới chọn đúng dạng."}, {"options": ["which", "what", "whose", "whom"], "key": 0, "explain": "'A chain reaction (which) ecologists call...' - đại từ quan hệ làm tân ngữ của 'call' chỉ vật nên dùng 'which' (có thể lược bỏ). 'What' không làm đại từ quan hệ; 'whom/whose' chỉ người/sở hữu."}, {"options": ["away", "down", "out", "off"], "key": 1, "explain": "'Bring the whole structure down' = làm sụp đổ toàn bộ cấu trúc. 'Bring out/off/away' không mang nghĩa phá sập trong ngữ cảnh này."}, {"options": ["are", "have", "be", "were"], "key": 0, "explain": "'Benefits that are still being discovered' - lợi ích vẫn đang được khám phá ở hiện tại, dạng bị động tiếp diễn 'are being + V3'. Chỗ trống chỉ điền phần đầu của cấu trúc nên HS phải nhìn cả cụm 'being discovered' phía sau."}, {"options": ["coasts", "beaches", "cliffs", "banks"], "key": 3, "explain": "'The banks of a river' = hai bên bờ sông - thuật ngữ cố định (câu trước cũng nói tới 'riverbanks'). 'Coasts/beaches' dùng cho bờ biển; 'cliffs' là vách đá dựng đứng, không phải bờ sông."}, {"options": ["web", "line", "thread", "string"], "key": 2, "explain": "Trong ẩn dụ 'web of life' (mạng lưới sự sống), mỗi sợi của tấm lưới là 'thread' (sợi chỉ/sợi tơ). 'Web' lặp lại từ ở mệnh đề trước; 'string/line' không thuộc ẩn dụ dệt lưới này."}]}, {"n": 11, "topic": "A TICKET TO ORBIT", "html": "For most of human history, space was a place only governments could <span class=\"wv\" data-term=\"afford\" data-ipa=\"/əˈfɔːd/\" data-vn=\"đủ khả năng chi trả, kham nổi\">afford</span> to visit. That <span class=\"wv\" data-term=\"era\" data-ipa=\"/ˈɪərə/\" data-vn=\"kỷ nguyên, thời đại\">era</span> is ending. Private companies now sell tickets for flights that carry passengers just beyond the edge of the <span class=\"wv\" data-term=\"atmosphere\" data-ipa=\"/ˈætməsfɪə(r)/\" data-vn=\"khí quyển, bầu khí quyển\">atmosphere</span>, where they experience a few minutes of <span class=\"wv\" data-term=\"weightlessness\" data-ipa=\"/ˈweɪtləsnəs/\" data-vn=\"tình trạng không trọng lượng\">weightlessness</span> and see the <span class=\"wv\" data-term=\"curve\" data-ipa=\"/kɜːv/\" data-vn=\"đường cong\">curve</span> of the Earth. <span class=\"wv\" data-term=\"supporter\" data-ipa=\"/səˈpɔːtə(r)/\" data-vn=\"người ủng hộ\">Supporters</span> argue that today&#x27;s <span class=\"wv\" data-term=\"luxury\" data-ipa=\"/ˈlʌkʃəri/\" data-vn=\"xa xỉ, sang trọng\">luxury</span> trips are <span class=\"wv\" data-term=\"fund\" data-ipa=\"/fʌnd/\" data-vn=\"cấp vốn, tài trợ tiền cho\">funding</span> the technology that <span class=\"blank\" data-q=\"1\">(1)</span> space travel routine tomorrow, just as early aeroplane passengers <span class=\"blank\" data-q=\"2\">(2)</span> the development of <span class=\"wv\" data-term=\"commercial\" data-ipa=\"/kəˈmɜːʃl/\" data-vn=\"thuộc thương mại, để kinh doanh\">commercial</span> <span class=\"wv\" data-term=\"aviation\" data-ipa=\"/ˌeɪviˈeɪʃn/\" data-vn=\"ngành hàng không\">aviation</span> a century ago. Critics are <span class=\"wv\" data-term=\"unconvinced\" data-ipa=\"/ˌʌnkənˈvɪnst/\" data-vn=\"không bị thuyết phục, vẫn hoài nghi\">unconvinced</span>. They point out that each rocket launch releases <span class=\"wv\" data-term=\"enormous\" data-ipa=\"/ɪˈnɔːməs/\" data-vn=\"khổng lồ, cực kỳ lớn\">enormous</span> quantities of carbon, and ask whether a five-minute <span class=\"wv\" data-term=\"thrill\" data-ipa=\"/θrɪl/\" data-vn=\"cảm giác phấn khích, hồi hộp thích thú\">thrill</span> <span class=\"wv\" data-term=\"justify\" data-ipa=\"/ˈdʒʌstɪfaɪ/\" data-vn=\"biện minh cho, cho là xứng đáng\">justifies</span> such a <span class=\"blank\" data-q=\"3\">(3)</span> to the planet. Safety raises another question: unlike aircraft, tested over millions of flights, spacecraft have completed only a <span class=\"blank\" data-q=\"4\">(4)</span> of journeys. Yet passengers who have flown describe the experience in almost <span class=\"wv\" data-term=\"religious\" data-ipa=\"/rɪˈlɪdʒəs/\" data-vn=\"thuộc tôn giáo; ở đây: đầy tôn kính, thiêng liêng\">religious</span> terms: seeing the whole Earth at once changes something <span class=\"wv\" data-term=\"fundamental\" data-ipa=\"/ˌfʌndəˈmentl/\" data-vn=\"căn bản, sâu xa, cốt lõi\">fundamental</span> in you. Whether space tourism becomes a <span class=\"wv\" data-term=\"a force for good\" data-ipa=\"/fɔːs fə(r) ɡʊd/\" data-vn=\"một lực lượng tích cực, yếu tố làm xã hội tốt lên\">force for good</span> or <span class=\"blank\" data-q=\"5\">(5)</span> a playground for the super-rich will depend on choices made in the next decade, by companies and governments <span class=\"blank\" data-q=\"6\">(6)</span>.", "blanks": [{"options": ["made", "would make", "will make", "makes"], "key": 2, "explain": "'The technology that will make space travel routine tomorrow' - mệnh đề quan hệ nói về kết quả tương lai nên dùng 'will make'. 'Would make' cần một điều kiện giả định không có trong câu."}, {"options": ["fund", "funded", "funding", "have funded"], "key": 1, "explain": "Mốc 'a century ago' (một thế kỉ trước) khóa chặt thì quá khứ đơn 'funded'. Đây là manh mối nằm cách chỗ trống khá xa - phải đọc hết câu mới thấy."}, {"options": ["cost", "sacrifice", "damage", "harm"], "key": 0, "explain": "'Such a cost to the planet' = cái giá mà hành tinh phải trả. 'Damage/harm' là danh từ không đếm được nên không đi với 'such a'; 'sacrifice' là sự hi sinh của ai đó dâng cho hành tinh - ngược hướng nghĩa hoàn toàn."}, {"options": ["few", "number", "series", "handful"], "key": 3, "explain": "'Only a handful of journeys' = chỉ một số rất ít chuyến. 'A number of' và 'a series of' đều hàm ý nhiều - mâu thuẫn với 'only'; 'a few of journeys' sai cấu trúc (thừa 'of')."}, {"options": ["remain", "will remain", "remains", "remained"], "key": 2, "explain": "Cấu trúc song song 'becomes a force for good or remains a playground' - hai động từ trong cùng mệnh đề whether phải cùng thì hiện tại đơn 'remains' (chủ ngữ space tourism số ít)."}, {"options": ["at once", "in turn", "as well", "alike"], "key": 3, "explain": "'Companies and governments alike' = cả công ty lẫn chính phủ đều như vậy - 'alike' đứng sau hai danh từ là cách dùng nâng cao. 'As well' đặt ở vị trí này làm đổi nghĩa thành 'ngoài ra'; 'in turn/at once' sai nghĩa."}]}, {"n": 12, "topic": "THE 50-30-20 RULE", "html": "Most teenagers receive their first money with no idea how to <span class=\"wv\" data-term=\"manage\" data-ipa=\"/ˈmænɪdʒ/\" data-vn=\"quản lý, xoay xở (tiền bạc, công việc)\">manage</span> it. <span class=\"wv\" data-term=\"financial\" data-ipa=\"/faɪˈnænʃl/\" data-vn=\"thuộc tài chính, tiền bạc\">Financial</span> advisers often <span class=\"wv\" data-term=\"recommend\" data-ipa=\"/ˌrekəˈmend/\" data-vn=\"khuyên dùng, đề xuất\">recommend</span> a simple rule: spend half of what you earn on needs, three-tenths on wants, and <span class=\"blank\" data-q=\"1\">(1)</span> the remaining two-tenths for the future. A new pair of <span class=\"wv\" data-term=\"trainers\" data-ipa=\"/ˈtreɪnəz/\" data-vn=\"giày thể thao\">trainers</span> may feel like a need, but it is a want - and <span class=\"wv\" data-term=\"treat\" data-ipa=\"/triːt/\" data-vn=\"coi (cái này) như là (cái kia), đối xử\">treating</span> wants as needs is the fastest way to <span class=\"blank\" data-q=\"2\">(2)</span> the rule. Advisers also warn against <span class=\"wv\" data-term=\"impulse buying\" data-ipa=\"/ˈɪmpʌls ˈbaɪɪŋ/\" data-vn=\"mua sắm bốc đồng, thấy là mua không suy nghĩ\">impulse buying</span>: a jacket bought in thirty seconds is soon forgotten; the money is gone <span class=\"wv\" data-term=\"for good\" data-ipa=\"/fə(r) ɡʊd/\" data-vn=\"mãi mãi, vĩnh viễn\">for good</span>. If shoppers <span class=\"blank\" data-q=\"3\">(3)</span> twenty-four hours before buying anything expensive, most impulse purchases would never happen. The real enemy, however, is <span class=\"wv\" data-term=\"comparison\" data-ipa=\"/kəmˈpærɪsn/\" data-vn=\"sự so sánh (với người khác)\">comparison</span>. Social media fills our screens with other people&#x27;s holidays and clothes, <span class=\"wv\" data-term=\"tempting\" data-ipa=\"/ˈtemptɪŋ/\" data-vn=\"đầy cám dỗ, khêu gợi muốn làm theo\">tempting</span> us to live <span class=\"blank\" data-q=\"4\">(4)</span> our means. Those who <span class=\"wv\" data-term=\"resist\" data-ipa=\"/rɪˈzɪst/\" data-vn=\"cưỡng lại, chống lại (cám dỗ)\">resist</span> discover that saving is not really about the money in the bank, but about the freedom to <span class=\"wv\" data-term=\"refuse\" data-ipa=\"/rɪˈfjuːz/\" data-vn=\"từ chối\">refuse</span> a job you hate or accept an <span class=\"wv\" data-term=\"opportunity\" data-ipa=\"/ˌɒpəˈtjuːnəti/\" data-vn=\"cơ hội\">opportunity</span> you would <span class=\"wv\" data-term=\"otherwise\" data-ipa=\"/ˈʌðəwaɪz/\" data-vn=\"nếu không thì; trong trường hợp khác\">otherwise</span> have to <span class=\"blank\" data-q=\"5\">(5)</span>. Start small, but start now: a habit formed at sixteen will be <span class=\"blank\" data-q=\"6\">(6)</span> a <span class=\"wv\" data-term=\"a fortune\" data-ipa=\"/ˈfɔːtʃuːn/\" data-vn=\"một gia tài, số tiền rất lớn\">fortune</span> by the time you are thirty.", "blanks": [{"options": ["save", "to save", "saved", "saving"], "key": 0, "explain": "Chuỗi liệt kê 'spend half..., (spend) three-tenths..., and save the remaining...' - động từ thứ ba phải song song dạng nguyên mẫu trần 'save' với 'spend' ở đầu câu."}, {"options": ["cheat", "break", "beat", "fool"], "key": 1, "explain": "'Break the rule' = phá vỡ, vi phạm quy tắc (ở đây là quy tắc phân loại needs/wants của chính mình). 'Cheat/beat/fool' chỉ đi với 'the system', không đi với 'the rule'."}, {"options": ["will wait", "waited", "wait", "would wait"], "key": 1, "explain": "Vế 'most impulse purchases would never happen' cho thấy điều kiện loại 2, nên mệnh đề if dùng quá khứ đơn 'waited'. Lại một chỗ trống bắt buộc đọc hết câu mới chọn được."}, {"options": ["behind", "under", "within", "beyond"], "key": 3, "explain": "Thành ngữ 'live beyond your means' = sống vượt quá khả năng tài chính. 'Within your means' mang nghĩa ngược lại hoàn toàn - đây là bẫy nghĩa đối lập trong cùng một cụm từ quen thuộc."}, {"options": ["refuse", "refusing", "refused", "refusal"], "key": 0, "explain": "Sau 'have to' dùng động từ nguyên mẫu trần 'refuse'. Câu dài và có mệnh đề chen vào ('you would otherwise have to...') khiến nhiều HS lạc mất cấu trúc chính."}, {"options": ["priced", "valued", "worth", "costing"], "key": 2, "explain": "'Be worth a fortune' = đáng giá cả một gia tài. 'Costing a fortune' nghĩa là tốn kém (thói quen tốt không 'tốn' gia tài); 'valued/priced' cần cấu trúc khác ('valued at')."}]}, {"n": 13, "topic": "FROM BEDROOM GAMER TO PROFESSIONAL", "html": "Ten years ago, playing games <span class=\"wv\" data-term=\"for a living\" data-ipa=\"/fə(r) ə ˈlɪvɪŋ/\" data-vn=\"để kiếm sống\">for a living</span> sounded like a <span class=\"wv\" data-term=\"fantasy\" data-ipa=\"/ˈfæntəsi/\" data-vn=\"điều viễn vông, chỉ có trong tưởng tượng\">fantasy</span>. Professional gamers fill <span class=\"wv\" data-term=\"stadium\" data-ipa=\"/ˈsteɪdiəm/\" data-vn=\"sân vận động\">stadiums</span> and earn salaries most office workers would <span class=\"wv\" data-term=\"envy\" data-ipa=\"/ˈenvi/\" data-vn=\"ghen tị với, thèm muốn như người khác\">envy</span>. The route to the top, however, is <span class=\"wv\" data-term=\"brutal\" data-ipa=\"/ˈbruːtl/\" data-vn=\"khốc liệt, đầy gian khổ\">brutal</span>. A young player who dreams of <span class=\"blank\" data-q=\"1\">(1)</span> professional must practise eight to ten hours a day, studying <span class=\"wv\" data-term=\"opponent\" data-ipa=\"/əˈpəʊnənt/\" data-vn=\"đối thủ\">opponents</span>&#x27; <span class=\"wv\" data-term=\"strategy\" data-ipa=\"/ˈstrætədʒi/\" data-vn=\"chiến thuật, chiến lược\">strategies</span>. Talent alone is not enough: players need <span class=\"wv\" data-term=\"lightning\" data-ipa=\"/ˈlaɪtnɪŋ/\" data-vn=\"sét; trong &#x27;lightning reflexes&#x27;: nhanh như chớp\">lightning</span> <span class=\"wv\" data-term=\"reflex\" data-ipa=\"/ˈriːfleks/\" data-vn=\"phản xạ\">reflexes</span>, <span class=\"wv\" data-term=\"concentration\" data-ipa=\"/ˌkɒnsnˈtreɪʃn/\" data-vn=\"sự tập trung\">concentration</span> and the ability to stay calm when a match worth thousands of dollars <span class=\"blank\" data-q=\"2\">(2)</span> on a single decision. Those who survive treat gaming as a job: teams now employ <span class=\"wv\" data-term=\"coach\" data-ipa=\"/kəʊtʃ/\" data-vn=\"huấn luyện viên\">coaches</span>, <span class=\"wv\" data-term=\"analyst\" data-ipa=\"/ˈænəlɪst/\" data-vn=\"chuyên viên phân tích\">analysts</span> and <span class=\"wv\" data-term=\"psychologist\" data-ipa=\"/saɪˈkɒlədʒɪst/\" data-vn=\"nhà tâm lý học\">psychologists</span> to <span class=\"blank\" data-q=\"3\">(3)</span> their players in <span class=\"wv\" data-term=\"peak condition\" data-ipa=\"/piːk kənˈdɪʃn/\" data-vn=\"trạng thái phong độ, thể lực đỉnh cao\">peak condition</span>. The <span class=\"wv\" data-term=\"reward\" data-ipa=\"/rɪˈwɔːd/\" data-vn=\"phần thưởng, thành quả xứng đáng\">rewards</span> are extraordinary, but for every champion there are thousands of <span class=\"wv\" data-term=\"hopeful\" data-ipa=\"/ˈhəʊpfl/\" data-vn=\"người nuôi hy vọng thành công (trong thi đấu)\">hopefuls</span> who <span class=\"wv\" data-term=\"give up\" data-ipa=\"/ɡɪv ʌp/\" data-vn=\"từ bỏ, bỏ cuộc\">gave up</span> everything and <span class=\"blank\" data-q=\"4\">(4)</span> nothing in return. The professionals themselves are <span class=\"wv\" data-term=\"blunt\" data-ipa=\"/blʌnt/\" data-vn=\"thẳng thắn, nói toạc ra\">blunt</span>: talent gets you noticed, but only <span class=\"wv\" data-term=\"discipline\" data-ipa=\"/ˈdɪsəplɪn/\" data-vn=\"kỷ luật, tính tự giác\">discipline</span> keeps you at the <span class=\"blank\" data-q=\"5\">(5)</span>. Parents who once <span class=\"wv\" data-term=\"dismiss\" data-ipa=\"/dɪˈsmɪs/\" data-vn=\"gạt bỏ, coi thường, không thèm để ý\">dismissed</span> games as a waste of time now ask a different question: not whether their child plays, but whether the child plays with a <span class=\"blank\" data-q=\"6\">(6)</span> - a plan, a balance and a future beyond the screen.", "blanks": [{"options": ["to become", "become", "became", "becoming"], "key": 3, "explain": "'Dream of + V-ing': dreams of becoming professional. Sau giới từ 'of' bắt buộc dùng V-ing - bẫy quen thuộc nhưng vẫn hiệu quả ở tốc độ làm bài nhanh."}, {"options": ["hang", "hanging", "hangs", "hung"], "key": 2, "explain": "'Hang on' ở đây không phải 'treo' mà là 'phụ thuộc vào': a match hangs on a single decision. Chủ ngữ là 'a match' (số ít, cụm 'worth thousands of dollars' chỉ bổ nghĩa) nên dùng 'hangs'. Phải hiểu nghĩa của cụm và xác định đúng chủ ngữ mới chia đúng động từ."}, {"options": ["keep", "hold", "stay", "leave"], "key": 0, "explain": "'Keep somebody in peak condition' = giữ cho ai ở thể trạng đỉnh cao. 'Hold/stay/leave' đều không tạo thành cụm này với 'in peak condition'."}, {"options": ["have got", "got", "get", "getting"], "key": 1, "explain": "'Gave up everything and got nothing in return' - động từ thứ hai song song quá khứ đơn với 'gave' ở phía trước. Mệnh đề quan hệ dài làm HS dễ quên mốc thời gian của động từ chính."}, {"options": ["lead", "head", "top", "best"], "key": 2, "explain": "'At the top' = ở vị trí đỉnh cao (trong nghề). 'At the head' là ở đầu bàn/đầu hàng; 'lead' phải dùng trong cụm 'in the lead'; 'at the best' sai cấu trúc."}, {"options": ["luck", "plan", "talent", "purpose"], "key": 3, "explain": "Phần sau dấu gạch ngang liệt kê 'a plan, a balance and a future' - tất cả đều là biểu hiện của 'purpose' (mục đích, định hướng rõ ràng). 'Plan' chỉ là một phần của đáp án nên chọn 'plan' sẽ hẹp hơn ý toàn câu."}]}, {"n": 14, "topic": "THE MIDNIGHT ZONE", "html": "Far fewer people have dived to the deepest part of the ocean than have travelled into space. The reason is simple: the deep sea is the most <span class=\"wv\" data-term=\"hostile\" data-ipa=\"/ˈhɒstaɪl/\" data-vn=\"khắc nghiệt, thù địch (môi trường sống)\">hostile</span> environment on Earth. Below a thousand metres, the water is <span class=\"wv\" data-term=\"pitch black\" data-ipa=\"/pɪtʃ blæk/\" data-vn=\"tối đen như mực\">pitch black</span>, the temperature <span class=\"wv\" data-term=\"hover\" data-ipa=\"/ˈhɒvə(r)/\" data-vn=\"lơ lửng quanh một mức, dao động nhẹ\">hovers</span> just above <span class=\"wv\" data-term=\"freezing\" data-ipa=\"/ˈfriːzɪŋ/\" data-vn=\"mức đóng băng (khoảng 0 độ C)\">freezing</span>, and the <span class=\"wv\" data-term=\"pressure\" data-ipa=\"/ˈpreʃə(r)/\" data-vn=\"áp suất, áp lực\">pressure</span> would <span class=\"wv\" data-term=\"crush\" data-ipa=\"/krʌʃ/\" data-vn=\"nghiền nát, ép bẹp\">crush</span> an ordinary <span class=\"wv\" data-term=\"submarine\" data-ipa=\"/ˈsʌbməriːn/\" data-vn=\"tàu ngầm\">submarine</span> like a <span class=\"wv\" data-term=\"tin can\" data-ipa=\"/tɪn kæn/\" data-vn=\"lon thiếc (vật mỏng, dễ bị bẹp)\">tin can</span>. The <span class=\"wv\" data-term=\"creature\" data-ipa=\"/ˈkriːtʃə(r)/\" data-vn=\"sinh vật, loài vật\">creatures</span> that live there survive by eating the <span class=\"wv\" data-term=\"constant\" data-ipa=\"/ˈkɒnstənt/\" data-vn=\"liên tục, không ngừng\">constant</span> rain of dead <span class=\"wv\" data-term=\"matter\" data-ipa=\"/ˈmætə(r)/\" data-vn=\"vật chất, chất (hữu cơ)\">matter</span> <span class=\"blank\" data-q=\"1\">(1)</span> from the surface world above. Until recently, this zone could not <span class=\"blank\" data-q=\"2\">(2)</span> by any vehicle <span class=\"wv\" data-term=\"in existence\" data-ipa=\"/ɪɡˈzɪstəns/\" data-vn=\"đang tồn tại, hiện có trên đời\">in existence</span>. The deep ocean <span class=\"wv\" data-term=\"absorb\" data-ipa=\"/əbˈzɔːb/\" data-vn=\"hấp thụ, hút vào\">absorbs</span> enormous amounts of heat and carbon, yet it is already being <span class=\"blank\" data-q=\"3\">(3)</span> by mining companies eager for the <span class=\"wv\" data-term=\"valuable\" data-ipa=\"/ˈvæljuəbl/\" data-vn=\"có giá trị, quý giá\">valuable</span> metals on its floor. What we do to this hidden world in the next twenty years may <span class=\"blank\" data-q=\"4\">(4)</span> the health of the oceans for centuries. We cannot protect what we have not yet learned to <span class=\"blank\" data-q=\"5\">(5)</span> - and we have <span class=\"wv\" data-term=\"explore\" data-ipa=\"/ɪkˈsplɔː(r)/\" data-vn=\"khám phá, thám hiểm\">explored</span> less of the deep sea than of the surface of Mars. The map of the planet still has a <span class=\"wv\" data-term=\"vast\" data-ipa=\"/vɑːst/\" data-vn=\"mênh mông, bao la\">vast</span> <span class=\"wv\" data-term=\"blank\" data-ipa=\"/blæŋk/\" data-vn=\"trống, chưa có gì (vùng chưa khám phá)\">blank</span> space at its centre: a world as large as a continent that remains almost entirely <span class=\"blank\" data-q=\"6\">(6)</span>.", "blanks": [{"options": ["drifting", "drift", "drifted", "to drift"], "key": 0, "explain": "Mệnh đề quan hệ rút gọn chủ động: 'dead matter (which is) drifting from the surface' - vật chất đang trôi xuống nên dùng phân từ hiện tại 'drifting'. 'Drifted' sẽ mang nghĩa bị động vô lý."}, {"options": ["reach", "be reached", "reaching", "reached"], "key": 1, "explain": "'This zone could not be reached' - vùng biển là đối tượng được tiếp cận nên cần bị động sau 'could not'. Cấu trúc 'could not be + V3' là dạng nâng cao của modal passive."}, {"options": ["targets", "targeting", "targeted", "target"], "key": 2, "explain": "'It is already being targeted by mining companies' - bị động tiếp diễn: is being + V3 'targeted'. Chỗ trống nằm ở cuối cấu trúc nên HS phải lắp ghép cả cụm 'is being...' mới chọn đúng."}, {"options": ["predict", "define", "settle", "determine"], "key": 3, "explain": "'Determine the health of the oceans' = định đoạt, quyết định tình trạng của đại dương trong nhiều thế kỉ. 'Define' là định nghĩa; 'settle' là giải quyết một tranh chấp; 'predict' là dự đoán - việc con người làm không thể 'dự đoán' sức khỏe đại dương, nó quyết định sức khỏe đó."}, {"options": ["value", "cost", "rate", "price"], "key": 0, "explain": "'Learn to value' = học cách trân trọng, coi trọng. 'Price/cost/rate' đều là 'định giá' theo nghĩa tiền bạc - sai hoàn toàn với thông điệp bảo vệ đại dương của câu."}, {"options": ["undiscovered", "unexplored", "uninhabited", "unpolluted"], "key": 1, "explain": "'Unexplored' = đã biết là tồn tại nhưng chưa được khám phá - đúng với đáy biển sâu. 'Undiscovered' sai vì ta đã biết nó ở đó; 'uninhabited' sai vì vẫn có sinh vật sống; 'unpolluted' sai vì vi nhựa đã chạm tới nơi này."}]}, {"n": 15, "topic": "ONE TAKE: THE ART OF THE LONG SHOT", "html": "Most films are built from thousands of short pieces, <span class=\"wv\" data-term=\"edit\" data-ipa=\"/ˈedɪt/\" data-vn=\"biên tập, dựng (phim)\">edited</span> together <span class=\"wv\" data-term=\"invisibly\" data-ipa=\"/ɪnˈvɪzəbli/\" data-vn=\"một cách vô hình, không để lại dấu vết\">invisibly</span>. A small number of directors prefer the opposite approach: filming a whole movie in one <span class=\"wv\" data-term=\"continuous\" data-ipa=\"/kənˈtɪnjuəs/\" data-vn=\"liên tục, không ngắt quãng\">continuous</span> <span class=\"wv\" data-term=\"take (film)\" data-ipa=\"/teɪk/\" data-vn=\"cú máy: một lần quay liên tục không cắt\">take</span>. The results can be <span class=\"wv\" data-term=\"electrifying\" data-ipa=\"/ɪˈlektrɪfaɪɪŋ/\" data-vn=\"gây phấn khích tột độ, nghẹt thở\">electrifying</span>, but the risks are enormous. If an actor forgets a line in the final minute of a ten-minute shot, everything must begin again from <span class=\"blank\" data-q=\"1\">(1)</span>. Such scenes are planned with <span class=\"wv\" data-term=\"military precision\" data-ipa=\"/ˈmɪlɪtri prɪˈsɪʒn/\" data-vn=\"độ chính xác tuyệt đối như trong quân đội\">military precision</span>: the camera operator, <span class=\"blank\" data-q=\"2\">(2)</span> through a crowded set, must never <span class=\"wv\" data-term=\"block\" data-ipa=\"/blɒk/\" data-vn=\"chắn, che khuất\">block</span> the actors. In one famous war film, the camera appears to follow soldiers across a battlefield in one <span class=\"wv\" data-term=\"unbroken\" data-ipa=\"/ʌnˈbrəʊkən/\" data-vn=\"không bị ngắt, liền mạch\">unbroken</span> shot lasting two hours; by the time filming began, the crew <span class=\"blank\" data-q=\"3\">(3)</span> the shot more than forty times. Because the camera never cuts, the audience experiences events in real time, sharing the characters&#x27; <span class=\"wv\" data-term=\"exhaustion\" data-ipa=\"/ɪɡˈzɔːstʃən/\" data-vn=\"sự kiệt sức\">exhaustion</span> and fear <span class=\"wv\" data-term=\"as if\" data-ipa=\"/æz ɪf/\" data-vn=\"như thể là, cứ như\">as if</span> they <span class=\"blank\" data-q=\"4\">(4)</span> the characters themselves. When such shots work, no <span class=\"wv\" data-term=\"editing\" data-ipa=\"/ˈedɪtɪŋ/\" data-vn=\"việc dựng phim, biên tập phim\">editing</span> trick can <span class=\"blank\" data-q=\"5\">(5)</span> their effect. The director&#x27;s <span class=\"wv\" data-term=\"gamble\" data-ipa=\"/ˈɡæmbl/\" data-vn=\"canh bạc, sự đánh cược mạo hiểm\">gamble</span> is simple: <span class=\"wv\" data-term=\"trade\" data-ipa=\"/treɪd/\" data-vn=\"đánh đổi, đổi cái này lấy cái kia\">trade</span> the safety of the <span class=\"wv\" data-term=\"editing\" data-ipa=\"/ˈedɪtɪŋ/\" data-vn=\"việc dựng phim, biên tập phim\">editing</span> room for one <span class=\"wv\" data-term=\"unbroken\" data-ipa=\"/ʌnˈbrəʊkən/\" data-vn=\"không bị ngắt, liền mạch\">unbroken</span> piece of reality, knowing that a single mistake means starting <span class=\"wv\" data-term=\"all over again\" data-ipa=\"/ɔːl ˈəʊvə(r) əˈɡen/\" data-vn=\"lại từ đầu, làm lại toàn bộ\">all over again</span> - and that the <span class=\"blank\" data-q=\"6\">(6)</span> could not be higher.", "blanks": [{"options": ["first", "beginning", "start", "scratch"], "key": 3, "explain": "Thành ngữ 'from scratch' = từ đầu, từ con số không. 'Beginning/start' đều cần 'the' phía trước ('from the beginning') và 'from first' không tồn tại - cả ba đều bị loại bởi chính cấu trúc 'from §' trống trơn của câu, một bẫy ngữ pháp ẩn trong câu hỏi từ vựng."}, {"options": ["weaves", "weaving", "woven", "weave"], "key": 1, "explain": "Cụm phân từ chen giữa hai dấu phẩy bổ nghĩa cho 'the camera operator': 'the operator, weaving through a crowded set, must never block...' - dùng phân từ hiện tại 'weaving'. Phải nhận ra mệnh đề chính bắt đầu ở 'must' phía sau."}, {"options": ["rehearsed", "rehearses", "had rehearsed", "have rehearsed"], "key": 2, "explain": "'By the time filming began, the crew had rehearsed...' - quá khứ hoàn thành cho hành động hoàn tất trước một mốc quá khứ khác. 'By the time' là dấu hiệu quyết định nằm ngay đầu mệnh đề."}, {"options": ["were", "be", "are", "is"], "key": 0, "explain": "'As if they were the characters themselves' - sau 'as if' diễn tả điều không có thật ở hiện tại dùng 'were' cho mọi ngôi. Khán giả không thể thực sự là nhân vật nên không dùng 'are'."}, {"options": ["explain", "guarantee", "match", "deserve"], "key": 2, "explain": "'No editing trick can match their effect' = không thủ thuật dựng phim nào sánh bằng hiệu quả đó. 'Explain/guarantee/deserve' đều không kết hợp được với 'their effect' theo nghĩa so sánh mức độ hiệu quả này."}, {"options": ["losses", "bets", "chances", "stakes"], "key": 3, "explain": "'The stakes' = mức được thua, tầm quan trọng của một quyết định mạo hiểm - 'the stakes could not be higher' là cụm cố định. 'Bets' là các khoản đặt cược, 'chances' là cơ hội, 'losses' là thiệt hại đã xảy ra - không từ nào tạo được cụm này."}]}, {"n": 16, "topic": "VOYAGER 1: ONE LIGHT-DAY FROM HOME", "html": "On 18 November 2026, NASA&#x27;s Voyager 1 became the first <span class=\"wv\" data-term=\"human-made\" data-ipa=\"/ˈhjuːmən meɪd/\" data-vn=\"do con người chế tạo\">human-made</span> object to travel one light-day from Earth: <span class=\"wv\" data-term=\"roughly\" data-ipa=\"/ˈrʌfli/\" data-vn=\"khoảng chừng, xấp xỉ\">roughly</span> 26 billion kilometres, the distance light itself needs a full 24 hours to cover. Launched in 1977, the <span class=\"wv\" data-term=\"probe\" data-ipa=\"/prəʊb/\" data-vn=\"tàu thăm dò (không người lái)\">probe</span> is now so far away that a signal sent from Earth <span class=\"blank\" data-q=\"1\">(1)</span> a whole day to reach it, and any reply takes another day to come home. NASA announced the record only a day later: by the time the news was confirmed, the <span class=\"wv\" data-term=\"probe\" data-ipa=\"/prəʊb/\" data-vn=\"tàu thăm dò (không người lái)\">probe</span>&#x27;s signal <span class=\"blank\" data-q=\"2\">(2)</span> through space for a full 24 hours. Still <span class=\"wv\" data-term=\"race\" data-ipa=\"/reɪs/\" data-vn=\"l
