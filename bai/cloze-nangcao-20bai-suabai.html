ao đi rất nhanh\">racing</span> <span class=\"wv\" data-term=\"outwards\" data-ipa=\"/ˈaʊtwədz/\" data-vn=\"hướng ra phía ngoài\">outwards</span> at 61,000 kilometres per hour, Voyager 1 has left the Sun&#x27;s <span class=\"wv\" data-term=\"influence\" data-ipa=\"/ˈɪnfluəns/\" data-vn=\"ảnh hưởng; vùng ảnh hưởng\">influence</span> behind and entered <span class=\"blank\" data-q=\"3\">(3)</span> space, the empty region between the stars. On board is the Golden Record, a collection of Earth&#x27;s sounds and images - in effect, a message in a <span class=\"blank\" data-q=\"4\">(4)</span>, thrown into the cosmic ocean for any <span class=\"wv\" data-term=\"civilisation\" data-ipa=\"/ˌsɪvəlaɪˈzeɪʃn/\" data-vn=\"nền văn minh\">civilisation</span> that might find it one day. But the <span class=\"wv\" data-term=\"probe\" data-ipa=\"/prəʊb/\" data-vn=\"tàu thăm dò (không người lái)\">probe</span>&#x27;s power is slowly <span class=\"wv\" data-term=\"run out\" data-ipa=\"/rʌn aʊt/\" data-vn=\"sắp cạn kiệt (năng lượng, thời gian)\">running out</span>. By the time it fails completely, around 2036, Voyager 1 <span class=\"blank\" data-q=\"5\">(5)</span> nearly six decades in space. Long after its last signal <span class=\"wv\" data-term=\"fade\" data-ipa=\"/feɪd/\" data-vn=\"mờ dần, yếu dần (tín hiệu, âm thanh)\">fades</span>, it will <span class=\"wv\" data-term=\"drift\" data-ipa=\"/drɪft/\" data-vn=\"trôi dạt, trôi lững lờ\">drift</span> on in silence, and its story will continue to <span class=\"blank\" data-q=\"6\">(6)</span> us how small our planet is, and how far a single message can travel.", "blanks": [{"options": ["take", "took", "takes", "taking"], "key": 2, "explain": "Chủ ngữ 'a signal' số ít và đây là sự thật lâu dài ở hiện tại (tín hiệu luôn mất 1 ngày) nên dùng hiện tại đơn 'takes'."}, {"options": ["had been travelling", "has been travelling", "is travelling", "travels"], "key": 0, "explain": "Quá khứ hoàn thành tiếp diễn: tín hiệu đã di chuyển suốt 24 giờ trước thời điểm tin được xác nhận. Dấu hiệu: 'by the time' + 'for a full 24 hours'."}, {"options": ["international", "interstellar", "interplanetary", "interactive"], "key": 1, "explain": "'Interstellar' = giữa các vì sao, khớp phần giải nghĩa 'the empty region between the stars'. 'Interplanetary' chỉ là giữa các hành tinh trong hệ Mặt Trời - tàu đã vượt qua vùng này."}, {"options": ["box", "disc", "capsule", "bottle"], "key": 3, "explain": "Thành ngữ 'a message in a bottle' = thông điệp trong chai thả trôi, khớp 'thrown into the cosmic ocean'. Dù Golden Record thực chất là đĩa, 'disc' là bẫy dữ kiện."}, {"options": ["will spend", "has spent", "will have spent", "spent"], "key": 2, "explain": "'By the time it fails... around 2036' - mốc tương lai, hành động hoàn tất trước mốc đó nên dùng tương lai hoàn thành 'will have spent'."}, {"options": ["remember", "remind", "recall", "memorise"], "key": 1, "explain": "Cấu trúc 'remind somebody how...' = gợi cho ai nhớ về điều gì. 'Remember/recall' không đi với tân ngữ người + mệnh đề how theo cách này."}]}, {"n": 17, "topic": "AN EXTRA DAY BEFORE THE STORM", "html": "For decades, weather forecasting improved at a painfully slow <span class=\"wv\" data-term=\"pace\" data-ipa=\"/peɪs/\" data-vn=\"tốc độ, nhịp độ tiến triển\">pace</span>, gaining roughly one day of <span class=\"wv\" data-term=\"accuracy\" data-ipa=\"/ˈækjərəsi/\" data-vn=\"độ chính xác\">accuracy</span> every ten years. By the end of 2026, however, that slow progress <span class=\"blank\" data-q=\"1\">(1)</span> an end, thanks to WeatherNext Cyclones, an AI system built by Google DeepMind. Trained on fifty years of weather records and nearly 5,000 historical storms, the system predicts a <span class=\"wv\" data-term=\"cyclone\" data-ipa=\"/ˈsaɪkləʊn/\" data-vn=\"bão xoáy nhiệt đới\">cyclone</span>&#x27;s path, <span class=\"wv\" data-term=\"strength\" data-ipa=\"/streŋθ/\" data-vn=\"cường độ, sức mạnh\">strength</span> and size all at once. In tests on storms between 2023 and 2025, its five-day forecast of a storm&#x27;s position was wrong by 230 kilometres <span class=\"wv\" data-term=\"on average\" data-ipa=\"/ɒn ˈævərɪdʒ/\" data-vn=\"tính trung bình\">on average</span>, <span class=\"blank\" data-q=\"2\">(2)</span> with 370 kilometres for Europe&#x27;s leading model. The AI also proved better at spotting rapid <span class=\"wv\" data-term=\"intensification\" data-ipa=\"/ɪnˌtensɪfɪˈkeɪʃn/\" data-vn=\"sự mạnh lên nhanh chóng (của bão)\">intensification</span>, the sudden strengthening that makes some storms so <span class=\"blank\" data-q=\"3\">(3)</span>. In 2025, it helped American <span class=\"wv\" data-term=\"forecaster\" data-ipa=\"/ˈfɔːkɑːstə(r)/\" data-vn=\"chuyên gia dự báo (thời tiết)\">forecasters</span> predict that <span class=\"wv\" data-term=\"hurricane\" data-ipa=\"/ˈhʌrɪkən/\" data-vn=\"bão lớn ở Đại Tây Dương\">Hurricane</span> Melissa <span class=\"blank\" data-q=\"4\">(4)</span> from a weak storm into one of the most powerful hurricanes <span class=\"wv\" data-term=\"on record\" data-ipa=\"/ɒn ˈrekɔːd/\" data-vn=\"được ghi nhận trong lịch sử, có số liệu lưu lại\">on record</span>. And by generating up to 1,000 possible <span class=\"wv\" data-term=\"version\" data-ipa=\"/ˈvɜːʃn/\" data-vn=\"phiên bản; ở đây: kịch bản dự báo\">versions</span> of a storm&#x27;s future, it gives <span class=\"wv\" data-term=\"coastal\" data-ipa=\"/ˈkəʊstl/\" data-vn=\"ven biển, duyên hải\">coastal</span> communities a vital head <span class=\"blank\" data-q=\"5\">(5)</span>: an extra day to prepare before the winds arrive. Experts note, however, that <span class=\"wv\" data-term=\"rainfall\" data-ipa=\"/ˈreɪnfɔːl/\" data-vn=\"lượng mưa\">rainfall</span> and <span class=\"wv\" data-term=\"flooding\" data-ipa=\"/ˈflʌdɪŋ/\" data-vn=\"ngập lụt, lũ lụt\">flooding</span> - which <span class=\"blank\" data-q=\"6\">(6)</span> for most storm deaths - are things the AI cannot yet predict.", "blanks": [{"options": ["has come to", "had come to", "comes to", "come to"], "key": 1, "explain": "'By the end of 2026' đặt mốc quá khứ hoàn thành: sự tiến bộ chậm đã kết thúc trước/trong năm 2026 nhờ hệ thống mới - dùng 'had come to an end'."}, {"options": ["comparing", "comparison", "compared", "compare"], "key": 2, "explain": "Mệnh đề rút gọn với phân từ bị động: '(when) compared with 370 kilometres' = khi so với 370 km của mô hình châu Âu."}, {"options": ["deathly", "dying", "dead", "deadly"], "key": 3, "explain": "'Deadly' = gây chết người, nguy hiểm chết người (deadly storm). 'Deathly' nghĩa là như chết (deathly silence/pale), không dùng cho mức độ nguy hiểm của bão."}, {"options": ["would grow", "will grow", "grows", "has grown"], "key": 0, "explain": "Tường thuật ở quá khứ: 'forecasters predict that...' trong bối cảnh 2025 - động từ dự đoán về tương lai tại thời điểm đó phải lùi thành 'would grow'."}, {"options": ["beginning", "lead", "start", "edge"], "key": 2, "explain": "Thành ngữ 'a head start' = lợi thế xuất phát sớm. Ở đây là lợi thế thêm một ngày chuẩn bị trước bão."}, {"options": ["explain", "cause", "blame", "account"], "key": 3, "explain": "Cụm 'account for' = chiếm/chịu trách nhiệm cho (một tỉ lệ, nguyên nhân). Mưa và ngập lụt 'account for most storm deaths' = là nguyên nhân của phần lớn ca tử vong do bão."}]}, {"n": 18, "topic": "FUTA, THE RED PANDA WHO REFUSED TO GROW OLD", "html": "In 2005, a red panda at Chiba Zoological Park in Japan became a national <span class=\"wv\" data-term=\"sensation\" data-ipa=\"/senˈseɪʃn/\" data-vn=\"hiện tượng gây sốt, sự kiện làm xôn xao\">sensation</span> for an unusual reason: he kept standing <span class=\"wv\" data-term=\"upright\" data-ipa=\"/ˈʌpraɪt/\" data-vn=\"thẳng đứng, dựng đứng\">upright</span> on his <span class=\"wv\" data-term=\"hind\" data-ipa=\"/haɪnd/\" data-vn=\"ở phía sau (chân sau, phần sau)\">hind</span> legs, like a small person surveying his surroundings. Two decades later, that same panda, Futa, has made <span class=\"wv\" data-term=\"headline\" data-ipa=\"/ˈhedlaɪn/\" data-vn=\"tít lớn trên báo; &#x27;make headlines&#x27;: lên mặt báo\">headlines</span> again - this time for refusing to grow old. On 17 November 2026, at the age of 23 years and 135 days, Futa <span class=\"blank\" data-q=\"1\">(1)</span> by Guinness World Records as the oldest living red panda in <span class=\"wv\" data-term=\"captivity\" data-ipa=\"/kæpˈtɪvəti/\" data-vn=\"tình trạng bị nuôi nhốt (trong vườn thú)\">captivity</span>. The achievement is remarkable because red pandas <span class=\"wv\" data-term=\"typically\" data-ipa=\"/ˈtɪpɪkli/\" data-vn=\"thông thường, điển hình là\">typically</span> live only twelve to seventeen years in zoos, and the previous <span class=\"wv\" data-term=\"record holder\" data-ipa=\"/ˈrekɔːd ˈhəʊldə(r)/\" data-vn=\"người/con vật đang giữ kỷ lục\">record holder</span>, an American panda named Taylor, <span class=\"blank\" data-q=\"2\">(2)</span> the age of 21 years and 265 days. Futa himself did not attend the <span class=\"wv\" data-term=\"ceremony\" data-ipa=\"/ˈserəməni/\" data-vn=\"buổi lễ, nghi lễ\">ceremony</span>: expecting a <span class=\"wv\" data-term=\"sharp\" data-ipa=\"/ʃɑːp/\" data-vn=\"đột ngột và mạnh (thay đổi, giảm nhiệt độ)\">sharp</span> drop in temperature, the zoo decided not to put its <span class=\"wv\" data-term=\"elderly\" data-ipa=\"/ˈeldəli/\" data-vn=\"già, cao tuổi\">elderly</span> star <span class=\"wv\" data-term=\"on display\" data-ipa=\"/ɒn dɪˈspleɪ/\" data-vn=\"được trưng ra cho công chúng xem\">on display</span>, <span class=\"blank\" data-q=\"3\">(3)</span> disappointed the crowds. Born in 2003 and at Chiba since 2004, Futa can no longer stand <span class=\"wv\" data-term=\"upright\" data-ipa=\"/ˈʌpraɪt/\" data-vn=\"thẳng đứng, dựng đứng\">upright</span> - his <span class=\"wv\" data-term=\"eyesight\" data-ipa=\"/ˈaɪsaɪt/\" data-vn=\"thị lực, sức nhìn\">eyesight</span> has faded and one <span class=\"wv\" data-term=\"hind\" data-ipa=\"/haɪnd/\" data-vn=\"ở phía sau (chân sau, phần sau)\">hind</span> leg gives him trouble - but keepers say his <span class=\"wv\" data-term=\"appetite\" data-ipa=\"/ˈæpɪtaɪt/\" data-vn=\"sự thèm ăn, ăn ngon miệng\">appetite</span> remains <span class=\"wv\" data-term=\"hearty\" data-ipa=\"/ˈhɑːti/\" data-vn=\"khỏe mạnh, ngon lành (ăn uống)\">hearty</span> and his condition <span class=\"wv\" data-term=\"stable\" data-ipa=\"/ˈsteɪbl/\" data-vn=\"ổn định (tình trạng sức khỏe)\">stable</span>. He still has one more record in his <span class=\"blank\" data-q=\"4\">(4)</span>: the oldest red panda ever, Kusu, reached 24, and if Futa <span class=\"blank\" data-q=\"5\">(5)</span> another year, the all-time title will be his as well. For his old fans, the story is a reminder that fame rarely <span class=\"blank\" data-q=\"6\">(6)</span> - but good care, apparently, can last much longer.", "blanks": [{"options": ["recognised", "was recognised", "has recognised", "is recognising"], "key": 1, "explain": "Bị động quá khứ đơn: Futa 'was recognised by Guinness World Records' - có 'by + tác nhân' phía sau nên bắt buộc dạng bị động."}, {"options": ["arrived", "gained", "got", "reached"], "key": 3, "explain": "'Reach the age of...' = đạt tới độ tuổi. 'Arrive' phải đi với 'at', 'get/gain the age' không phải collocation."}, {"options": ["that", "what", "which", "it"], "key": 2, "explain": "Mệnh đề quan hệ không xác định sau dấu phẩy, thay cho cả mệnh đề phía trước ('the zoo decided not to put its star on display') - chỉ dùng 'which', không dùng 'that' sau dấu phẩy."}, {"options": ["view", "sights", "aim", "target"], "key": 1, "explain": "Thành ngữ 'have something in your sights' = đang nhắm tới, trong tầm ngắm. 'In his view' nghĩa là 'theo ý kiến của anh ta', sai nghĩa."}, {"options": ["survived", "will survive", "would survive", "survives"], "key": 3, "explain": "Câu điều kiện loại 1: 'if Futa survives another year, the all-time title will be his' - mệnh đề if dùng hiện tại đơn, mệnh đề chính dùng will."}, {"options": ["lasts", "stays", "remains", "continues"], "key": 0, "explain": "'Fame rarely lasts' = danh tiếng hiếm khi kéo dài. 'Remains' cần bổ ngữ phía sau, 'stays/continues' không diễn đạt được nghĩa tồn tại lâu dài trong câu này."}]}, {"n": 19, "topic": "WHEN THE DESERT WAS GREEN", "html": "Today, the Empty Quarter of Saudi Arabia is one of the driest places on Earth, a sea of sand stretching to the <span class=\"wv\" data-term=\"horizon\" data-ipa=\"/həˈraɪzn/\" data-vn=\"đường chân trời\">horizon</span>. Yet 125,000 years ago, this same landscape held a <span class=\"wv\" data-term=\"freshwater\" data-ipa=\"/ˈfreʃwɔːtə(r)/\" data-vn=\"nước ngọt (sông, hồ)\">freshwater</span> lake of some 340 square kilometres, and around its <span class=\"wv\" data-term=\"shore\" data-ipa=\"/ʃɔː(r)/\" data-vn=\"bờ (hồ, biển)\">shores</span> lived hippos, giant buffalo and herds of <span class=\"wv\" data-term=\"gazelle\" data-ipa=\"/ɡəˈzel/\" data-vn=\"linh dương gazelle\">gazelles</span>. Evidence for this lost world, published in the journal Science in November 2026, comes from more than 500 <span class=\"wv\" data-term=\"fossil\" data-ipa=\"/ˈfɒsl/\" data-vn=\"hóa thạch\">fossils</span> and 5,500 stone tools <span class=\"blank\" data-q=\"1\">(1)</span> at a site called Uruq al-Julaybah. Researchers from Saudi Arabia, Australia and several other countries have <span class=\"wv\" data-term=\"reconstruct\" data-ipa=\"/ˌriːkənˈstrʌkt/\" data-vn=\"tái dựng lại, dựng lại bức tranh quá khứ\">reconstructed</span> a period known as Green Arabia: by the time early humans reached the lake, increased rainfall <span class=\"blank\" data-q=\"2\">(2)</span> the desert into <span class=\"wv\" data-term=\"grassland\" data-ipa=\"/ˈɡrɑːslænd/\" data-vn=\"đồng cỏ\">grassland</span>. Most remarkable of all are the stone points found <span class=\"wv\" data-term=\"cluster\" data-ipa=\"/ˈklʌstə(r)/\" data-vn=\"tụ tập, tập trung thành cụm\">clustered</span> near animal bones, which carry <span class=\"wv\" data-term=\"trace\" data-ipa=\"/treɪs/\" data-vn=\"dấu vết, vết tích còn sót lại\">traces</span> of plant <span class=\"wv\" data-term=\"resin\" data-ipa=\"/ˈrezɪn/\" data-vn=\"nhựa cây\">resin</span> and <span class=\"wv\" data-term=\"fibre\" data-ipa=\"/ˈfaɪbə(r)/\" data-vn=\"sợi (thực vật, vải)\">fibres</span>. The team believes the points were fixed to wooden <span class=\"wv\" data-term=\"shaft\" data-ipa=\"/ʃɑːft/\" data-vn=\"cán dài (của giáo, mũi tên)\">shafts</span> and possibly dipped in <span class=\"wv\" data-term=\"poison\" data-ipa=\"/ˈpɔɪzn/\" data-vn=\"chất độc\">poison</span> - if so, they would be the oldest poisoned hunting weapons ever found, <span class=\"blank\" data-q=\"3\">(3)</span> the previous record by some 65,000 years. The discovery <span class=\"wv\" data-term=\"challenge\" data-ipa=\"/ˈtʃælɪndʒ/\" data-vn=\"thách thức, đặt dấu hỏi cho (quan điểm cũ)\">challenges</span> the <span class=\"wv\" data-term=\"long-held\" data-ipa=\"/ˌlɒŋ ˈheld/\" data-vn=\"đã tồn tại, được tin theo từ lâu\">long-held</span> view that early humans <span class=\"wv\" data-term=\"merely\" data-ipa=\"/ˈmɪəli/\" data-vn=\"chỉ đơn thuần là, chỉ\">merely</span> passed through Arabia on their way to other <span class=\"wv\" data-term=\"continent\" data-ipa=\"/ˈkɒntɪnənt/\" data-vn=\"châu lục, lục địa\">continents</span>. Instead, it suggests they <span class=\"blank\" data-q=\"4\">(4)</span> beside its lakes for <span class=\"wv\" data-term=\"generation\" data-ipa=\"/ˌdʒenəˈreɪʃn/\" data-vn=\"thế hệ; nhiều thế hệ nối tiếp\">generations</span> - at least until the climate turned and the water <span class=\"blank\" data-q=\"5\">(5)</span>. What remains is a powerful <span class=\"wv\" data-term=\"reminder\" data-ipa=\"/rɪˈmaɪndə(r)/\" data-vn=\"điều gợi nhớ, lời nhắc nhở\">reminder</span> that a whole world of lakes and hippos can vanish without <span class=\"blank\" data-q=\"6\">(6)</span>.", "blanks": [{"options": ["unearthing", "which unearthed", "unearthed", "unearth"], "key": 2, "explain": "Mệnh đề quan hệ rút gọn dạng bị động: tools '(which were) unearthed at a site' = những công cụ được khai quật tại một địa điểm."}, {"options": ["transformed", "has transformed", "transforms", "had transformed"], "key": 3, "explain": "'By the time early humans reached the lake' là mốc quá khứ; việc mưa biến sa mạc thành đồng cỏ xảy ra trước mốc đó nên dùng quá khứ hoàn thành 'had transformed'."}, {"options": ["beating", "beat", "beaten", "to beat"], "key": 0, "explain": "Cụm phân từ hiện tại mở đầu mệnh đề phụ kết quả: '...ever found, beating the previous record by...' = phá kỷ lục trước đó tới khoảng 65.000 năm."}, {"options": ["camped", "stayed", "rested", "settled"], "key": 3, "explain": "'Settled beside its lakes for generations' = định cư bên hồ qua nhiều thế hệ. 'Camped/stayed/rested' đều là tạm thời, mâu thuẫn với 'for generations'."}, {"options": ["dried out", "dried up", "dried off", "dried down"], "key": 1, "explain": "'The water dried up' = nước cạn kiệt, biến mất (dùng cho sông hồ). 'Dried out' là làm khô một vật ướt, chủ ngữ phải là vật bị làm khô."}, {"options": ["a trace", "a sign", "a mark", "a sound"], "key": 0, "explain": "Thành ngữ 'vanish without a trace' = biến mất không để lại dấu vết. Đây là cụm cố định, không thay bằng 'a sign/a mark'."}]}, {"n": 20, "topic": "AI THAT THINKS WITH LIGHT", "html": "Modern artificial intelligence has a growing <span class=\"wv\" data-term=\"appetite\" data-ipa=\"/ˈæpɪtaɪt/\" data-vn=\"sự thèm ăn; nghĩa bóng: nhu cầu rất lớn, sự &#x27;khát&#x27; (điện năng)\">appetite</span> for electricity: training large models can consume as much power as a small city. In a study published in November 2026, they describe an AI system built around a loop of <span class=\"wv\" data-term=\"optical fibre\" data-ipa=\"/ˈɒptɪkl ˈfaɪbə(r)/\" data-vn=\"sợi quang học\">optical fibre</span> two hundred metres long. Information enters the loop as <span class=\"wv\" data-term=\"pulse\" data-ipa=\"/pʌls/\" data-vn=\"xung (ánh sáng, điện) ngắn\">pulses</span> of light, is transformed as it <span class=\"wv\" data-term=\"circulate\" data-ipa=\"/ˈsɜːkjəleɪt/\" data-vn=\"lưu thông, chạy vòng quanh\">circulates</span>, and is finally <span class=\"blank\" data-q=\"1\">(1)</span> back into an electrical signal. <span class=\"wv\" data-term=\"conventional\" data-ipa=\"/kənˈvenʃənl/\" data-vn=\"thông thường, truyền thống\">Conventional</span> AI relies on complex networks whose training <span class=\"wv\" data-term=\"demand\" data-ipa=\"/dɪˈmɑːnd/\" data-vn=\"đòi hỏi, cần tới (lượng lớn)\">demands</span> <span class=\"wv\" data-term=\"vast\" data-ipa=\"/vɑːst/\" data-vn=\"mênh mông, cực kỳ lớn\">vast</span> <span class=\"wv\" data-term=\"computing\" data-ipa=\"/kəmˈpjuːtɪŋ/\" data-vn=\"điện toán, năng lực tính toán\">computing</span> power. The Tokyo team <span class=\"wv\" data-term=\"redesign\" data-ipa=\"/ˌriːdɪˈzaɪn/\" data-vn=\"thiết kế lại\">redesigned</span> the learning process so that a simpler structure could be trained effectively - and, to their surprise, the simplified system <span class=\"blank\" data-q=\"2\">(2)</span> the performance of far more complex ones while using a <span class=\"wv\" data-term=\"fraction\" data-ipa=\"/ˈfrækʃn/\" data-vn=\"một phần nhỏ (của tổng thể)\">fraction</span> of the energy. The approach is still in its <span class=\"blank\" data-q=\"3\">(3)</span>, and no one expects light-based machines <span class=\"blank\" data-q=\"4\">(4)</span> <span class=\"wv\" data-term=\"conventional\" data-ipa=\"/kənˈvenʃənl/\" data-vn=\"thông thường, truyền thống\">conventional</span> computers <span class=\"wv\" data-term=\"overnight\" data-ipa=\"/ˌəʊvəˈnaɪt/\" data-vn=\"chỉ sau một đêm; nghĩa bóng: ngay lập tức\">overnight</span>. But as the demand for AI continues to grow, a technology that computes at the speed of light while <span class=\"blank\" data-q=\"5\">(5)</span> only a <span class=\"wv\" data-term=\"trickle\" data-ipa=\"/ˈtrɪkl/\" data-vn=\"dòng chảy rất nhỏ, lượng ít ỏi\">trickle</span> of power could hardly be more <span class=\"blank\" data-q=\"6\">(6)</span>. It is a reminder that progress in <span class=\"wv\" data-term=\"computing\" data-ipa=\"/kəmˈpjuːtɪŋ/\" data-vn=\"điện toán, năng lực tính toán\">computing</span> does not always mean building bigger machines; sometimes it means finding a smarter way to <span class=\"wv\" data-term=\"put nature to work\" data-ipa=\"/pʌt ˈneɪtʃə(r) tə wɜːk/\" data-vn=\"tận dụng sức của tự nhiên làm việc cho mình\">put nature to work</span>.", "blanks": [{"options": ["converting", "converts", "converted", "convert"], "key": 2, "explain": "Song song với 'is transformed' phía trước: 'is finally converted back into an electrical signal' - bị động hiện tại đơn."}, {"options": ["rivalled", "copied", "followed", "repeated"], "key": 0, "explain": "'Rival' = ngang ngửa, sánh được với. Hệ thống đơn giản đạt hiệu năng ngang các hệ thống phức tạp hơn nhiều - không phải 'copied/followed' (bắt chước, đi theo)."}, {"options": ["childhood", "youth", "beginning", "infancy"], "key": 3, "explain": "Thành ngữ 'in its infancy' = còn ở giai đoạn sơ khai (dùng cho công nghệ, dự án). 'In its beginning' không phải cách nói đúng."}, {"options": ["replacing", "to replace", "replace", "replaced"], "key": 1, "explain": "Cấu trúc 'expect somebody/something to do something': 'no one expects light-based machines to replace conventional computers'."}, {"options": ["drinking", "sipping", "swallowing", "tasting"], "key": 1, "explain": "'Sip' = nhấp từng ngụm nhỏ - ẩn dụ cho việc tiêu thụ rất ít điện. 'Drink/swallow' gợi lượng lớn, ngược nghĩa với 'only a trickle of power'."}, {"options": ["punctual", "early", "timely", "prompt"], "key": 2, "explain": "'Timely' = đúng thời điểm cần thiết (timely arrival/technology). 'Punctual' chỉ dùng cho người đúng giờ; 'prompt' là nhanh chóng, không mang nghĩa 'đúng lúc đang cần'."}]}];
const LS = 'advcloze20_v1';
let S = { cur: 1, ans: {}, fs: 100, hlHtml: {} };
try { const s = JSON.parse(localStorage.getItem(LS)); if (s) S = Object.assign(S, s); } catch(e) {}
function save(){ localStorage.setItem(LS, JSON.stringify(S)); }
const $ = id => document.getElementById(id);
const picker = $('picker');
DATA.forEach(s => { const o = document.createElement('option'); o.value = s.n; o.textContent = 'Sample ' + s.n + ' - ' + s.topic; picker.appendChild(o); });

function keyOf(s, q){ return s + '_' + q; }
function solvedCount(sn){ let c = 0; for (let q = 1; q <= 6; q++){ const a = S.ans[keyOf(sn, q)]; if (a && a.state === 'correct') c++; } return c; }
function totalCorrect(){ return DATA.reduce((t, s) => t + solvedCount(s.n), 0); }

function render(){
  const s = DATA[S.cur - 1];
  picker.value = S.cur;
  $('topic').textContent = s.topic;
  const pg = $('passage');
  pg.innerHTML = s.html;
  // restore blank fills
  for (let q = 1; q <= 6; q++){
    const a = S.ans[keyOf(S.cur, q)];
    const bl = pg.querySelector('.blank[data-q="' + q + '"]');
    if (a && bl){
      bl.textContent = s.blanks[q - 1].options[s.blanks[q - 1].key];
      bl.classList.add(a.state === 'correct' ? 'filled' : 'shown');
    }
  }
  if (S.hlHtml && S.hlHtml[S.cur]) pg.innerHTML = S.hlHtml[S.cur];
  // questions
  const wrap = $('questions'); wrap.innerHTML = '';
  s.blanks.forEach((b, i) => {
    const q = i + 1, a = S.ans[keyOf(S.cur, q)];
    const card = document.createElement('div'); card.className = 'qcard';
    let stTxt = '';
    if (a) stTxt = a.state === 'correct' ? '<span style="color:var(--green)">✔ Đúng</span>' : '<span style="color:var(--orange)">👁 Đã xem đáp án</span>';
    card.innerHTML = '<div class="qhead"><span>Câu ' + q + '</span><span class="st">' + stTxt + '</span></div>';
    const opts = document.createElement('div'); opts.className = 'opts';
    b.options.forEach((op, oi) => {
      const btn = document.createElement('button'); btn.className = 'opt';
      btn.textContent = 'ABCD'[oi] + '. ' + op;
      if (a){
        if (oi === b.key) btn.classList.add('right');
        if (a.wrong && a.wrong.includes(oi)) btn.classList.add('wrong');
        if (a.state) btn.disabled = (oi === b.key) || (a.wrong && a.wrong.includes(oi));
      }
      btn.onclick = () => pick(q, oi, btn);
      opts.appendChild(btn);
    });
    card.appendChild(opts);
    const fb = document.createElement('div'); fb.className = 'fb';
    if (a && a.state === 'correct'){ fb.className += ' good'; fb.textContent = 'Chính xác!'; }
    if (a && a.state === 'shown'){ fb.className += ' shown'; fb.textContent = 'Đáp án đúng được tô xanh.'; }
    card.appendChild(fb);
    const sb = document.createElement('button'); sb.className = 'showbtn'; sb.textContent = '👁 Xem đáp án';
    sb.onclick = () => showAns(q);
    if (a && a.state) sb.style.display = 'none';
    card.appendChild(sb);
    const ex = document.createElement('div'); ex.className = 'expl' + (a && a.state ? ' show' : '');
    ex.textContent = b.explain;
    card.appendChild(ex);
    wrap.appendChild(card);
  });
  $('score').textContent = 'Đúng: ' + totalCorrect() + '/120';
  renderChips();
}
function renderChips(){
  const c = $('chips'); c.innerHTML = '';
  DATA.forEach(s => {
    const n = solvedCount(s.n);
    const el = document.createElement('button');
    el.className = 'schip' + (n === 6 ? ' done' : '') + (s.n === S.cur ? ' cur' : '');
    el.textContent = s.n + ': ' + n + '/6';
    el.onclick = () => { S.cur = s.n; save(); render(); };
    c.appendChild(el);
  });
}
function pick(q, oi, btn){
  const s = DATA[S.cur - 1], b = s.blanks[q - 1], k = keyOf(S.cur, q);
  let a = S.ans[k] || { wrong: [] };
  if (a.state) return;
  if (oi === b.key){
    a.state = 'correct'; S.ans[k] = a; save(); render();
  } else {
    if (!a.wrong.includes(oi)) a.wrong.push(oi);
    S.ans[k] = a; save();
    btn.classList.add('wrong'); btn.disabled = true;
    const fb = btn.closest('.qcard').querySelector('.fb');
    fb.className = 'fb bad'; fb.textContent = 'Chưa đúng - chọn lại nhé.';
  }
}
function showAns(q){
  const k = keyOf(S.cur, q);
  let a = S.ans[k] || { wrong: [] };
  if (a.state) return;
  a.state = 'shown'; S.ans[k] = a; save(); render();
}
picker.onchange = () => { S.cur = +picker.value; save(); render(); };
$('prevBtn').onclick = () => { if (S.cur > 1){ S.cur--; save(); render(); } };
$('nextBtn').onclick = () => { if (S.cur < 20){ S.cur++; save(); render(); } };
// vocab pop-up (center)
document.addEventListener('click', e => {
  const w = e.target.closest('.wv');
  if (w){
    $('mTerm').textContent = w.dataset.term;
    $('mIpa').textContent = w.dataset.ipa;
    $('mVn').textContent = w.dataset.vn;
    $('modal').classList.add('open');
  }
});
$('modalX').onclick = () => $('modal').classList.remove('open');
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').classList.remove('open'); });
// zoom
function applyFs(){ document.documentElement.style.setProperty('--fs', (17 * S.fs / 100) + 'px'); }
$('zoomIn').onclick = () => { S.fs = Math.min(140, S.fs + 10); save(); applyFs(); };
$('zoomOut').onclick = () => { S.fs = Math.max(80, S.fs - 10); save(); applyFs(); };
applyFs();
// reset
$('resetBtn').onclick = () => { if (confirm('Xóa toàn bộ tiến độ và làm lại từ đầu?')){ localStorage.removeItem(LS); S = { cur: 1, ans: {}, fs: 100, hlHtml: {} }; applyFs(); render(); } };
// highlight (snapshot-based persistence)
let hlOn = false;
$('hlBtn').onclick = () => { hlOn = !hlOn; $('hlBtn').classList.toggle('on', hlOn); };
document.addEventListener('mouseup', () => {
  if (!hlOn) return;
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const pg = $('passage');
  if (!pg.contains(range.startContainer) || range.startContainer !== range.endContainer || range.startContainer.nodeType !== 3) return;
  if (range.startContainer.parentElement.closest('.blank')) return;
  const mark = document.createElement('mark'); mark.className = 'hl';
  try { range.surroundContents(mark); } catch(e) { return; }
  S.hlHtml = S.hlHtml || {}; S.hlHtml[S.cur] = pg.innerHTML; save(); sel.removeAllRanges();
});
document.addEventListener('click', e => {
  if (hlOn && e.target.tagName === 'MARK'){
    const pg = $('passage');
    const parent = e.target.parentNode;
    parent.replaceChild(document.createTextNode(e.target.textContent), e.target);
    parent.normalize();
    S.hlHtml = S.hlHtml || {}; S.hlHtml[S.cur] = pg.innerHTML; save();
  }
});
render();
</script>
</body>
</html>
