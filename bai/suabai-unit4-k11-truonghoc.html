 driver was intent on passing the other car.", "The treasurer is responsible for keeping the books", "**7. After some Verbs + Object Combinations**", "Ex: We **saw** the thief **entering** the house.", "Or He **spent** five hours **doing** his task.", "**8. In some other structures**:", "It’s no good / use, there is no point, what’s the point of, what about, be worth, be busy, look forward to, be used to / be accustomed to / get used to, can’t help, can’t bear, can’t stand ……", "It is no use saying that", "I am used to getting up early.", "**THE INFINITIVE (TO + VERB)**", "**1. Subject of the sentence**", "Ex: To help her is my duty.", "**2. Verbs + to - Infinitive**", "Agree, afford, appear, arrange, attempt, ask, choose, decide, demand, expect, fail, happen, hope, learn, manage, offer, plan, pretend, promise, refuse, seem, threaten, want, wish, would like, intend, tend, claim, desire, hope, hesitate …etc.", "I decide to study engineering at University", "She’s expecting to get a reply from the company.", "Do you agree to join us for the holiday?", "Mary learned to swim when she was young", "We can’t afford to build a new house.", "Bob refused to lend me his car.", "You manage to get some tickets for the pop concert on Saturday.", "**3. Verbs + O + to - infinitive**", "Want, ask, tell, request, order, beg, remind, invite, advise, warn, promise, encourage", "He **tell**s me to send this letter.", "The teacher **encouraged** Lan to join English club.", "**4. Be/ look/ seem/ feel +** **ADJECTIVE + TO infinitive**:", "Afraid, ashamed, considerate, disappointed, eager, foolish, fortunate, happy, lucky, pleased, proud, ready, sorry, surprised, angry, prepared, glad, proud", "I’m afraid to drive alone at night.", "Were you disappointed not to win the race?", "The actress seems eager to go on stage.", "The parents are proud to have a healthy child.", "Citizens ought to feel lucky to be able to vote.", "He was not at all surprised to hear the news.", "I’m looking for someone qualified to type a thesis.", "The party is ready to serve.", "I'm glad to see you again.", "**5. After the verb TO BE**", "Ex: We **are** to pass the next exam.", "My purpose is to win the next English competition.", "**6. After Noun (Infinitive of Purpose): TO / IN ORDER TO / SO AS TO + V (bare infinitive)**", "Ex: There are lots of things **to** do today.", "Ex: He studies hard **so as to** pass the entrance examination.", "**BARE - INFINITIVE**", "**1. After modal verbs: can, may, must, …**", "EX: I must go home now.", "**2. After had better, would rather, do nothing but.**", "EX: He did nothing but complain about his life.", "You’d better stay at home today.", "**3. Make / Let**", "EX: The clowns made them laugh a lot last night.", "**VERB FOLLOWED BY EITHER INFINITIVE OR GERUNDS**", "**Without changing in meaning**: **Start**, **begin**, **continue**, **intend**, **like**, **love**, **hate**, **prefer**", "It began to rain when I went to school.", "When did you start learning English?", "It began raining heavily.", "Does Pam continue writing to you?", "He intended making a film for children", "It began raining when I went to school", "When did you start to learn English?", "It began to rain heavily.", "Does Pam continue to write to you?", "He intended to make a film for children.", "**VERBS + GERUND or INFINITIVE**", "Stop doing st — He stopped smoking three years ago. (He doesn’t smoke any more now.)", "Stop to do st — He stopped to smoke a cigarette. (He stopped working in order to smoke.)", "try doing st — You should try taking these tablets, (try = thử)", "try to do st — You should try to study harder. (try = cố gắng)", "forget/ remember doing st — I remember sending a postcard to my parents yesterday. He remembers meeting you when he was in France. (He met you).", "forget/remember to do st — Don't forget to wash the dishes. Remember to sent me a letter when you arrive in Ho Chi Minh city. (you will send.)", "regret doing st — She regretted not coming your birthday party. So she felt bored", "regret to do st — I regret to inform you that you've failed your exam.", "need to do st — You need to practise English every day. (= You have to practise English every day).", "need doing st = need to be done — Your shirt needs washing. It smells. (= Your shirt needs to be washed.)", "go on doing = to continue doing st — The teacher introduced herself and went on to explain the course.", "go on to do — The teacher told everyone to be quiet, but they just went on talking.", "like doing — I like fishing", "like to do — I like to do my job well.", "**Notes:**", "**would like + to- inf; feel like + V-ing** = wish for", "**ALLOW, PERMIT, ADVISE, RECOMMEND**", "Allow = permit → V-ing; Advise = recommend → O + to-inf.", "I **permit** you to go out.", "I **permit** going out", "**See, smell, notice, observe, taste, feel, overhear, hear, watch + O + Verb: the whole process**", "**See, smell, notice, observe, taste, feel, overhear, hear, watch + O + Verb – ing: action is happening**", "I **saw** someone **get** into Tom's house yesterday.", "She **heard** him **playin**g guitar. It's really great, but she must go away."]}], "sections": [{"title": "Exercise 1: Choose the correct answer.", "items": [{"t": "mcq", "stem": "I do not have enough money _________ this book.", "options": ["buy", "to buy", "buying", "bought"], "key": 1, "expl": "Sau 'enough money' dùng to-V nguyên mẫu chỉ mục đích: tiền để mua cuốn sách này."}, {"t": "mcq", "stem": "It is no use _________ to school if you _________ to work hard.", "options": ["going / do not ready", "to go / do not ready", "going / are not ready", "go / are not ready"], "key": 2, "expl": "'It is no use doing' dùng V-ing; vế sau cần 'are not ready' vì sau 'be' phải là tính từ 'ready'."}, {"t": "mcq", "stem": "They spent all day _________ and _________ on the beach.", "options": ["to swim / sunbathing", "to swim / to sunbathe", "swimming / to sunbathe", "swimming / sunbathing"], "key": 3, "expl": "Sau 'spend all day' dùng V-ing, và hai hoạt động trên bãi biển phải song song cùng dạng V-ing."}, {"t": "mcq", "stem": "We were made _________ all the cleaning in the house.", "options": ["to do", "do", "doing", "done"], "key": 0, "expl": "Cấu trúc bị động 'be made' đi với to-V nguyên mẫu: 'were made to do all the cleaning'."}, {"t": "mcq", "stem": "We regret _________ you that you have exceeded your overdraft facility.", "options": ["to inform", "informing", "to tell to", "telling"], "key": 0, "expl": "'regret to inform' là mẫu trang trọng để thông báo một tin không vui cho người nghe."}, {"t": "mcq", "stem": "Why don’t you try _________ the key anti-clockwise?", "options": ["to turn", "on turning", "turning", "turn"], "key": 2, "expl": "'try doing' nghĩa là thử làm để xem kết quả; ở đây thử xoay chìa ngược chiều kim đồng hồ."}, {"t": "mcq", "stem": "We don’t allow _________ in the classrooms.", "options": ["that students smoke", "smoke", "students to smoke", "to smoking"], "key": 2, "expl": "Cấu trúc 'allow somebody to do' — ở đây là không cho phép học sinh hút thuốc trong lớp."}, {"t": "mcq", "stem": "I really must _________ on with my work now.", "options": ["to get", "getting", "get", "to getting"], "key": 2, "expl": "Sau động từ khuyết thiếu 'must' dùng V nguyên mẫu: 'must get on with my work'."}, {"t": "mcq", "stem": "Why don’t you do what you’re told, instead of _________ such a song and dance about it?", "options": ["to make", "making", "made", "make"], "key": 1, "expl": "Sau giới từ 'of' trong 'instead of' dùng V-ing: 'instead of making such a song and dance'."}, {"t": "mcq", "stem": "I rashly posted the parcel without _________ it.", "options": ["weighing", "weigh", "weighed", "to weigh"], "key": 0, "expl": "Sau giới từ 'without' dùng V-ing: 'without weighing it' — gửi bưu kiện mà không cân trước."}, {"t": "mcq", "stem": "Can you please _________ me a little about yourself?", "options": ["to tell", "telling", "tell", "going to tell"], "key": 2, "expl": "Sau 'Can you please' dùng V nguyên mẫu: 'please tell me a little about yourself'."}, {"t": "mcq", "stem": "How can you waste all that money on _________?", "options": ["gamble", "to gamble", "gambling", "the gamble"], "key": 2, "expl": "Sau giới từ 'on' (waste money on) dùng V-ing: 'waste money on gambling'."}, {"t": "mcq", "stem": "“My watch is broken.” “Why don’t you _________”", "options": ["have it repair", "have it repairing", "have it for repair", "have it repaired"], "key": 3, "expl": "Cấu trúc nhờ vả 'have something done': mang đồng hồ đi sửa, việc sửa do người khác làm."}, {"t": "mcq", "stem": "Yesterday we did nothing but _________", "options": ["talking", "talked", "talk", "had talked"], "key": 2, "expl": "Sau 'did nothing but' dùng V nguyên mẫu: 'did nothing but talk'."}, {"t": "mcq", "stem": "Instead of _________ a new car, she'll have her old one _________.", "options": ["to buy / repaired", "buying / to repair", "buying / be repaired", "buying / repaired"], "key": 3, "expl": "'Instead of' đi với V-ing (buying); vế sau là cấu trúc 'have her old one repaired' — nhờ sửa xe cũ."}, {"t": "mcq", "stem": "I tried _________ the bus, but I missed it.", "options": ["catching", "to catch", "catch", "catch up"], "key": 1, "expl": "'try to do' nghĩa là cố gắng làm; cô ấy cố bắt xe buýt nhưng vẫn lỡ chuyến."}, {"t": "mcq", "stem": "I'm sorry I haven't got any money _______ you. Why don't you try _________ Peter?", "options": ["to lend / to ask", "lending / asking", "to lend / asking", "lending / to ask"], "key": 2, "expl": "'money to lend' dùng to-V chỉ mục đích; 'try asking Peter' là thử hỏi Peter xem sao."}, {"t": "mcq", "stem": "After _________ asleep, I saw a strange person at the foot of the bed.", "options": ["fall", "falling", "fell", "fallen"], "key": 1, "expl": "Sau giới từ 'after' dùng V-ing: 'After falling asleep, I saw a strange person...'."}, {"t": "mcq", "stem": "After all this time, John should take the bull by the horns and ask Mary _________ him.", "options": ["to marry", "marry", "marrying", "married"], "key": 0, "expl": "Cấu trúc 'ask somebody to do something': bảo Mary cưới anh ấy — 'ask Mary to marry him'."}, {"t": "mcq", "stem": "He told me _________ early.", "options": ["to try to come", "to try coming", "try to come", "try coming"], "key": 0, "expl": "Sau 'told me' dùng to-V nguyên mẫu: 'He told me to try to come early'."}]}, {"title": "Exercise 2. Gerund or Infinitive – Fill in the correct form.", "items": [{"t": "fill", "stem": "They are likely ______ up at any time. (show)", "answer": "to show", "accept": ["to show", "To show"], "expl": "'be likely' đi với to-V nguyên mẫu: 'likely to show up at any time'."}, {"t": "fill", "stem": "The man denied ______ the crime. (commit)", "answer": "committing", "accept": ["committing", "Committing"], "expl": "Động từ 'deny' đi với V-ing: người đàn ông phủ nhận việc phạm tội."}, {"t": "fill", "stem": "Their memories of ______ in Africa will stay with them forever. (travel)", "answer": "traveling", "accept": ["traveling", "Traveling"], "expl": "Sau giới từ 'of' (memories of) dùng V-ing: ký ức về chuyến đi ở châu Phi."}, {"t": "fill", "stem": "He has always been afraid of ______. (fly)", "answer": "flying", "accept": ["flying", "Flying"], "expl": "Cụm 'be afraid of' đi với V-ing: anh ấy luôn sợ bay."}, {"t": "fill", "stem": "______ is good for your health. (swim)", "answer": "Swimming", "accept": ["Swimming", "swimming"], "expl": "V-ing làm chủ ngữ đầu câu: 'Swimming is good for your health'."}, {"t": "fill", "stem": "Would you mind ______ me the sugar. (pass)", "answer": "passing", "accept": ["passing", "Passing"], "expl": "Cụm 'Would you mind' đi với V-ing khi nhờ ai làm việc gì."}, {"t": "fill", "stem": "She promised ______ the report as soon as possible. (read)", "answer": "to read", "accept": ["to read", "To read"], "expl": "Động từ 'promise' đi với to-V nguyên mẫu: hứa đọc bản báo cáo sớm nhất có thể."}, {"t": "fill", "stem": "I had a hard time ______ the situation to my husband. (explain)", "answer": "explaining", "accept": ["explaining", "Explaining"], "expl": "Cụm 'have a hard time doing something' — gặp khó khăn khi giải thích tình huống."}, {"t": "fill", "stem": "She had some problems ______ without glasses. (read)", "answer": "reading", "accept": ["reading", "Reading"], "expl": "Sau 'have some problems' dùng V-ing: gặp khó khăn khi đọc mà không có kính."}, {"t": "fill", "stem": "Paul gave up ______ five years ago. (smoke)", "answer": "smoking", "accept": ["smoking", "Smoking"], "expl": "Cụm 'give up' đi với V-ing: Paul đã bỏ hút thuốc cách đây năm năm."}, {"t": "fill", "stem": "Most teachers insist on their pupils ______ (do) the homework.", "answer": "doing", "accept": ["doing", "Doing"], "expl": "Cấu trúc 'insist on somebody doing something' — thầy cô nài nỉ học sinh làm bài tập."}, {"t": "fill", "stem": "She has often made me ______ (cry).", "answer": "cry", "accept": ["cry", "Cry"], "expl": "Cấu trúc 'make somebody' đi với V nguyên mẫu: 'She has often made me cry'."}, {"t": "fill", "stem": "I expect ______ (hear) from you by Monday.", "answer": "to hear", "accept": ["to hear", "To hear"], "expl": "Động từ 'expect' đi với to-V nguyên mẫu: mong nhận tin từ bạn trước thứ Hai."}, {"t": "fill", "stem": "It's no use ______ (pretend) ______ (like) her food.", "answer": "pretending / to like", "accept": ["pretending / to like", "Pretending / to like", "pretending/to like"], "expl": "'It's no use' đi với V-ing (pretending); 'pretend' lại đi với to-V nguyên mẫu (to like)."}, {"t": "fill", "stem": "How old were you when you learnt ______ (drive)?", "answer": "to drive", "accept": ["to drive", "To drive"], "expl": "Động từ 'learn' đi với to-V nguyên mẫu khi nói về học một kỹ năng: learn to drive."}, {"t": "fill", "stem": "I don't mind ______ (walk) home but I'd rather ______ (get) a taxi.", "answer": "walking / get", "accept": ["walking / get", "Walking / get", "walking/get"], "expl": "'don't mind' đi với V-ing (walking); 'would rather' đi với V nguyên mẫu (get a taxi)."}, {"t": "fill", "stem": "I can't make a decision. I keep ______ (change) my mind.", "answer": "changing", "accept": ["changing", "Changing"], "expl": "Động từ 'keep' đi với V-ing để chỉ hành động lặp đi lặp lại: keep changing my mind."}, {"t": "fill", "stem": "We had to keep him from ______ (fall) off the cliff.", "answer": "falling", "accept": ["falling", "Falling"], "expl": "Cụm 'keep somebody from doing something' — giữ không cho anh ấy ngã khỏi vách đá."}, {"t": "fill", "stem": "He had made his decision and refused ______ (change) his mind.", "answer": "to change", "accept": ["to change", "To change"], "expl": "Động từ 'refuse' đi với to-V nguyên mẫu: từ chối thay đổi quyết định."}, {"t": "fill", "stem": "It was a good holiday. I enjoyed ______ (be) by the sea.", "answer": "being", "accept": ["being", "Being"], "expl": "Động từ 'enjoy' đi với V-ing: thích thú khi ở bên bờ biển."}, {"t": "fill", "stem": "Do you feel like (go) ______ to the theatre on Friday?", "answer": "going", "accept": ["going", "Going"], "expl": "Cụm 'feel like' đi với V-ing khi nói muốn làm gì đó: feel like going to the theatre."}, {"t": "fill", "stem": "I spent a lot of time (make) ______ a birthday cake for him.", "answer": "making", "accept": ["making", "Making"], "expl": "Cấu trúc 'spend time doing something' — dành nhiều thời gian làm bánh sinh nhật."}, {"t": "fill", "stem": "He agreed (see) ______ me at ten o'clock", "answer": "to see", "accept": ["to see", "To see"], "expl": "Động từ 'agree' đi với to-V nguyên mẫu: đồng ý gặp tôi lúc mười giờ."}, {"t": "fill", "stem": "They promised (read) ______ my report today", "answer": "to read", "accept": ["to read", "To read"], "expl": "Động từ 'promise' đi với to-V nguyên mẫu: hứa hôm nay sẽ đọc báo cáo của tôi."}, {"t": "fill", "stem": "I suggest (pay) ______ by check, it's safer than cash", "answer": "paying", "accept": ["paying", "Paying"], "expl": "Động từ 'suggest' đi với V-ing: gợi ý trả bằng séc cho an toàn."}, {"t": "fill", "stem": "He offered (make) ______ dinner for us.", "answer": "to make", "accept": ["to make", "To make"], "expl": "Động từ 'offer' đi với to-V nguyên mẫu: đề nghị nấu bữa tối cho chúng tôi."}, {"t": "fill", "stem": "He put off (see) ______ her until very late in the afternoon.", "answer": "seeing", "accept": ["seeing", "Seeing"], "expl": "Cụm 'put off' (trì hoãn) đi với V-ing: hoãn việc gặp cô ấy đến cuối buổi chiều."}, {"t": "fill", "stem": "I refused (pay) ______ for the repairs.", "answer": "to pay", "accept": ["to pay", "To pay"], "expl": "Động từ 'refuse' đi với to-V nguyên mẫu: từ chối trả tiền sửa chữa."}, {"t": "fill", "stem": "I've finished (read) ______ that book at last!", "answer": "reading", "accept": ["reading", "Reading"], "expl": "Động từ 'finish' đi với V-ing: cuối cùng cũng đọc xong cuốn sách."}, {"t": "fill", "stem": "We decided (go) ______ to the cinema instead", "answer": "to go", "accept": ["to go", "To go"], "expl": "Động từ 'decide' đi với to-V nguyên mẫu: quyết định đi xem phim thay vào đó."}, {"t": "fill", "stem": "I enjoyed the play. The (act) ______ was very good.", "answer": "acting", "accept": ["acting", "Acting"], "expl": "Sau mạo từ 'the' cần một danh từ; 'acting' là danh động từ chỉ diễn xuất của vở kịch."}, {"t": "fill", "stem": "I love going to her class, her (teach) ______ is never boring.", "answer": "teaching", "accept": ["teaching", "Teaching"], "expl": "Sau tính từ sở hữu 'her' cần danh từ; 'teaching' chỉ việc giảng dạy của cô ấy."}, {"t": "fill", "stem": "He's my favourite writer, his (write) ______ is wonderful.", "answer": "writing", "accept": ["writing", "Writing"], "expl": "Sau tính từ sở hữu 'his' cần danh từ; 'writing' chỉ lối viết, văn phong của nhà văn."}, {"t": "fill", "stem": "His (complain) ______ is getting on my nerves. He's never happy.", "answer": "complaining", "accept": ["complaining", "Complaining"], "expl": "Sau tính từ sở hữu 'His' cần danh từ; 'complaining' chỉ việc phàn nàn không ngớt."}, {"t": "fill", "stem": "They have terrible debts. Their (spend) ______ is out of control", "answer": "spending", "accept": ["spending", "Spending"], "expl": "Sau tính từ sở hữu 'Their' cần danh từ; 'spending' chỉ việc chi tiêu mất kiểm soát."}, {"t": "fill", "stem": "It's a very fit team. Their (train) ______ is very intensive.", "answer": "training", "accept": ["training", "Training"], "expl": "Sau tính từ sở hữu 'Their' cần danh từ; 'training' chỉ việc tập luyện của đội."}, {"t": "fill", "stem": "I can still remember (visit) ______ my grandparents fifty years ago.", "answer": "visiting", "accept": ["visiting", "Visiting"], "expl": "'remember doing something' là nhớ một việc đã làm trong quá khứ: thăm ông bà năm mươi năm trước."}, {"t": "fill", "stem": "Please, remember (feed) ______ the dog while I'm away", "answer": "to feed", "accept": ["to feed", "To feed"], "expl": "'remember to do something' là nhớ phải làm một việc sắp tới: nhớ cho chó ăn khi tôi đi vắng."}, {"t": "fill", "stem": "I'll never forget (see) ______ that van Gogh exhibition in New York", "answer": "seeing", "accept": ["seeing", "Seeing"], "expl": "'forget doing something' là quên hẳn một trải nghiệm đã qua: buổi triển lãm Van Gogh."}, {"t": "fill", "stem": "Don't forget (post) ______ my letters, please.", "answer": "to post", "accept": ["to post", "To post"], "expl": "'forget to do something' là quên làm một việc cần làm: đừng quên gửi thư giúp tôi."}, {"t": "fill", "stem": "I regret (lend) ______ him the money. He never paid it back.", "answer": "lending", "accept": ["lending", "Lending"], "expl": "'regret doing something' là hối tiếc về việc đã làm: cho anh ta vay tiền rồi không được trả."}, {"t": "fill", "stem": "We regret (inform) ______ you that your application has been refused.", "answer": "to inform", "accept": ["to inform", "To inform"], "expl": "'regret to inform' là mẫu thông báo tin không vui: rất tiếc, đơn của bạn đã bị từ chối."}, {"t": "fill", "stem": "I'll just finish (clean) ______ the kitchen then I'll stop.", "answer": "cleaning", "accept": ["cleaning", "Cleaning"], "expl": "Động từ 'finish' đi với V-ing: dọn xong bếp rồi mới nghỉ."}, {"t": "fill", "stem": "She suggested (have) ______ dinner at her house.", "answer": "having", "accept": ["having", "Having"], "expl": "Động từ 'suggest' đi với V-ing: cô ấy gợi ý ăn tối tại nhà mình."}, {"t": "fill", "stem": "She doesn't mind (do) ______ the boring jobs.", "answer": "doing", "accept": ["doing", "Doing"], "expl": "Động từ 'mind' đi với V-ing trong 'doesn't mind doing the boring jobs'."}, {"t": "fill", "stem": "He keeps (ask) ______ me to go out with him.", "answer": "asking", "accept": ["asking", "Asking"], "expl": "Động từ 'keep' đi với V-ing chỉ hành động lặp lại: anh ấy cứ rủ tôi đi chơi mãi."}, {"t": "fill", "stem": "He has given up (smoke) ______.", "answer": "smoking", "accept": ["smoking", "Smoking"], "expl": "Cụm 'give up' đi với V-ing: anh ấy đã bỏ hút thuốc."}, {"t": "fill", "stem": "He's very good at (get) ______ me to do what he wants", "answer": "getting", "accept": ["getting", "Getting"], "expl": "Sau cụm 'good at' dùng V-ing: giỏi trong việc khiến tôi làm theo ý mình."}, {"t": "fill", "stem": "He insisted on (be) ______ refunded immediately.", "answer": "being", "accept": ["being", "Being"], "expl": "'insist on' đi với V-ing; nghĩa bị động nên dùng 'being refunded' — đòi được hoàn tiền ngay."}, {"t": "fill", "stem": "He failed. He's very bad at (do) ______ exams.", "answer": "doing", "accept": ["doing", "Doing"], "expl": "Sau cụm 'bad at' dùng V-ing: anh ấy làm bài thi rất kém."}]}, {"title": "Exercise 3: Choose the underlined part among A, B, C or D that needs correcting.", "items": [{"t": "mcq", "stem": "I’m sure he is incapable of run a mile in four minutes.", "options": ["I’m sure he is", "incapable of", "run", "a mile in four minutes."], "key": 2, "expl": "Sau cụm 'incapable of' phải dùng V-ing; 'run' ở dạng nguyên mẫu là sai, phải là 'running'."}, {"t": "mcq", "stem": "Good friendship should be based on mutual understand.", "options": ["Good friendship should", "be based", "on mutual", "understand."], "key": 3, "expl": "Sau tính từ 'mutual' cần danh từ 'understanding' (sự thấu hiểu); 'understand' là động từ nên sai."}, {"t": "mcq", "stem": "I dislike being talk about everywhere.", "options": ["I dislike", "being talk", "about", "everywhere."], "key": 1, "expl": "Chủ ngữ chịu tác động nên cần bị động: 'being talked about' (bị bàn tán); ở đây thiếu 'talked'."}, {"t": "mcq", "stem": "We’re looking forward to see you again.", "options": ["We’re", "looking forward", "to see", "you again."], "key": 2, "expl": "Trong 'look forward to', 'to' là giới từ nên động từ theo sau phải ở dạng V-ing: 'seeing'."}, {"t": "mcq", "stem": "They voluntarily spent their vacations to teach illiterate people to read and write.", "options": ["They voluntarily spent their vacations", "to teach", "illiterate people", "to read and write."], "key": 1, "expl": "Cấu trúc 'spend time doing something'; 'to teach' sai dạng, phải là 'teaching'."}]}, {"title": "PHONETICS — Pronunciation", "intro": "Mark the letter A, B, C, or D to indicate the word whose underlined part differs from the other three in pronunciation in each of the following questions.", "items": [{"t": "mcq", "stem": "", "options": ["stable", "maintain", "scholarship", "dominate"], "key": 2, "expl": "Âm 'a' trong 'scholarship' đọc là /ɒ/, trong khi các từ còn lại đều đọc là /eɪ/."}, {"t": "mcq", "stem": "", "options": ["hold", "offer", "bloc", "solidarity"], "key": 0, "expl": "Âm 'o' trong 'hold' đọc là /əʊ/, các từ còn lại đều đọc là /ɒ/."}, {"t": "mcq", "stem": "", "options": ["participates", "athletes", "dominates", "activities"], "key": 3, "expl": "Âm cuối '-s' trong 'activities' đọc là /z/, các từ còn lại đều đọc là /s/."}, {"t": "mcq", "stem": "", "options": ["avoided", "recommended", "permitted", "practiced"], "key": 3, "expl": "Đuôi '-ed' trong 'practiced' đọc là /t/, các từ còn lại đều đọc là /ɪd/."}, {"t": "mcq", "stem": "", "options": ["promote", "confusion", "focus", "association"], "key": 1, "expl": "Âm 'o' trong 'confusion' đọc là /uː/, các từ còn lại đều đọc là /əʊ/."}, {"t": "mcq", "stem": "", "options": ["athlete", "capital", "stalk", "talent"], "key": 2, "expl": "Âm 'a' trong 'stalk' đọc là /ɔː/, các từ còn lại đều đọc là /æ/."}, {"t": "mcq", "stem": "", "options": ["emblem", "member", "regret", "theme"], "key": 3, "expl": "Âm 'e' trong 'theme' đọc là /iː/, các từ còn lại đều đọc là /e/."}, {"t": "mcq", "stem": "", "options": ["August", "gerund", "purpose", "suggest"], "key": 2, "expl": "Âm 'u' trong 'purpose' đọc là /ɜː/, khác hẳn âm ngắn trong các từ còn lại."}, {"t": "mcq", "stem": "", "options": ["dream", "mean", "peace", "steady"], "key": 3, "expl": "Âm 'ea' trong 'steady' đọc là /e/, các từ còn lại đều đọc là /iː/."}, {"t": "mcq", "stem": "", "options": ["consist", "disable", "suggest", "vision"], "key": 3, "expl": "Âm 's' trong 'vision' đọc là /ʒ/, các từ còn lại đều đọc là /s/."}]}, {"title": "PHONETICS — Stress", "intro": "Mark the letter A, B, C, or D to indicate the word that differs from the other three in the position of primary stress in each of the following questions.", "items": [{"t": "mcq", "stem": "", "options": ["maintain", "charter", "finish", "practice"], "key": 0, "expl": "'maintain' nhấn trọng âm ở âm tiết thứ hai, các từ còn lại đều nhấn ở âm tiết thứ nhất."}, {"t": "mcq", "stem": "", "options": ["solidarity", "cooperation", "representative", "nationality"], "key": 1, "expl": "'cooperation' nhấn trọng âm ở âm tiết thứ tư, các từ còn lại đều nhấn ở âm tiết thứ ba."}, {"t": "mcq", "stem": "", "options": ["celebrate", "integrate", "qualify", "consider"], "key": 3, "expl": "'consider' nhấn trọng âm ở âm tiết thứ hai, các từ còn lại đều nhấn ở âm tiết thứ nhất."}, {"t": "mcq", "stem": "", "options": ["promote", "enjoy", "involve", "realize"], "key": 3, "expl": "'realize' nhấn trọng âm ở âm tiết thứ nhất, các từ còn lại đều nhấn ở âm tiết thứ hai."}, {"t": "mcq", "stem": "", "options": ["remember", "understand", "imagine", "encourage"], "key": 1, "expl": "'understand' nhấn trọng âm ở âm tiết thứ ba, các từ còn lại đều nhấn ở âm tiết thứ hai."}, {"t": "mcq", "stem": "", "options": ["assistance", "confidence", "relation", "proposal"], "key": 1, "expl": "'confidence' nhấn trọng âm ở âm tiết thứ nhất, các từ còn lại đều nhấn ở âm tiết thứ hai."}, {"t": "mcq", "stem": "", "options": ["celebration", "behaviour", "stability", "relationship"], "key": 0, "expl": "'celebration' nhấn trọng âm ở âm tiết thứ ba, các từ còn lại đều nhấn ở âm tiết thứ hai."}, {"t": "mcq", "stem": "", "options": ["support", "depict", "promote", "purchase"], "key": 3, "expl": "'purchase' nhấn trọng âm ở âm tiết thứ nhất, các từ còn lại đều nhấn ở âm tiết thứ hai."}, {"t": "mcq", "stem": "", "options": ["leadership", "maintainance", "principle", "agreement"], "key": 3, "expl": "'agreement' nhấn trọng âm ở âm tiết thứ hai, các từ còn lại đều nhấn ở âm tiết thứ nhất."}, {"t": "mcq", "stem": "", "options": ["competition", "contribution", "interference", "stability"], "key": 3, "expl": "'stability' nhấn trọng âm ở âm tiết thứ hai, các từ còn lại đều nhấn ở âm tiết thứ ba."}]}, {"title": "VOCABULARY — Closest in meaning", "intro": "Mark the letter A, B, C, or D to indicate the word(s) CLOSEST in meaning to the underlined word(s) in each of the following questions.", "items": [{"t": "mcq", "stem": "Now can I please get on with the job, without any more interference from you?", "options": ["approval", "intervention", "limitation", "postponement"], "key": 1, "expl": "'interference' nghĩa là sự can thiệp, xen vào việc người khác; 'intervention' là từ đồng nghĩa sát nhất."}, {"t": "mcq", "stem": "The emblem of the Association of Southeast Asian Nations was designed basing on rice - the most important crop for the Southeast Asian people.", "options": ["banner", "logo", "motto", "slogan"], "key": 1, "expl": "'emblem' nghĩa là biểu tượng, huy hiệu của một tổ chức; 'logo' là từ gần nghĩa nhất."}, {"t": "mcq", "stem": "Your starting salary is £23,000 per annum and will be reviewed annually.", "options": ["every day", "every month", "every week", "every year"], "key": 3, "expl": "'per annum' là cụm Latin nghĩa là mỗi năm, tương đương với 'every year'."}, {"t": "mcq", "stem": "In Thailand, it's against the law to litter on the pavement. If you are caught, you can be fined up to $2000 Baht.", "options": ["evil", "illegal", "immoral", "cruel"], "key": 1, "expl": "'against the law' nghĩa là trái pháp luật, phạm luật; 'illegal' (bất hợp pháp) đồng nghĩa."}, {"t": "mcq", "stem": "The beautiful sights in Sa Pa, Mui Ne and Ha Noi all contribute to the country's magic charm.", "options": ["beauty", "fame", "imatation", "value"], "key": 0, "expl": "'charm' nghĩa là sức hút, vẻ quyến rũ; 'beauty' (vẻ đẹp) là từ gần nghĩa nhất."}, {"t": "mcq", "stem": "ASEAN organised different projects and activities to integrate its members.", "options": ["combine", "socialize", "separate", "upgrade"], "key": 0, "expl": "'integrate' nghĩa là hợp nhất, kết hợp các thành viên thành một khối; 'combine' đồng nghĩa."}, {"t": "mcq", "stem": "The major shortcoming of ASEAN as an organisation is the inability to go through many declarations, agreements, and instruments that they have proliferated over the years.", "options": ["advantage", "benefit", "drawback", "achievement"], "key": 2, "expl": "'shortcoming' nghĩa là thiếu sót, nhược điểm; 'drawback' là từ đồng nghĩa."}, {"t": "mcq", "stem": "We have achieved considerable results in the economic field, such as high economic growth, stability and significant poverty alleviation over the past few years.", "options": ["protection", "development", "prevention", "reduction"], "key": 3, "expl": "'alleviation' nghĩa là sự giảm bớt, xoa dịu (ở đây là giảm nghèo); 'reduction' gần nghĩa nhất."}, {"t": "mcq", "stem": "After the collapse of the Soviet Union in 1989, the 13th National Congress of the Communist Party of Viet Nam adopted a resolution to have ‘more friends and fewer enemies'.", "options": ["breakdown", "adopt", "perform", "alleviate"], "key": 0, "expl": "'collapse' nghĩa là sự sụp đổ hoàn toàn; 'breakdown' là từ đồng nghĩa trong ngữ cảnh này."}, {"t": "mcq", "stem": "He had dominated racing this year with six victories in seven starts.", "options": ["overcrowded", "overreacted", "overwhelmed", "overshadowed"], "key": 3, "expl": "'dominated' nghĩa là áp đảo, vượt trội hơn hẳn đối thủ; 'overshadowed' (lấn át) gần nghĩa nhất."}, {"t": "mcq", "stem": "It's often hard to find the right time to approach someone about a delicate issue, as well as being difficult to say the words you need to say.", "options": ["sensitive", "significant", "unconscious", "supportive"], "key": 0, "expl": "'delicate issue' là vấn đề tế nhị, nhạy cảm; 'sensitive' là từ đồng nghĩa."}, {"t": "mcq", "stem": "The Association of Southeast Asian Nations, or ASEAN, was established on 8 August 1967 in Bangkok, Thailand, with Indonesia, Malaysia, Philippines, Singapore and Thailand, joining hands initially.", "options": ["basically", "firstly", "finally", "eventually"], "key": 1, "expl": "'initially' nghĩa là lúc ban đầu, lúc mới thành lập; 'firstly' là từ gần nghĩa nhất."}, {"t": "mcq", "stem": "Thailand has dominated in most of the recent ASEAN GAMES in the region, winning the biggest numbers of gold medals.", "options": ["has been the most successful", "has been the least successful", "has been the most dedicated", "has been the least dynamic"], "key": 0, "expl": "dominate = bá chủ, thống trị; most successful = thành công nhất."}, {"t": "mcq", "stem": "In making policy city, officials depend on over fifty citizen advisory boards and commissions for citizen input.", "options": ["depend on", "rely on", "impact on", "thank for"], "key": 1, "expl": "rely on = depend on = dựa vào cái gì."}, {"t": "mcq", "stem": "Most Vietnamese students know what the red colour on their national flag stands for.", "options": ["targets", "symbolizes", "purposes", "performs"], "key": 1, "expl": "stand for = symbolize = mang tính biểu tượng, biểu trưng."}, {"t": "mcq", "stem": "Mainstream economists argue that the purpose of the policy is to promote economic efficiency.", "options": ["eventuate", "stabilize", "boost", "activiate"], "key": 2, "expl": "promote = boost = làm cho cái gì tăng lên, tốt lên."}, {"t": "mcq", "stem": "Negotiation is among a few effective ways to resolve any dispute.", "options": ["respect", "advantage", "improvement", "disagreement"], "key": 3, "expl": "dispute = disagreement = sự bất đồng quan điểm."}, {"t": "mcq", "stem": "In order to avoid sunburn, many people wear protecting clothes when they go out.", "options": ["continue", "discourage", "facilitate", "block"], "key": 3, "expl": "'avoid' ở đây nghĩa là tránh, ngăn không cho nắng gây hại; 'block' (chặn lại) gần nghĩa nhất."}, {"t": "mcq", "stem": "Tet in Vietnam marks the beginning of spring and, for agrarian people who depend on the lunar calendar to manage their crops, the start of the year.", "options": ["traditional ones", "minority people", "farmers", "old people"], "key": 2, "expl": "'agrarian people' là những người sống bằng nghề nông; tương đương với 'farmers'."}, {"t": "mcq", "stem": "The Vietnamese government has passed laws to protect wildlife from coomercial trade.", "options": ["enforced", "enabled", "ensured", "enacted"], "key": 3, "expl": "'pass laws' nghĩa là thông qua, ban hành luật; 'enacted' là từ đồng nghĩa trang trọng."}]}, {"title": "VOCABULARY — Opposite in meaning", "intro": "Mark the letter A, B, C, or D to indicate the word(s) OPPOSITE in meaning to the underlined word(s) in each of the following questions.", "items": [{"t": "mcq", "stem": "Our survey also found that 75 per cent of those quizzed knew three or more of their neighbours.", "options": ["interviewed", "insisted", "replied", "examined"], "key": 2, "expl": "'quizzed' nghĩa là bị hỏi, bị tra vấn; hành động ngược lại là 'replied' — trả lời, đáp lại."}, {"t": "mcq", "stem": "Viet Nam and Laos will closely cooperate to strengthen the solidarity of ASEAN and enhance the vital role of the group in regional security structure.", "options": ["agreement", "cooperation", "separation", "friendship"], "key": 2, "expl": "'solidarity' nghĩa là sự đoàn kết; trái nghĩa là 'separation' — sự chia rẽ, tách ra."}, {"t": "mcq", "stem": "Her graceful performance of this traditional art form in the evening session was a real source of pleasure.", "options": ["stunning", "effortless", "inelegant", "complex"], "key": 2, "expl": "'graceful' nghĩa là duyên dáng, uyển chuyển; trái nghĩa là 'inelegant' — thiếu duyên dáng."}, {"t": "mcq", "stem": "Viet Nam is famous for World Heritage Sites like Ha Long Bay and Hoi An Ancient Town.", "options": ["availuable", "popular", "well-known", "unknown"], "key": 3, "expl": "'famous' nghĩa là nổi tiếng; trái nghĩa là 'unknown' — không ai biết đến."}, {"t": "mcq", "stem": "The country's continued prosperity is dependent on the opportunities and achievements of all its residents.", "options": ["poverty", "inflation", "insecurity", "wealth"], "key": 0, "expl": "'prosperity' nghĩa là sự thịnh vượng; trái nghĩa là 'poverty' — sự nghèo đói."}, {"t": "mcq", "stem": "The colour white symbolises a lot of things, and one is that it represents purity and innocence.", "options": ["cleanness", "immorality", "honesty", "guiltlessness"], "key": 1, "expl": "'purity' nghĩa là sự trong sạch, tinh khiết; trái nghĩa là 'immorality' — sự đồi bại."}, {"t": "mcq", "stem": "All countries are obliged to maintain stability and peace in the world, because instability brings undesired effects.", "options": ["uncertain", "predictable", "negative", "positive"], "key": 3, "expl": "'undesired' nghĩa là không mong muốn, tiêu cực; trái nghĩa là 'positive' — tích cực."}, {"t": "mcq", "stem": "Many people afraid that the victory of US president-elect Donald Trump might affect stability in Asia, more specifically in the ASEAN region.", "options": ["failure", "insecurity", "strength", "weakness"], "key": 1, "expl": "'stability' nghĩa là sự ổn định; trái nghĩa là 'insecurity' — sự bất ổn, thiếu an toàn."}, {"t": "mcq", "stem": "The 28th and 29th ASEAN Summits opened in Vientiane, Laos, late on Tuesday on the theme of “Turning Vision into Reality for a Dynamic ASEAN Community\".", "options": ["energetic", "inactive", "innovative", "productive"], "key": 1, "expl": "'dynamic' nghĩa là năng động, sôi nổi; trái nghĩa là 'inactive' — thụ động, trì trệ."}, {"t": "mcq", "stem": "Amanita argued that Indonesia would continue to play a role in maintaining peace and promoting democratisation in ASEAN.", "options": ["upholding", "lessening", "preserving", "upholding"], "key": 1, "expl": "'maintaining' nghĩa là duy trì, giữ ở mức cũ; ngược lại là 'lessening' — làm giảm bớt."}, {"t": "mcq", "stem": "Southeast Asian regionalism served to enable the member-states to focus primarily on their domestic affairs.", "options": ["international", "internal", "local", "national"], "key": 0, "expl": "'domestic' nghĩa là trong nước, nội địa; trái nghĩa là 'international' — quốc tế."}, {"t": "mcq", "stem": "The Prince William made a brief working visit to Viet Nam from 17th - 18th November 2016, attending the IWT Conference which was hosted in Ha Noi.", "options": ["lasting", "public", "minuscule", "secret"], "key": 0, "expl": "'brief' nghĩa là ngắn, vắn tắt; trái nghĩa là 'lasting' — kéo dài, lâu dài."}, {"t": "mcq", "stem": "After hundreds of rejections by the employers, I decided that I need to do something about my obesity.", "options": ["denial", "approval", "refusal", "rebuttal"], "key": 1, "expl": "'rejections' là những lời từ chối; trái nghĩa là 'approval' — sự chấp thuận."}, {"t": "mcq", "stem": "In Viet Nam, Adverse weather conditions in the summer made it difficult to play the game.", "options": ["favorable", "imperishable", "congenial", "severe"], "key": 0, "expl": "'adverse' nghĩa là bất lợi, xấu; trái nghĩa là 'favorable' — thuận lợi."}, {"t": "mcq", "stem": "I have just received my first job offer after having been unemployed for two years in Vietnam.", "options": ["got", "gained", "rejected", "acquired"], "key": 2, "expl": "'received' nghĩa là nhận được; hành động ngược lại trong ngữ cảnh này là 'rejected' — từ chối, không nhận."}, {"t": "mcq", "stem": "People in Singapore are launching a campaign to promote awareness of environmental issues.", "options": ["encourage", "publicize", "hinder", "strengthen"], "key": 2, "expl": "'promote' nghĩa là thúc đẩy, khuyến khích; trái nghĩa là 'hinder' — cản trở."}, {"t": "mcq", "stem": "This speedy and secure service of transferring money within Asean countries can be useful.", "options": ["slow", "rapid", "careful", "hurried"], "key": 0, "expl": "'speedy' nghĩa là nhanh chóng; trái nghĩa là 'slow' — chậm chạp."}, {"t": "mcq", "stem": "The Indonesian government is being widely criticized in the media for falling to limit air pollution.", "options": ["attracted", "praised", "blamed", "approved"], "key": 1, "expl": "'criticized' nghĩa là bị chỉ trích; trái nghĩa là 'praised' — được khen ngợi."}, {"t": "mcq", "stem": "After the marriage, Ruth decided to settle permanently In Jakarta, Indonesia.", "options": ["sustainably", "constantly", "temporarily", "regularly"], "key": 2, "expl": "'permanently' nghĩa là vĩnh viễn, lâu dài; trái nghĩa là 'temporarily' — tạm thời."}, {"t": "mcq", "stem": "He had never experienced such discourtesy towards the president as it occurred at the annual meeting in May in Malaysia.", "options": ["rudeness", "measurement", "encouragement", "politeness"], "key": 3, "expl": "'discourtesy' nghĩa là sự bất lịch sự, thô lỗ; trái nghĩa là 'politeness' — sự lịch sự."}]}, {"title": "VOCABULARY — Choose the correct answer", "intro": "Mark the letter A, B, C, or D to indicate the correct answer to each of the following questions.", "items": [{"t": "mcq", "stem": "ASEAN includes ten member states, but may get bigger because other countries have applied to join the ________.", "options": ["bloc", "group", "gang", "troop"], "key": 0, "expl": "'bloc' nghĩa là khối liên minh gồm nhiều nước; ASEAN là một khối như vậy."}, {"t": "mcq", "stem": "The ________ is a legal agreement among the ten ASEAN member states.", "options": ["charter", "motto", "policy", "principle"], "key": 0, "expl": "'charter' nghĩa là hiến chương — văn bản thỏa thuận có tính pháp lý của ASEAN."}, {"t": "mcq", "stem": "The Japanese Government ________ 20 scholarships for international students coming from ASEAN member countries to study in Japan.", "options": ["affords", "demands", "offers", "provides"], "key": 2, "expl": "Cụm 'offer scholarships' nghĩa là trao, cấp học bổng cho sinh viên quốc tế."}, {"t": "mcq", "stem": "The 28th and 29th ASEAN Summits will be ________ at the National Convention Centre under the Chairmanship of Lao PDR.", "options": ["carried", "conducted", "held", "taken place"], "key": 2, "expl": "Hội nghị được tổ chức dùng bị động 'will be held'; 'held' là dạng đúng của động từ 'hold'."}, {"t": "mcq", "stem": "The ASEAN charter entered into ________ after ten members signed it.", "options": ["performance", "force", "influence", "impact"], "key": 1, "expl": "Cụm cố định 'enter into force' nghĩa là bắt đầu có hiệu lực, dùng cho hiệp định, hiến chương."}, {"t": "mcq", "stem": "Each deputy should be ________ for one ASEAN community council, supported by a team of competent and able lawyers.", "options": ["blamed", "incapable", "in charge", "responsible"], "key": 3, "expl": "Cụm 'be responsible for' nghĩa là chịu trách nhiệm về một mảng công việc."}, {"t": "mcq", "stem": "Vietnamese athletes compete regionally and internationally and ________ high ranks in many sports.", "options": ["hold", "keep", "mark", "achieve"], "key": 0, "expl": "Cụm 'hold high ranks' nghĩa là giữ, đạt thứ hạng cao trong các môn thể thao."}, {"t": "mcq", "stem": "Not all the winners will receive great prizes, but nobody leaves ________", "options": ["blank-handed", "clear-handed", "empty-handed", "white-handed"], "key": 2, "expl": "Thành ngữ 'empty-handed' nghĩa là ra về tay trắng, không nhận được gì."}, {"t": "mcq", "stem": "With a population of over 237 million people, Indonesia is the world's fourth most ________ country.", "options": ["popular", "popularly", "populous", "unpopular"], "key": 2, "expl": "Nói về một nước đông dân dùng tính từ 'populous'; 'popular' chỉ sự được ưa chuộng."}, {"t": "mcq", "stem": "Do you ________that Vietnam national football team will be the strongest one in the Asean region in the future?", "options": ["believe", "involve", "promise", "offer"], "key": 0, "expl": "Cấu trúc 'believe that...' nghĩa là tin rằng; các động từ còn lại không hợp nghĩa câu."}, {"t": "mcq", "stem": "I think the teacher was ________ with my speech.", "options": ["appreciated", "involved", "measured", "satisfied"], "key": 3, "expl": "Cụm 'be satisfied with' nghĩa là hài lòng với điều gì: giáo viên hài lòng với bài nói."}, {"t": "mcq", "stem": "Over the past decade, Viet Nam-ASEAN ________ have been growing fast in all areas, particularly in politics and the economy.", "options": ["relates", "relatives", "relations", "relationships"], "key": 2, "expl": "'relations' là quan hệ chính thức giữa các quốc gia, tổ chức; hợp với 'Viet Nam-ASEAN'."}, {"t": "mcq", "stem": "Lao PDR stands ________ Lao People's Democratic Republic.", "options": ["by", "for", "on", "with"], "key": 1, "expl": "Cụm 'stand for' nghĩa là viết tắt của, là tên gọi đầy đủ của một tổ chức."}, {"t": "mcq", "stem": "ASEAN ________ of ten Southeast Asian countries, namely: Brunei. Cambodia, Indonesia, Laos, Malaysia, Myanmar, Philippines, Singapore, Thailand, and Viet Nam.", "options": ["consists", "contains", "includes", "involves"], "key": 0, "expl": "Cụm 'consist of' nghĩa là bao gồm, gồm có — ở đây là mười nước Đông Nam Á."}, {"t": "mcq", "stem": "The member states will act in accordance ________ the law to set out in various ASEAN instruments.", "options": ["for", "of", "to", "with"], "key": 3, "expl": "Cụm cố định 'in accordance with' nghĩa là theo đúng, phù hợp với quy định của luật."}, {"t": "mcq", "stem": "The 28th and 29th ASEAN Summits will focus ________ efforts to build the ASEAN Community.", "options": ["at", "for", "in", "on"], "key": 3, "expl": "Cụm 'focus on' nghĩa là tập trung vào; hội nghị tập trung vào nỗ lực xây dựng Cộng đồng ASEAN."}, {"t": "mcq", "stem": "As an ASEAN member, Vietnam has actively participated in the group's programs and has also created new ________ and cooperation mechanisms.", "options": ["initiatives", "initiates", "initiations", "initiators"], "key": 0, "expl": "initiative = một chiến dịch, một kế hoạch."}, {"t": "mcq", "stem": "The population of ASEAN is more than 600 million people, ________ about 8% of the world's population.", "options": ["counting on", "setting for", "accounting for", "making of"], "key": 2, "expl": "account for = chiếm bao nhiêu %."}, {"t": "mcq", "stem": "The ASEAN gross domestic product grew ________ 4.6% to reach US$ 2.57 trillion in 2015.", "options": ["on", "by", "in", "with"], "key": 1, "expl": "grow by ...% = tăng trưởng được bao nhiêu %."}, {"t": "mcq", "stem": "The government hopes their program will help new immigrants ________ well in the community.", "options": ["enter", "immerse", "exchange", "integrate"], "key": 3, "expl": "integrate = hòa nhập."}, {"t": "mcq", "stem": "Many Vietnamese volunteer organizations have been ________ to give help and support to disadvantaged children in the area.", "options": ["laid out", "looked on", "set up", "got by"], "key": 2, "expl": "set up = found = establish = thành lập."}, {"t": "mcq", "stem": "It came as no surprise that Thailand ended the latest SEA Games at the top of medals ____.", "options": ["host", "standing", "participating", "earning"], "key": 1, "expl": "standing = danh sách thứ hạng."}, {"t": "mcq", "stem": "The children would love to join the exchange program where they can ________ themselves in different traditional and cultural activities.", "options": ["immerse", "dip", "imply", "obtain"], "key": 0, "expl": "immerse in ST = đắm chìm trong cái gì."}, {"t": "mcq", "stem": "It is important that Young Vietnamese people be taught the importance of ________ the national heritage.", "options": ["preserving", "reversing", "reserving", "conserving"], "key": 0, "expl": "preserve = bảo tồn, duy trì; conserve = sử dụng tiết kiệm hoặc bảo vệ."}, {"t": "mcq", "stem": "Vietnam, along with China, stands out as a rare ________ story among transition economies.", "options": ["successful", "successive", "success", "succeeding"], "key": 0, "expl": "success story = câu chuyện về sự thành công."}, {"t": "mcq", "stem": "There is a ________ shortage of food in the disaster-stricken areas of ASEAN.", "options": ["deep", "critical", "erratic", "strong"], "key": 1, "expl": "critical đi với shortage = thiếu thốn trầm trọng."}, {"t": "mcq", "stem": "Young Vietnamese people are supposed to ________ themselves in several voluntary social activities.", "options": ["promote", "involve", "serve", "participate"], "key": 1, "expl": "involve themselves in ... = tham gia hoạt động gì."}, {"t": "mcq", "stem": "ASEAN always attempts to ________ adequate support to victims of natural disasters in the area.", "options": ["conduct", "involve", "present", "administer"], "key": 2, "expl": "present adequate support = cung cấp đủ sự hỗ trợ."}, {"t": "mcq", "stem": "All ________ were asked to list all the members of ASEAN that they could think of in a one-minute period.", "options": ["participates", "participations", "participants", "participating"], "key": 2, "expl": "Sau 'All' cần danh từ số nhiều chỉ người làm chủ ngữ; 'participants' là những người tham gia."}, {"t": "mcq", "stem": "We will create a stable, prosperous and highly ________ ASEAN Economic community.", "options": ["compete compete", "competition", "competitor", "competitive"], "key": 3, "expl": "Trước danh từ 'community' cần tính từ; 'competitive' (có tính cạnh tranh) đứng song song với 'prosperous'."}, {"t": "mcq", "stem": "Unfortunately, the solution to this problem is neither simple nor ________", "options": ["economy", "economic", "economical", "economicany"], "key": 2, "expl": "Sau 'nor' cần một tính từ song song với 'simple'; 'economical' là tính từ chỉ sự hợp lý, tiết kiệm."}, {"t": "mcq", "stem": "The members meet once a week to develop and adopt proposals on new ________ and legislation.", "options": ["policy", "politic", "political", "politician"], "key": 0, "expl": "'policy' (chính sách) là danh từ đi cặp với 'legislation' trong cụm 'new policy and legislation'."}, {"t": "mcq", "stem": "The children in Viet nam grew up with deep ________ for their parents and older people.", "options": ["respect", "respecting", "respectful", "respectability"], "key": 0, "expl": "Sau tính từ 'deep' cần danh từ; 'respect' là lòng kính trọng dành cho cha mẹ, người lớn tuổi."}, {"t": "mcq", "stem": "Viet Nam is a member of many international ___________.", "options": ["businesses", "communities", "programmes", "organisations"], "key": 3, "expl": "Sau tính từ 'international' cần danh từ; Việt Nam là thành viên của nhiều 'organisations' (tổ chức)."}, {"t": "mcq", "stem": "Viet Nam has also become more attractive to foreign_________", "options": ["investors", "invest", "investment", "investor"], "key": 0, "expl": "Sau tính từ 'foreign' cần danh từ số nhiều chỉ người; 'investors' là các nhà đầu tư nước ngoài."}, {"t": "mcq", "stem": "Joining the WTO has helped Viet Nam ____________ its economic growth.", "options": ["provide", "promote", "prevent", "predict"], "key": 1, "expl": "'promote growth' nghĩa là thúc đẩy tăng trưởng; các động từ còn lại sai nghĩa trong ngữ cảnh này."}, {"t": "mcq", "stem": "Through __________ activities, Viet Nam has helped achieve peace in the global community.", "options": ["interesting", "peacekeeping", "exciting", "influencing"], "key": 1, "expl": "'peacekeeping activities' là các hoạt động gìn giữ hòa bình, hợp với mục tiêu hòa bình toàn cầu."}, {"t": "mcq", "stem": "Vietnam needs to improve the quality of goods and services so that we can __________new global markets.", "options": ["enter", "entering", "to enter", "enters"], "key": 0, "expl": "Sau động từ khuyết thiếu 'can' dùng V nguyên mẫu: 'can enter new global markets'."}, {"t": "mcq", "stem": "Viet Nam __________ foreign investors in various parts of the economy.", "options": ["expresses", "welcomes", "hesitates", "promotes"], "key": 1, "expl": "'welcome investors' nghĩa là hoan nghênh, chào đón nhà đầu tư đến làm ăn."}, {"t": "mcq", "stem": "Since Viet Nam became a member of the WTO, it has gained numerous___________ benefits.", "options": ["economic", "politic", "individual", "universal"], "key": 0, "expl": "Trước danh từ 'benefits' cần tính từ; 'economic benefits' là những lợi ích về kinh tế."}, {"t": "mcq", "stem": "The ASEAN Security Community (ASC) aims to ensure that countries in the region live at _____ with one another and in a democratic and harmonious environment.", "options": ["Peace", "Peaceful", "Peacefully", "Peaceable"], "key": 0, "expl": "Cụm 'live at peace with one another' — cần danh từ 'Peace' sau giới từ 'at'."}, {"t": "mcq", "stem": "ASEAN’s aims include the acceleration of economic growth, _____ progress, cultural development among its members, and the promotion of regional peace.", "options": ["Society", "Social", "Socially", "Socialize"], "key": 1, "expl": "Trước 'progress' cần tính từ song song với 'economic' và 'cultural'; 'Social progress' là tiến bộ xã hội."}, {"t": "mcq", "stem": "A combined gross domestic ______ of the member countries of ASEAN has grown at an average rate of around 6% per year.", "options": ["Produce", "Productivity", "Production", "Product"], "key": 3, "expl": "Thuật ngữ cố định 'gross domestic product' (GDP) nghĩa là tổng sản phẩm quốc nội."}, {"t": "mcq", "stem": "To build on the field of political and security cooperation, _______ ASEAN Leaders have agreed to establish the ASEAN Security Community (ASC).", "options": ["A", "An", "The", "Ø"], "key": 2, "expl": "Danh từ 'ASEAN Leaders' đã được xác định cụ thể trong ngữ cảnh nên dùng mạo từ 'The'."}, {"t": "mcq", "stem": "On July 28, 1995, Vietnam became ______ seventh member of ASEAN.", "options": ["A", "An", "The", "Ø"], "key": 2, "expl": "Trước số thứ tự như 'seventh' bắt buộc dùng mạo từ 'the': 'the seventh member'."}, {"t": "mcq", "stem": "ASEAN has ______ population of 575.5 million.", "options": ["A", "An", "The", "Ø"], "key": 0, "expl": "Trước danh từ số ít 'population' bắt đầu bằng âm phụ âm, dùng mạo từ 'A'."}, {"t": "mcq", "stem": "The population of ASEAN accounts ______ about, 8.7% of the world’s population.", "options": ["Of", "For", "In", "From"], "key": 1, "expl": "Cụm 'account for' nghĩa là chiếm một tỉ lệ nào đó: chiếm khoảng 8,7% dân số thế giới."}, {"t": "mcq", "stem": "Laos and Myanmar were admitted _____ ASEAN in 1997.", "options": ["for", "of", "to", "in"], "key": 2, "expl": "Cụm 'be admitted to' nghĩa là được kết nạp vào một tổ chức: Lào và Myanmar gia nhập ASEAN năm 1997."}, {"t": "mcq", "stem": "ASEAN also try to solve the problems of ethnic tensions which might lead ____scivil war.", "options": ["Into", "Away", "Off", "To"], "key": 3, "expl": "Cụm 'lead to' nghĩa là dẫn đến một hậu quả: căng thẳng sắc tộc có thể dẫn đến nội chiến."}, {"t": "mcq", "stem": "One of ASEAN’s objectives is to help people think about peace and _____ and do something about it.", "options": ["origin", "justice", "statistics", "record"], "key": 1, "expl": "'peace and justice' là cặp khái niệm đi cùng nhau: hòa bình và công lý — mục tiêu của ASEAN."}, {"t": "mcq", "stem": "There are plenty of industrial ________ established in the area, which also makes the government worried about pollution.", "options": ["series", "goods", "enterprises", "relationships"], "key": 2, "expl": "'industrial enterprises' nghĩa là các doanh nghiệp công nghiệp được thành lập trong khu vực."}, {"t": "mcq", "stem": "Free _____ area is a designated group of countries that have agreed to eliminate tariffs, quotas, and preferences on most goods among them.", "options": ["trade", "cultural", "stable", "adopted"], "key": 0, "expl": "Thuật ngữ cố định 'free trade area' nghĩa là khu vực thương mại tự do giữa các nước."}, {"t": "mcq", "stem": "The ASEAN Investment Area aims to enhance the competitiveness of the region for attracting direct investment which flows into and within ASEAN. (enhance = ?)", "options": ["produce", "combine", "found", "improve"], "key": 3, "expl": "'enhance' nghĩa là nâng cao, cải thiện; từ đồng nghĩa trong các lựa chọn là 'improve'."}, {"t": "mcq", "stem": "ASEAN has ________ a community of Southeast Asian nations at peace with one another and at peace with the world.", "options": ["joined", "estimated", "established", "solved"], "key": 2, "expl": "'establish a community' nghĩa là thành lập, xây dựng một cộng đồng các nước Đông Nam Á."}, {"t": "mcq", "stem": "ASEAN helps to ______ regional cooperation in Southeast Asia in the spirit of equality and partnership", "options": ["invest", "promote", "admit", "invent"], "key": 1, "expl": "'promote cooperation' nghĩa là thúc đẩy sự hợp tác trong khu vực trên tinh thần bình đẳng."}, {"t": "mcq", "stem": "Rice is the ______ exported product of Vietnam.", "options": ["main", "free", "average", "rural"], "key": 0, "expl": "'main' nghĩa là chính, chủ lực; gạo là mặt hàng xuất khẩu chính của Việt Nam."}, {"t": "mcq", "stem": "The Vietnamese bank will conduct an __________ investigation in the next two weeks.", "options": ["external", "internal", "local", "national"], "key": 1, "expl": "'internal investigation' nghĩa là cuộc điều tra nội bộ, do chính tổ chức tiến hành."}, {"t": "mcq", "stem": "The organization's aim is to __________ the cultural ties between Vietnam and Asea countries", "options": ["discourage", "publicize", "hinder", "strengthen"], "key": 3, "expl": "Mục đích của tổ chức là 'strengthen' — củng cố, tăng cường các mối liên hệ văn hóa."}, {"t": "mcq", "stem": "There has been a lot of discussion about ________ of grades in higher education recently in Vietnam.", "options": ["poverty", "inflation", "insecurity", "wealth"], "key": 1, "expl": "Hiện tượng bị bàn luận về điểm số trong giáo dục là 'inflation' — lạm phát điểm."}, {"t": "mcq", "stem": "The election for the ___________ of the council within Asean countries will take place on Tuesday.", "options": ["leadership", "maintainance", "principle", "agreement"], "key": 0, "expl": "'the leadership of the council' nghĩa là ban lãnh đạo của hội đồng — vị trí được bầu chọn."}]}, {"title": "GRAMMAR — Choose the correct answer", "intro": "Mark the letter A, B, C, or D to indicate the correct answer to each of the following questions.", "items": [{"t": "mcq", "stem": "She apologised ________ waiting so long.", "options": ["for keeping me", "for me", "for me keeping", "to me for"], "key": 0, "expl": "Cụm 'apologise for doing something': cô ấy xin lỗi vì đã để tôi chờ lâu — 'for keeping me waiting'."}, {"t": "mcq", "stem": "Her mother prevented her ________ going out tonight.", "options": ["about", "against", "at", "from"], "key": 3, "expl": "Cụm 'prevent somebody from doing something' — mẹ ngăn không cho cô ấy ra ngoài tối nay."}, {"t": "mcq", "stem": "She insisted ________ talking to her lawyer.", "options": ["in", "for", "on", "of"], "key": 2, "expl": "Cụm 'insist on doing something' — cô ấy khăng khăng đòi nói chuyện với luật sư."}, {"t": "mcq", "stem": "He is not good ________ maths. He is incapable ________ calculating.", "options": ["at – of", "for – of", "on - for", "on – of"], "key": 0, "expl": "Hai cụm cố định đi cùng nhau: 'good at' (giỏi về) và 'incapable of' (không có khả năng)."}, {"t": "mcq", "stem": "It is no use ________ a girl that she doesn't need to lose any weight.", "options": ["convince", "convincing", "to convince", "to convincing"], "key": 1, "expl": "Cụm 'It is no use' đi với V-ing: thuyết phục cô ấy rằng không cần giảm cân là vô ích."}, {"t": "mcq", "stem": "I have much homework that I ought ________", "options": ["do", "to doing", "doing", "to do"], "key": 3, "expl": "Sau 'ought' dùng to-V nguyên mẫu: 'ought to do' — phải làm bài tập về nhà."}, {"t": "mcq", "stem": "She did a funny little curtsy which Josh and Silver couldn't help ________ at.", "options": ["laugh", "laughing", "to laugh", "to laughing"], "key": 1, "expl": "Cụm 'can't help doing something' — không nhịn được, phải bật cười trước động tác nhún chào ngộ nghĩnh."}, {"t": "mcq", "stem": "We are looking forward ________ out at the weekend.", "options": ["go .", "going", "to go", "to going"], "key": 3, "expl": "Trong 'look forward to', 'to' là giới từ nên động từ theo sau ở dạng V-ing: 'to going out'."}, {"t": "mcq", "stem": "You should give up ________ your sister.", "options": ["being bullied", "bullied", "bullying", "to bully"], "key": 2, "expl": "Sau 'give up' dùng V-ing: bạn nên thôi bắt nạt em gái mình — 'give up bullying'."}, {"t": "mcq", "stem": "She is used ________ to loud music.", "options": ["listen", "listening", "to listen", "to listening"], "key": 3, "expl": "Cụm 'be used to' đi với V-ing, chỉ thói quen đã quen: quen nghe nhạc to."}, {"t": "mcq", "stem": "I'm in a difficult position. What do you advise me ________?", "options": ["do", "doing", "to do", "to doing"], "key": 2, "expl": "Cấu trúc 'advise somebody to do something' — bạn khuyên tôi nên làm gì."}, {"t": "mcq", "stem": "It's a nice day. Does anyone fancy ________ for a walk?", "options": ["having gone", "going", "to go", "went"], "key": 1, "expl": "Động từ 'fancy' đi với V-ing khi rủ rê làm gì: 'fancy going for a walk'."}, {"t": "mcq", "stem": "I wish that dog would stop ________ . It's driving me mad.", "options": ["bark", "barking", "being barked", "to bark"], "key": 1, "expl": "Cụm 'stop doing something' — mong con chó ngừng sủa, việc đang diễn ra cần dừng lại."}, {"t": "mcq", "stem": "He never says anything that is worth ________ to.", "options": ["listen", "listening", "to listen", "to listening"], "key": 1, "expl": "Sau tính từ 'worth' dùng V-ing: những điều anh ta nói không đáng nghe — 'worth listening to'."}, {"t": "mcq", "stem": "Carol's parents always encouraged her ________ hard at school.", "options": ["being studied", "study", "studying", "to study"], "key": 3, "expl": "Cấu trúc 'encourage somebody to do something' — bố mẹ luôn khuyến khích cô ấy học chăm."}, {"t": "mcq", "stem": "They promised ________ me ________ for the party.", "options": ["to help prepare", "to help/preparing", "helping/preparing", "helping/to prepare"], "key": 0, "expl": "'promise to do' kết hợp 'help somebody prepare': họ hứa giúp tôi chuẩn bị cho bữa tiệc."}, {"t": "mcq", "stem": "She is afraid of the dentist, so she always puts off ________ till the last possible moment.", "options": ["to go", "going", "go", "gone"], "key": 1, "expl": "put off doing ST = trì hoãn việc gì."}, {"t": "mcq", "stem": "I don't regret ________ her what I thought, even if it upsets her.", "options": ["tell", "to tell", "to have told", "telling"], "key": 3, "expl": "regret doing ST = hối hận việc đã làm; regret to tell/inform = rất lấy làm tiếc phải ..."}, {"t": "mcq", "stem": "I simply couldn't resist ________ you to tell you the good news!", "options": ["phoning", "to phone", "phone", "phoned"], "key": 0, "expl": "resist doing ST = cưỡng lại việc gì."}, {"t": "mcq", "stem": "They were expected ________ back by eleven.", "options": ["being", "been", "have", "to be"], "key": 3, "expl": "be expected to V-inf = được dự đoán sẽ làm gì."}, {"t": "mcq", "stem": "We'll get Robert ________ it.", "options": ["delivers", "delivering", "to deliver", "deliver"], "key": 2, "expl": "get SB to do ST = nhờ vả ai làm gì."}, {"t": "mcq", "stem": "Let's not waste time ________ about this.", "options": ["argue", "arguing", "having argued", "to have argued"], "key": 1, "expl": "waste time doing ST = tốn thời gian làm việc gì."}, {"t": "mcq", "stem": "I went to the airport ________ to meet her, but she didn't arrive.", "options": ["expecting", "to expect", "to be expected", "to have expected"], "key": 0, "expl": "Rút gọn mệnh đề cùng chủ ngữ, dạng chủ động → V-ing."}, {"t": "mcq", "stem": "________ that I would be late for school, I took a taxi instead of a bus.", "options": ["Thinking", "Thought", "To think", "To be thinking"], "key": 0, "expl": "Rút gọn mệnh đề cùng chủ ngữ, dạng chủ động → V-ing."}, {"t": "mcq", "stem": "I tried ____ her flowers but it didn't have any effect.", "options": ["to send", "sending", "sent", "to be sent"], "key": 1, "expl": "try doing ST = thử làm việc gì; try to do ST = cố gắng làm việc gì."}, {"t": "mcq", "stem": "I insist on ________ this small present as a token of my appreciation.", "options": ["your accepting", "you to accept", "yours accepting", "you accept"], "key": 0, "expl": "insist on doing ST = khăng khăng làm việc gì."}, {"t": "mcq", "stem": "Susan hoped ________ to Terry's party.", "options": ["for being invited", "to be invited", "she will be invited", "being invited"], "key": 1, "expl": "hope to do ST = hi vọng được làm việc gì."}, {"t": "mcq", "stem": "The universe is supposed ________ all the time.", "options": ["to expand", "expanding", "to be expanding", "to have expanded"], "key": 2, "expl": "be supposed to do ST; có “all the time” nên dùng tiếp diễn: be expanding."}, {"t": "mcq", "stem": "You should avoid ________ to the downtown area during the rush hour.", "options": ["traveling", "to travel", "traveled", "to traveling"], "key": 0, "expl": "avoid doing ST = tránh làm việc gì."}, {"t": "mcq", "stem": "I greatly regret ________ those boots when they were so cheap.", "options": ["not having bought", "not to have bought", "not to buy", "didn't buy"], "key": 0, "expl": "regret (not) doing ST = hối hận đã (không) làm việc gì."}, {"t": "mcq", "stem": "He is very skillful at ________ animal noises.", "options": ["being made", "to make", "made", "making"], "key": 3, "expl": "be skillful at doing ST = rất thành thạo việc gì."}, {"t": "mcq", "stem": "Some people are against children ________ to school before they are six.", "options": ["being sent", "to send", "to be sent", "having been sent"], "key": 0, "expl": "be against doing ST = phản đối việc gì; ở đây cần bị động: being sent."}, {"t": "mcq", "stem": "Who is responsible _______ the garbage – the husband of the wife ?", "options": ["to take out", "for take out", "for taking out", "with taking out"], "key": 2, "expl": "Cụm 'be responsible for doing something' — chịu trách nhiệm đổ rác, dùng giới từ 'for' và V-ing."}, {"t": "mcq", "stem": "“It’s difficult to make money as an artist.” – “Have you considered ________ a course in business for artists?”", "options": ["to take", "about taking", "your taking", "taking"], "key": 3, "expl": "Sau động từ 'consider' dùng V-ing: bạn đã nghĩ đến việc học một khóa kinh doanh chưa."}, {"t": "mcq", "stem": "________ a foreign language well is a long process.", "options": ["Learn", "Learning", "To learning", "Having learned"], "key": 1, "expl": "V-ing đóng vai trò chủ ngữ đầu câu: 'Learning a foreign language well is a long process'."}, {"t": "mcq", "stem": "What do you enjoy _______ in your free time ?", "options": ["doing", "do", "to do", "done"], "key": 0, "expl": "Động từ 'enjoy' đi với V-ing: bạn thích làm gì vào thời gian rảnh."}, {"t": "mcq", "stem": "She was worried about ________ by thieves.", "options": ["being robbed", "robbing", "being rob", "be robbing"], "key": 0, "expl": "Cô ấy lo bị cướp nên cần dạng bị động của V-ing: 'being robbed by thieves'."}, {"t": "mcq", "stem": "“Why have you decided to go back to school” – “I’m tired _______ as a secretary.”", "options": ["for work", "to work", "of working", "about working"], "key": 2, "expl": "Cụm 'be tired of doing something' — chán ngấy công việc thư ký nên muốn đi học lại."}, {"t": "mcq", "stem": "“How do you like American food?” – “Well, it’s not bad. Now I _______ hamburgers.”", "options": ["used to eat", "am used to eat", "used to eating", "am used to eating"], "key": 3, "expl": "Nói về thói quen ở hiện tại dùng 'am used to' + V-ing: giờ tôi đã quen ăn hamburger."}, {"t": "mcq", "stem": "We insisted ___________ by the manager .", "options": ["to be seen", "to see", "on being seen", "on seeing"], "key": 2, "expl": "'insist on' đi với V-ing; nghĩa bị động nên là 'on being seen' — nằng nặc đòi được quản lý tiếp."}]}, {"title": "GRAMMAR — Error correction", "intro": "Mark the letter A, B, C, or D to indicate the underlined part that needs correction in each of the following questions.", "items": [{"t": "mcq", "stem": "The ten stalks of padi represent the hope for an ASEAN comprising all the ten countries in Southeast Asia bound together in friendly and solidarity.", "options": ["The ten stalks of padi represent", "the hope for an ASEAN comprising all the ten countries in", "Southeast Asia bound together in friendly", "and solidarity."], "key": 2, "expl": "Sau giới từ 'in' cần danh từ song song với 'solidarity'; 'friendly' là tính từ, phải sửa thành 'friendship'."}, {"t": "mcq", "stem": "ASEAN was found in Bangkok, Thailand on 8 August 1967 when the five founding members signed the ASEAN Declaration.", "options": ["ASEAN was found", "in Bangkok, Thailand on 8 August 1967", "when the five founding members", "signed the ASEAN Declaration."], "key": 0, "expl": "ASEAN được thành lập nên phải dùng 'was founded'; 'found' là quá khứ của 'find' (tìm thấy), sai nghĩa."}, {"t": "mcq", "stem": "You can congratulate yourself about having done an excellent job.", "options": ["You can congratulate", "yourself", "about", "having done an excellent job."], "key": 2, "expl": "Cụm đúng là 'congratulate yourself on doing something' (tự chúc mừng vì...), không dùng giới từ 'about'."}, {"t": "mcq", "stem": "Peter apologized for break the vase.", "options": ["Peter apologized", "for", "break", "the vase."], "key": 2, "expl": "Sau 'apologized for' phải dùng V-ing; 'break' ở dạng nguyên mẫu là sai, phải là 'breaking'."}, {"t": "mcq", "stem": "Being influenced by Chinese, European, Indian, and Malay cultures, Indonesia is a wide diverse nation with over 300 ethnic groups.", "options": ["Being influenced by Chinese, European, Indian, and Malay cultures", "Indonesia is", "a wide diverse nation", "with over 300 ethnic groups."], "key": 2, "expl": "Trước tính từ 'diverse' cần trạng từ bổ nghĩa; phải là 'widely diverse', không dùng tính từ 'wide'."}, {"t": "mcq", "stem": "I’m delighted hearing that you have made much progress in your study.", "options": ["I’m delighted", "hearing that you", "have made much progress", "in your study."], "key": 1, "expl": "Sau tính từ 'delighted' dùng to-V nguyên mẫu chỉ lý do: 'delighted to hear', không dùng 'hearing'."}, {"t": "mcq", "stem": "The MPAC is intended allowing the AEC and enhance ASEAN's inner integration with the help of improved infrastructure development.", "options": ["The MPAC is intended", "allowing the AEC and enhance", "ASEAN's inner integration with the help of", "improved infrastructure development."], "key": 1, "expl": "Cấu trúc 'be intended to do something' chỉ mục đích; 'allowing' sai dạng sau 'intended'."}, {"t": "mcq", "stem": "I warned them not climb the mountain in such bad weather.", "options": ["I warned them", "not climb", "the mountain", "in such bad weather."], "key": 1, "expl": "Cấu trúc 'warn somebody not to do something' bắt buộc có 'to' trước V nguyên mẫu: 'not to climb'."}, {"t": "mcq", "stem": "John is having a clown birthday party. The clown is appearing. He always loves watching the clown. He is looking happy", "options": ["John is having a clown birthday party.", "The clown is appearing.", "He always loves watching the clown.", "He is looking happy"], "key": 1, "expl": "Động từ 'appear' chỉ trạng thái xuất hiện, không chia ở thì tiếp diễn; phải là 'The clown appears'."}, {"t": "mcq", "stem": "He could not decide whether to get a job or studying.", "options": ["He could not decide whether", "to get a job", "or", "studying."], "key": 3, "expl": "Sau 'whether', hai vế phải song song: 'to get a job' phải đi với 'to study', không dùng 'studying'."}, {"t": "mcq", "stem": "Not everybody prefers study abroad to studying in his or her home country.", "options": ["Not everybody prefers", "study abroad", "to studying in his or her", "home country."], "key": 1, "expl": "Sau động từ 'prefer' phải dùng V-ing hoặc to-V nguyên mẫu; 'study' ở dạng nguyên mẫu trần là sai."}, {"t": "mcq", "stem": "from Viet Nam who wish applying for the ASEAN scholarship must be approved by the Ministry of Education and Training.", "options": ["from Viet Nam who wish", "applying for the ASEAN scholarship", "must be approved by the", "Ministry of Education and Training."], "key": 1, "expl": "Động từ 'wish' đi với to-V nguyên mẫu: 'wish to apply for the scholarship', không đi với V-ing."}, {"t": "mcq", "stem": "ASEAN aims at promoting eonomic growth, regional peace as well as provide opportunities for its members.", "options": ["ASEAN aims at", "promoting eonomic growth, regional peace", "as well as", "provide opportunities for its members."], "key": 3, "expl": "Vế sau 'as well as' phải song song với 'promoting' ở vế trước nên phải là 'providing', không phải 'provide'."}, {"t": "mcq", "stem": "Soon after becoming a member, Viet Nam signed the Treaty on the Southeast Asian Nuclear-Weapon-Free Zone and being one of the founding members of the ASEAN Regional Forum.", "options": ["Soon after becoming a member", "Viet Nam signed the Treaty on the Southeast Asian Nuclear-Weapon-Free Zone", "and being one of the", "founding members of the ASEAN Regional Forum."], "key": 2, "expl": "Động từ 'being' không song song với 'signed' ở vế trước; câu cần một động từ chính chia cùng thì quá khứ."}, {"t": "mcq", "stem": "I have been listening to your speech, but I am doubting what you are saying. I don't feel that it is a good idea.", "options": ["I have been listening to your speech", "but I am doubting", "what you are saying. I don't feel", "that it is a good idea."], "key": 1, "expl": "Động từ 'doubt' chỉ trạng thái nhận thức nên không chia tiếp diễn; phải là 'but I doubt'."}]}, {"title": "SPEAKING", "intro": "Mark the letter A, B, C, or D to indicate the correct response to each of the following exchanges.", "items": [{"t": "mcq", "stem": "Mike and Joe are talking about transport in the future within the Asean region.\n- Mike: “Do you think there will be pilotless planes?”.\n- Joe: “______”.", "options": ["I’m afraid I can’t.", "What for? There are quite a few around.", "Why not? There have been cars without drivers.", "I’m glad you like it."], "key": 2, "expl": "Joe dẫn chứng tương tự — đã có ô tô không người lái — nên đáp 'Why not?' là phù hợp."}, {"t": "mcq", "stem": "Jack and Jill are talking about the trip.\n-Jack: “I’m going to take a five-day trip to Japan.”\n-Jill: “______”.", "options": ["No, of course not.", "Have a good time.", "The same to you.", "Yes, let’s."], "key": 1, "expl": "Trước một chuyến đi, câu chúc thông dụng là 'Have a good time' — chúc đi chơi vui vẻ."}, {"t": "mcq", "stem": "\"I will pick you up around 7:30 in front of the Asean Museum. The movie starts at 8:00.\" – “____”", "options": ["No, you don't", "OK. See you then.", "I don't like waiting.", "Thanks, no big deal."], "key": 1, "expl": "Đáp lại lời hẹn đón, câu xác nhận tự nhiên là 'OK. See you then.' — đồng ý và hẹn gặp lại."}, {"t": "mcq", "stem": "Jane is talking to Billy about the Asean meeting.\n-Jane: “Is everybody happy with the decision?”.\n-Billy: “______”.", "options": ["That sounds like fun.", "Yes, it is certainly.", "No, have you?", "Not really."], "key": 3, "expl": "Câu hỏi 'Is everybody happy...?' cần câu trả lời phủ định nhẹ; 'Not really' nghĩa là không hẳn vậy."}, {"t": "mcq", "stem": "Clara and Phil are discussing women and men in Asean’s society.\n- Clara: \"As I see it, women often drive more carefully than men.\"\n- Phil: \"_________”", "options": ["Yes, please", "Absolutely", "What nonsense", "Never mind"], "key": 1, "expl": "Phil đồng tình hoàn toàn với nhận xét của Clara nên dùng 'Absolutely' — chắc chắn rồi."}, {"t": "mcq", "stem": "An old gentleman, who is not sure where to go for the summer holiday, is asking a travel agent for advice.\n- Gentleman: “Can you recommend any places for this summer holiday to Vietnam?”\n- Agent: \"________________\"", "options": ["Yes, please go to other agencies.", "A package tour to the Phu Quoc Island would be perfect, Sir.", "I don’t think you could afford a tour to Singapore, sir.", "No, you cannot recommend any places."], "key": 1, "expl": "Nhân viên du lịch phải đưa gợi ý cụ thể; tour đảo Phú Quốc là câu tư vấn phù hợp nhất."}, {"t": "mcq", "stem": "Jane and John are talking about the speech contest next week.\n- Jane: “Will Ann enter for the speech contest about Asean culture?”\n- John: “______________”", "options": ["Possibly not", "Not possibly", "Not possible", "Possible not"], "key": 0, "expl": "Trạng từ 'possibly' đứng trước 'not' mới đúng trật tự: 'Possibly not' — có lẽ không."}, {"t": "mcq", "stem": "Two students Peter and Anny are talking about Vietnamese women’s role.\n- Peter: “ In my opinion, women in rural areas in Vietnam would not go to work.”\n- Anny: “.........................”", "options": ["Yes, I don’t agree", "What nonsense!", "Yes, I do", "Yes, it was ever"], "key": 1, "expl": "Anny phản đối mạnh ý kiến của Peter nên thốt lên 'What nonsense!' — thật vô lý."}, {"t": "mcq", "stem": "Lan and Sam are talking about the wonders of Asean countries.\n- Lan: “Would you say Angkor Wat is one of the greatest man-made wonders in Combodia?”\n- Sam: “_______”", "options": ["That’s the least I could do.", "Do you think so, too?", "There’s no doubt about that.", "It was created by ancient Chinese people, wasn’t it?"], "key": 2, "expl": "Sam khẳng định chắc chắn về Angkor Wat nên nói 'There's no doubt about that.' — điều đó khỏi bàn."}, {"t": "mcq", "stem": "Two friends Diana and Anne are talking about their friend Bob’s new Asean hairstyle.\n- Diana: “Bob looks so impressive with his new hairstyle, Anne.”\n- Anne: “______”", "options": ["Thank you so much", "You can’t believe it!", "Yes, he looks so different", "Fine. I guess"], "key": 2, "expl": "Anne tiếp nối lời khen về kiểu tóc mới bằng nhận xét 'he looks so different' — trông anh ấy khác hẳn."}, {"t": "mcq", "stem": "Tom and Mary are talking after the conference.\nTom: “I’m awfully sorry I can’t go with you.”\nMary: “______? Haven’t you agreed?”", "options": ["Why do you think", "How come", "What is it", "Why don’t you"], "key": 1, "expl": "How come = làm thế nào giờ."}, {"t": "mcq", "stem": "Joe and Matt met at a friend coming from Malaysia in a farewell party.\nJoe: “ I thought you were too tired”\nMatt: “ ______ I’ve decided to go. I feel I owe it to him.”", "options": ["More of the same", "All the more", "One and the same", "All the same"], "key": 3, "expl": "All the same = dẫu sao, tuy nhiên."}, {"t": "mcq", "stem": "John was late for a meeting with Jane. He’s now apologizing to Jane for the incident.\nJohn: “I’m so sorry I was late.\"\nJane: “_______.”", "options": ["Little wonder you do!", "Forget about it!", "Don’t sweat over it!", "No offense intended!"], "key": 1, "expl": "Forget about it! = Quên nó đi!"}, {"t": "mcq", "stem": "Tom and Josh are discussing their summer vacation plan.\nTom: “ _______.”\nJosh: “I don’t think that’s a good idea because it will be costly and strenuous.”", "options": ["Is it wise to climb Mount Fuji when we are in Japan this summer?", "What if we climb Mount Fuji when we are in Japan this summer?", "How come will we climb Mount Fuji when we are in Japan this summer?", "Why don’t we climb Mount Fuji when we are in Japan this summer?"], "key": 1, "expl": "Josh chê kế hoạch tốn kém, mệt, chứng tỏ Tom vừa gợi ý; mẫu 'What if we...?' là đề xuất phù hợp."}, {"t": "mcq", "stem": "A man is talking to Alex when he is on holiday in Hong Kong.\nThe man: “You haven’t lived here long, have you?”\nAlex: “__________.”", "options": ["Yes, I have just moved here", "No, only three months", "Yes, just a few days", "No, I live here for a long time"], "key": 1, "expl": "Câu hỏi đuôi ngụ ý Alex mới đến; 'No, only three months' xác nhận đúng ý: mới ở đây ba tháng."}]}, {"title": "READING COMPREHENSION — ASEAN (choose the suitable word)", "intro": "Choose the suitable word for each answer. Word bank: average, at, diverse, total, estimated, own\nASEAN has a population of 575.5 million, accounting for about 8.7% of the world’s population. Its 1________ area is 4,464,322 square kilometres. It is a region of diverse cultures, and people in some countries such as the Philippines, Brunei, Malaysia and Singapore speak English besides their 2_________ languages. According to the statistics recorded in 2007, ASEAN had a combined gross domestic product of about US$ 1282 billion. This combined GDP grew at an 3_________ rate of around 6% per year from 2003 to 2007. The economies of the member countries are 4_________, although its major products include electronic goods, oil and wood. The Governments of ASEAN countries have paid special attention to trade. In 2006, the ASEAN region had a total trade of US$ 1405 billion. It has been 5__________ that a free trade area would be established in the region by 2020. The ASEAN leaders have also adopted the ASEAN Vision 2020, which is aimed 6__________ forging closer economic integration within the region. The Hanoi Plan of Action, adopted in 1998, serves as the first in a series of planned actions leading up to the realization of the ASEAN Vision.", "items": [{"t": "fill", "stem": "Its 1________ area is 4,464,322 square kilometres.", "answer": "total", "accept": ["total"], "expl": "Cụm 'total area' nghĩa là t
