ổng diện tích — con số 4.464.322 km² là diện tích toàn khu vực."}, {"t": "fill", "stem": "It is a region of diverse cultures, and people in some countries such as the Philippines, Brunei, Malaysia and Singapore speak English besides their 2_________ languages.", "answer": "own", "accept": ["own"], "expl": "Cụm 'their own languages' nghĩa là tiếng mẹ đẻ của chính họ, bên cạnh tiếng Anh."}, {"t": "fill", "stem": "This combined GDP grew at an 3_________ rate of around 6% per year from 2003 to 2007.", "answer": "average", "accept": ["average"], "expl": "Cụm 'average rate' nghĩa là tốc độ trung bình — GDP tăng trung bình khoảng 6% mỗi năm."}, {"t": "fill", "stem": "The economies of the member countries are 4_________, although its major products include electronic goods, oil and wood.", "answer": "diverse", "accept": ["diverse"], "expl": "Kinh tế các nước thành viên rất khác nhau nên tính từ 'diverse' (đa dạng) hợp với mạch bài."}, {"t": "fill", "stem": "It has been 5__________ that a free trade area would be established in the region by 2020.", "answer": "estimated", "accept": ["estimated"], "expl": "Cấu trúc bị động 'It has been estimated that...' nghĩa là người ta ước tính rằng."}, {"t": "fill", "stem": "The ASEAN leaders have also adopted the ASEAN Vision 2020, which is aimed 6__________ forging closer economic integration within the region.", "answer": "at", "accept": ["at"], "expl": "Cụm 'be aimed at' nghĩa là nhằm vào mục tiêu gì: Vision 2020 nhằm tăng cường hội nhập kinh tế."}]}, {"title": "Reading 1", "intro": "Read the following passage and mark the letter A, B, C, or D to indicate the correct word or phrase that best fits each of the numbered blanks.\nAsia's economic, political and cultural importance is growing at a never-before seen rate. Take China, for example: In terms of purchasing power, China is now the largest (1) ________ of the world, having recently (2) _________ over the crown from the long time leader United States. Understanding the fundamental structural changes in the global economy and having studied abroad in Asia is a huge asset on your (3) _________ when competing for jobs.\nAlthough the increasing importance of the continent, many international with experience in companies are expanding to Asia and need (4) _________ with experience in Asian markets and culture. To get a (5) __________ of the action and business ideas flowing from Asia, visit Asia-Pacific Economic Cooperation's (APEC) website.", "items": [{"t": "mcq", "stem": "Blank (1)", "options": ["economic", "economical", "economically", "economy"], "key": 3, "expl": "Sau 'the largest' cần một danh từ; 'economy' (nền kinh tế) hợp với ý Trung Quốc lớn nhất thế giới."}, {"t": "mcq", "stem": "Blank (2)", "options": ["came", "passed", "kicked", "taken"], "key": 3, "expl": "Cụm 'take over' nghĩa là tiếp quản, giành lấy — Trung Quốc vừa giành ngôi vị từ tay nước giữ lâu nay."}, {"t": "mcq", "stem": "Blank (3)", "options": ["summary", "profile", "resume", "requirement"], "key": 2, "expl": "Trong ngữ cảnh xin việc của đoạn văn, 'resume' (sơ yếu lý lịch) là từ phù hợp nhất cho chỗ trống."}, {"t": "mcq", "stem": "Blank (4)", "options": ["employees", "employers", "employment", "unemployment"], "key": 0, "expl": "Chỗ trống cần danh từ chỉ người lao động; 'employees' là những người làm thuê, hợp ngữ cảnh câu."}, {"t": "mcq", "stem": "Blank (5)", "options": ["glance", "glimpse", "look", "view"], "key": 1, "expl": "Cụm cố định 'catch a glimpse of' nghĩa là thoáng nhìn thấy, liếc thấy một thứ gì đó."}]}, {"title": "Reading 2", "intro": "One of the most important variables behind the miracle of the speed of growth and recovery in the Asian economies is the (1) _______ of education. The competition for top schools and universities starts from a very early (2) _______. The point of education in Asia is to equip people to become productive members of their given societies as (3) ________ as equip the students with the skills and mentality to be (4) ________ to successfully compete against the masses of other applicants. Asian students and schools receive continuously top marks in international rankings. This has been directly (5) ________ in the success stories of several Asian countries.", "items": [{"t": "mcq", "stem": "Blank (1)", "options": ["quality", "qualification", "quantity", "quantification"], "key": 0, "expl": "Cụm 'the quality of education' — bài khẳng định chất lượng giáo dục là yếu tố đứng sau kỳ tích tăng trưởng."}, {"t": "mcq", "stem": "Blank (2)", "options": ["age", "period", "semester", "year"], "key": 0, "expl": "Cụm cố định 'from a very early age' nghĩa là ngay từ khi còn rất nhỏ tuổi."}, {"t": "mcq", "stem": "Blank (3)", "options": ["far", "long", "much", "well"], "key": 3, "expl": "Cấu trúc song song 'as well as' (cũng như) nối hai mục đích của giáo dục trong câu."}, {"t": "mcq", "stem": "Blank (4)", "options": ["able", "capable", "disable", "unable"], "key": 0, "expl": "Cụm 'be able to' chỉ khả năng; 'able' là tính từ duy nhất hợp với cấu trúc này."}, {"t": "mcq", "stem": "Blank (5)", "options": ["allowed", "influenced", "provided", "reflected"], "key": 3, "expl": "Động từ 'reflected' nghĩa là được phản ánh — điều bài nêu được phản ánh qua thực tế ở cuối đoạn."}]}, {"title": "Reading 3", "intro": "Vietnam is a (1) _______, developing country that in the last 34 years has had to recuperate from the ravages of war. Substantial progress was achieved from 1986 to 1997 in moving forward from an extremely low level of development and significantly reducing poverty.\nSince 2001, Vietnamese authorities have reaffirmed their (2) ________ to economic liberalization and international (3) _______. They have moved to implement the structural reforms needed to modernize the economy and to produce more competitive, export-driven industries.\nVietnam's membership in the ASEAN Free Trade Area (AFTA) and entry (4) ________ force of the US-Vietnam Bilateral Trade Agreement in December 2001 have led to even more rapid changes in Vietnam's trade and economic regime. Vietnam's exports to the US doubled in 2002 and again in 2003. Vietnam joined the WTO (World Trade Organization) in January 2007, following over a decade long (5) ________. This should provide an important boost to the economy and should help to ensure the continuation of liberalizing reforms.", "items": [{"t": "mcq", "stem": "Blank (1)", "options": ["dense-populated", "densely-populated", "dense-populating", "densely populating"], "key": 1, "expl": "Cụm tính từ: “densely” là trạng từ (dày đặc), “populated” là tính từ (có dân cư)."}, {"t": "mcq", "stem": "Blank (2)", "options": ["commitment", "promise", "determination", "assurance"], "key": 0, "expl": "commitment = trách nhiệm, sự trung thành với nhiệm vụ; đi với “reaffirm” (khẳng định lại)."}, {"t": "mcq", "stem": "Blank (3)", "options": ["Incorporation", "integration", "combination", "inclusion"], "key": 1, "expl": "international integration = sự thống nhất mang tính quốc tế."}, {"t": "mcq", "stem": "Blank (4)", "options": ["in", "on", "into", "of"], "key": 2, "expl": "entry into ST = sự gia nhập."}, {"t": "mcq", "stem": "Blank (5)", "options": ["negotiating process", "negotiable process", "negotiation process", "negotiated process"], "key": 2, "expl": "Danh từ ghép: “negotiation” (sự thương lượng) + “process” (quá trình)."}]}, {"title": "Reading 4", "intro": "Thailand's most celebrated festival is the Songkran Festival. It starts on April 13 and lasts between three to ten days, depending on where you are in Thailand. The word Songkran is from Sanskrit, meaning the beginning of a new solar year.\nThe festival begins on April 13 and everyone is awakened at dawn to the sound of firecrackers used to drive away evil spirits. This is the day when everything is **scrupulously** cleaned from the self, clothes, Buddha images, to houses, shops and streets in preparation for the New Year.\nApril 14 is the day between the old year and the new year. It is customary not to quarrel or use harsh words on one another. The morning is spent shopping and preparing food for the following day, while the afternoon is reserved for visiting a temple in the neighborhood. It is imperative that they carry a fistful of sand with them to compensate for the dirt that they have carried away from the temple during their visits throughout the year. The sand is then sculpted into stupa-shaped piles.\nApril 15 marks the New Year's Day called Wan Phya Wan. It is a day of great importance. It is customary to visit the temple early in the morning to take food to the monks, as a form of merit making and later in the afternoon to return to place small banners, known as Thung, on the top of the stupas built the day before.\nAfter that, visits to family and relatives are carried out. The gifts during the visit include areca nuts, clove leaves, turmeric water and acacia oil. Family members ask for forgiveness from their respected elders for any wrong doings they may have committed throughout the year and to receive their blessings for the year to come. At the end of this ceremony, a little water is sprinkled onto the hands and heads of the old people as a blessing and then quite a lot is thrown at the rest of the family in anticipation of the water wars that are to follow.", "items": [{"t": "mcq", "stem": "According to the passage, the Songkran Festival ____.", "options": ["varies in length across the areas in Thailand", "is celebrated when everyone is awakened", "marks the beginning of a new lunar year", "takes place mainly on April 13"], "key": 0, "expl": "Đoạn 1: “It starts on April 13 and lasts between three to ten days, depending on where you are in Thailand”."}, {"t": "mcq", "stem": "The word \"scrupulously\" in the passage is closest in meaning to ____.", "options": ["carefully", "honestly", "frankly", "completely"], "key": 0, "expl": "scrupulously = meticulously = carefully = một cách cẩn thận."}, {"t": "mcq", "stem": "Why do people have to carry a fistful of sand with them when visiting the temple?", "options": ["To drive away the evil spirit", "To remind them to avoid quarreling", "To make up for the dirt brought away", "To help make the stupa-shaped piles there"], "key": 2, "expl": "Đoạn 3: “...to compensate for the dirt that they have carried away from the temple...”."}, {"t": "mcq", "stem": "According to the passage, when do people bring food to the monks at the temple?", "options": ["On the first day of the festival", "On the second day of the festival", "On the third day of the festival", "On the fourth day of the festival"], "key": 2, "expl": "Lễ bắt đầu April 13 (đoạn 2); April 15 (ngày thứ ba) mang thức ăn cho các nhà sư (đoạn 4)."}, {"t": "mcq", "stem": "What often happens at the visits to family and relatives?", "options": ["The elders tell the other family members the wrong doings they made.", "The elders have a lot of water thrown at them as a blessing.", "The water wars take place before the blessing exchange.", "The wrong doings of family members are confessed to the elders."], "key": 3, "expl": "Đoạn 5: “Family members ask for forgiveness from their respected elders for any wrong doings...”."}]}, {"title": "Reading 5", "intro": "The 22nd Southeast Asian Games were held in Viet Nam from the 5th to 13th December, 2003. Although it was the first time Viet Nam hosted such a big sports event, the Games were a great success. The Games really became a festival that impressed sports enthusiasts with its spirit: solidarity, co-operation for peace and development.\nAthletes from 11 participating countries competed in 32 sports, and 444 gold medals were won. Some teams such as table tennis, badminton, karate, volleyball, basketball and wrestling were composed of top competitors in the region. Many Games records were close to international levels. Viet Nam won 158 gold medals to finish at the top of the Southeast Asian Games medal standings. Thailand ranked second with 90 golds, and Indonesia was third with only 55 golds. Singapore and Viet Nam were the two nations which had participants who were presented with the Most Outstanding Athlete titles in the Swimming and Shooting events. The Vietnamese Women's Football team successfully defended the SEA Games title. Viet Nam and Thailand played in the Men's Football Final. The Thai Team won the gold medal. In other sports such as karate, athletics, bodybuilding and wushu, the young and energetic Vietnamese athletes performed excellently and won a lot of gold medals.\nViet Nam's first place finish was not surprising. Firstly, to prepare for the 22nd SEA Games, Viet Nam carried out an intensive programme for its athletes, which included training in facilities, both home and abroad. Secondly, with the strong support of their countrymen, the Vietnamese athletes competed in high spirits. The country's success has proved that Viet Nam can organise sporting events on an international level. A plan has been proposed for Viet Nam to host the Asia Sports Games at some point in the future.", "items": [{"t": "mcq", "stem": "It can be inferred from the passage that ____.", "options": ["Viet Nam can organise sporting events better than other countries", "Viet Nam had already planned for the next Sea Games in the future", "Viet Nam prepared its athletes well for the 22nd SEA Games", "Viet Nam protected its first place in SEA Games competition"], "key": 2, "expl": "Bài nhấn mạnh sự chuẩn bị kỹ lưỡng cho Đại hội, nên suy ra vận động viên được chuẩn bị tốt."}, {"t": "mcq", "stem": "The word \"title\" in paragraph 2 is closest in meaning to ____.", "options": ["power", "label", "headline", "trophy"], "key": 3, "expl": "Trong đoạn hai, 'title' nói về danh hiệu vô địch trong thi đấu nên gần nghĩa nhất với 'trophy'."}, {"t": "mcq", "stem": "According to the passage, what is NOT true about the 22nd Southeast Asian Games?", "options": ["There were 11 countries participating in.", "Many athletes had broken the world records.", "Indonesia ranked higher than Singapore.", "Vietnamese Women's Football team won gold medal."], "key": 1, "expl": "Bài chỉ nói kỷ lục Đại hội bị phá, không nhắc kỷ lục thế giới, nên câu này sai so với bài."}, {"t": "mcq", "stem": "The word \"intensive” in paragraph 3 has OPPOSITE meaning to ____.", "options": ["delicate", "flexible", "sensitive", "vigorous"], "key": 0, "expl": "'intensive' nghĩa là cường độ cao, tập trung cao độ; từ trái nghĩa trong các lựa chọn là 'delicate' — nhẹ nhàng."}, {"t": "mcq", "stem": "What is the writer's main purpose in writing this passage?", "options": ["To explain the reasons why 22nd Sea Games was organised in Viet Nam.", "To express the writer's love and how much he is proud of the country's success.", "To introduce top competitors in the region and their ranking in the Games.", "To show Vietnamese's ability in organising international sporting events."], "key": 3, "expl": "Cả bài ca ngợi thành công của Đại hội do Việt Nam đăng cai, cho thấy năng lực tổ chức quốc tế."}]}, {"title": "Reading — Singapore", "intro": "Read the passage and circle the best answer A, B, C, or D.\nSingapore was one of the five original member countries that founded ASEAN in 1967. Since its independence in 1965, Singapore has become one of the world’s most prosperous countries, with per capita GDP equalling that of the leading nations of Western Europe. Singapore is highly ranked for its economic competitiveness, and it was the world’s most competitive country from 1997 to 1999 as ranked by the World Economic Forum.\nSingapore’s strategic location at the entrance to the Strait of Malacca has helped it to become one of the most important shipping centres in Asia. The Port of Singapore, the world’s busiest in terms of shipping tonnage, is a key component of Singapore’s prosperity and economic health. Singapore is a leader in manufacturing of computer components, petroleum refining, and business services.\nSingapore has made an impressive recovery after the Asian financial crisis of 1997-1998. The government is currently restructuring the economy by promoting higher-value-added activities in line with a “knowledge-based” economy, and by opening up protected sectors such as financial services to increase overall efficiency. Various bilateral free-trade agreements are also being negotiated to improve market access and encourage foreign investment inflows.", "items": [{"t": "mcq", "stem": "Since when has Singapore become one of the world’s most prosperous countries?", "options": ["1965", "1967", "1997", "1999"], "key": 0, "expl": "Bài viết rõ 'Since its independence in 1965, Singapore has become...' — mốc thịnh vượng bắt đầu từ năm 1965."}, {"t": "mcq", "stem": "What does the word “it” in the first paragraph refer to?", "options": ["ASEAN", "GDP", "Singapore", "the World Economic Forum"], "key": 2, "expl": "Đại từ 'it' thay thế cho chủ thể chính của đoạn văn là Singapore, nước đang được nói tới."}, {"t": "mcq", "stem": "What is the important component of Singapore’s prosperity and economic health?", "options": ["Singapore’s strategic location", "the Strait of Malacca", "Singapore’s shipping", "the Port of Singapore"], "key": 3, "expl": "Bài nêu cảng biển Singapore (the Port of Singapore) là thành phần quan trọng của sự thịnh vượng kinh tế."}, {"t": "mcq", "stem": "In what areas is Singapore leading?", "options": ["manufacturing of computer components", "petroleum refining", "business services", "A, B, and C"], "key": 3, "expl": "Bài liệt kê cả ba lĩnh vực Singapore dẫn đầu: linh kiện máy tính, lọc dầu và dịch vụ kinh doanh."}, {"t": "mcq", "stem": "What happened in the period of 1997-1998?", "options": ["Singapore made an impressive recovery.", "The Asian financial crisis took place.", "The Singaporean government promoted higher-value-added activities.", "The Singaporean government opened up financial services."], "key": 1, "expl": "Giai đoạn 1997–1998 là thời điểm cuộc khủng hoảng tài chính châu Á diễn ra, như bài đã nêu."}]}, {"title": "Reading — Malaysia (ASEAN People’s Forum)", "intro": "Read the following passage and mark the letter A, B, C, or D to indicate the correct answer to each of the questions.\nWhen Malaysia takes the ASEAN chair next year, it will face a huge challenge. Too few of us know enough about this grouping we call the Association of Southeast Asian Nations. We do not know what it means to be a part of ASEAN and why it is important to us. At the same time, pressure is mounting to reinvent ASEAN to make it more people-centric and less government-centric. The Heat speaks to Global Movement of Moderates CEO Saifuddin Abdullah on why ASEAN should mean more to us than just acronyms.\nASEAN people do not feel like they are a part of the community of Southeast Asian nations. This statement, backed up by survey findings, is pretty bizarre, and extremely hurtful too, considering that ASEAN is 47 years old today. “Interview 10 persons on the street and you would perhaps get only one of them who knows about ASEAN,” says Datuk Saifuddin Abdullah. This CEO of Global Movement of Moderates (GMM) is not running down ASEAN; he’s confronting the truth as it impacts the project he has been entrusted with. Here’s more, in 2012, the ASEAN Secretariat conducted a survey that showed only 34% of Malaysians had heard of the ASEAN community. This compares with 96% of Laotians. Malaysia chairs ASEAN next year, and GMM is a member of the national steering committee organising the ASEAN People’s Forum (APF), a platform designed to bridge the gap between governments and civil society. Never heard of it? You’re forgiven.\nThe APF actually started off life in the 1990s, except it was called the ASEAN People’s Assembly (APA). It was held back to back with the ASEAN Summit, which is held twice a year. The APA is the forum where 10 leaders of government engage with 10 leaders of civil society in a half-hour meeting. “It was going well until one year when the chairman decided not to hold the APA, so it was discontinued until 2005 when Malaysia took the chairmanship of ASEAN again and founded the ASEAN People’s Forum (APF),” Saifuddin explains. In a perfect world, forums such as the APF or its predecessor APA would have worked perfectly to bridge the gap between government and civil society.", "items": [{"t": "mcq", "stem": "According to the passage, in 1990s, APF was called ____.", "options": ["ASEAN People’s Assembly", "ASEAN People’s Forum", "Civil Society Organisations", "Global Movement of Moderates"], "key": 0, "expl": "The APF actually started off life in the 1990s, except it was called the ASEAN People's Assembly (APA)."}, {"t": "mcq", "stem": "The word “acronyms” in paragraph 1 probably means ____.", "options": ["abbreviations", "antonyms", "enlargements", "synonyms"], "key": 0, "expl": "Acronym = abbreviation (từ viết tắt)."}, {"t": "mcq", "stem": "The phrase “backed up” in paragraph 2 has similar meaning to ____.", "options": ["concluded", "introduced", "proved", "supported"], "key": 3, "expl": "Backed up = supported (được ủng hộ)."}, {"t": "mcq", "stem": "According to the passage, Datuk Saifuddin Abdullah was CEO of ____.", "options": ["APA", "APF", "CSOs", "GMM"], "key": 3, "expl": "Thông tin: “This CEO of Global Movement of Moderates (GMM)...”."}, {"t": "mcq", "stem": "Which of the following statements is NOT true about the APF according to the passage?", "options": ["APF consists of 20 leaders.", "APF is held every two years.", "APF is reorganised in 2005.", "APF lasts for 30 minutes."], "key": 3, "expl": "Bài không hề nói APF kéo dài 30 phút; các thông tin còn lại về APF đều được nêu trong bài."}]}, {"title": "Reading — True or False", "intro": "Read the passage and decide whether the statements are true (T) or false (F).\nAs the century dawns, ASEAN is embracing a new vision of itself as “a concert of Southeast Asian nations, living in peace, stability and prosperity, bonded together in partnership in dynamic development and in a community of caring societies”.\nThe ASEAN region stretches across three time zones and incorporates a key part of Asia’s continental landmass and several archipelagos. Economically, it belongs to the developing world, but some of its member countries have joined the world’s top 20 most competitive economies. Its population of about 600 million constitutes a huge, increasingly middle-class market, half the size of China’s. One of every ten persons in the world today is a Southeast Asian. Besides its economic importance and the natural resources, its marine territories are believed to hold. Southeast Asia is also of global strategic importance. It is the bridge between the Indian and Pacific Oceans. It has some of the busiest sea-lanes in the world. The oil tankers and freighters that pass daily through these sea-lanes strengthen Japan’s status as an industrial power.", "items": [{"t": "tf", "stem": "Living in peace, stability and prosperity’ is part of ASEAN’s new vision", "key": true, "expl": "Câu này trích đúng tầm nhìn mới của ASEAN nêu đầu bài: hòa bình, ổn định và thịnh vượng."}, {"t": "tf", "stem": "All the ASEAN nations belong to the developing world.", "key": false, "expl": "Bài không nói mọi nước ASEAN đều đang phát triển; trong khối có cả nước phát triển như Singapore."}, {"t": "tf", "stem": "China’s market is as large as ASEAN’s.", "key": false, "expl": "Theo bài, thị trường Trung Quốc còn lớn hơn thị trường ASEAN, nên nói hai thị trường ngang bằng nhau là sai."}, {"t": "tf", "stem": "ASEAN’s population makes up 10% of the world population.", "key": true, "expl": "Bài nêu dân số ASEAN chiếm khoảng 10% dân số thế giới, khớp với nội dung câu nhận định."}, {"t": "tf", "stem": "The ASEAN region is very rich in natural resources, sea products and others.", "key": false, "expl": "Cách nói bao quát trong câu không khớp chi tiết bài nêu về tài nguyên khu vực, nên câu sai."}, {"t": "tf", "stem": "Eveiy day there are big passenger ships and freighters passing through the sea-lanes.", "key": false, "expl": "Chi ow' + V-ing giữ nguyên ý cấm câu cá khi không có giấy phép."}, {"t": "mcq", "stem": "“Why don't we go for a walk?\" Mary said.", "options": ["Mary advised to go for a walk.", "Mary asked going for a walk.", "Mary suggested going for a walk.", "Mary would like going for a walk."], "key": 2, "expl": "Câu 'Why don't we go...?' là một lời gợi ý; 'suggested' + V-ing là cách diễn đạt lại đúng nhất."}, {"t": "mcq", "stem": "I regret missing the opening ceremony of the ASEANGAMES last night.", "options": ["I wish I could miss the opening ceremony of the ASEAN GAMES last night.", "I wish I did not miss opening ceremony of the ASEAN GAMES last night.", "I wish to miss opening ceremony of the ASEAN GAMES last night.", "I wish I had not missed opening ceremony of the ASEAN GAMES last night."], "key": 3, "expl": "'regret' về việc đã qua được diễn đạt lại bằng 'wish + had V3' — ước đã không bỏ lỡ buổi lễ."}, {"t": "mcq", "stem": "Lucy is excited about meeting her new pen pal from Thailand.", "options": ["Lucy can't wait to meet her new pen pal from Thailand.", "Lucy is waiting to meet her new pen pal from Thailand.", "Lucy is excited that her new pen pal from Thailand is waiting for her.", "Lucy can't bear meeting her new pen pal from Thailand."], "key": 0, "expl": "can't wait to do ST = diễn tả sự phấn khích (to be excited to do ST)."}, {"t": "mcq", "stem": "Our group managed to deliver a presentation on ASEAN yesterday.", "options": ["Our group found a manager to deliver a presentation on ASEAN yesterday.", "Our group succeeded in delivering a presentation on ASEAN yesterday.", "A presentation on ASEAN was delivered to the manager of our group yesterday.", "The delivery of our presentation on ASEAN was managed yesterday."], "key": 1, "expl": "manage to do ST = succeed in doing ST = thành công làm việc gì."}, {"t": "mcq", "stem": "Perhaps Vietnam will defeat Thailand in the football final of the ASEAN game.", "options": ["Vietnam must defeat Thailand in the football final of the ASEAN game.", "Vietnam may probably defeat Thailand in the football final of the ASEAN game.", "Vietnam should have defeated Thailand in the football final of the ASEAN game.", "Vietnam can't have defeated Thailand in the football final of the ASEAN game."], "key": 1, "expl": "'Perhaps' chỉ khả năng có thể xảy ra; 'may probably' giữ đúng mức độ phỏng đoán, các câu khác làm đổi nghĩa."}, {"t": "mcq", "stem": "It is unnecessary to apply for a visa to enter Singapore.", "options": ["There is no point in applying for a visa to enter Singapore.", "It's hopeless to apply for a visa to enter Singapore.", "You should not have to apply for a visa to enter Singapore.", "You don't need to apply for a visa to enter Singapore."], "key": 3, "expl": "'It is unnecessary to do something' tương đương với 'don't need to do' — không cần thiết phải xin visa."}]}, {"title": "WRITING — Choose the correct answer", "intro": "Mark the letter A, B, C, or D to indicate the correct answer to each of the following questions", "items": [{"t": "mcq", "stem": "Shall we go for a ride?", "options": ["What about going for a ride?", "What about go for a ride?", "What about to go for a ride?", "What about to going for a ride?"], "key": 0, "expl": "Mẫu gợi ý 'What about' đi với V-ing: 'What about going for a ride?'."}, {"t": "mcq", "stem": "Why don’t we go to the cinema for a change?", "options": ["I suggest going to the cinema for a change.", "I suggest go to the cinema for a change.", "I suggest not going to the cinema for a change.", "I suggest to go to the cinema for a change."], "key": 0, "expl": "Đổi câu 'Why don't we...?' thành lời đề nghị dùng 'suggest' + V-ing."}, {"t": "mcq", "stem": "Please don’t play music so loudly.", "options": ["Would you mind playing your music so loudly?", "Would you mind not play your music so loudly?", "Would you mind not to play your music so loudly?", "Would you mind not playing your music so loudly?"], "key": 3, "expl": "Yêu cầu lịch sự dạng phủ định là 'Would you options": ["Everyone was too afraid to dare to speak anything", "Everyone was afraid enough to not to speak anything.", "Everyone was such afraid that nobody speak anything.", "Nobody was not afraid enough to dare to speak anything."], "key": 0, "expl": "Cấu trúc 'too... to' nối đúng hai ý: mọi người quá sợ hãi nên không ai dám nói gì."}, {"t": "mcq", "stem": "I thought I should ask the doctor about going on a diet. I went to the surgery.", "options": ["Having been on a diet, I went to the surgery.", "I went to the surgery, so I asked the doctor about going on a diet.", "I asked the doctor about going on a diet, so I went to the surgery.", "I went to the surgery in order to ask about going on a diet."], "key": 3, "expl": "Đến phòng khám là để hỏi bác sĩ về ăn kiêng, nên dùng cụm mục đích 'in order to ask'."}, {"t": "mcq", "stem": "I had to lose some weight. I went on a strict diet.", "options": ["I had to lose some weight after I went on a strict diet.", "I went on a strict diet in order to lose some weight.", "I had to lose some weight before I went on a strict diet.", "I had to lose some weight even when I went on a strict diet."], "key": 1, "expl": "Ăn kiêng nghiêm ngặt là cách để giảm cân; 'in order to lose some weight' nối đúng quan hệ mục đích."}, {"t": "mcq", "stem": "People want to keep fit. Many people take up sports.", "options": ["Many people take up sports so as to keep fit.", "Many people want to keep fit so as to take up sports.", "Many people want to keep fit in order to take up sports.", "Although people want to keep fit, they take up sports."], "key": 0, "expl": "Nhiều người chơi thể thao nhằm giữ vóc dáng; 'so as to keep fit' đặt đúng chiều mục đích của hành động."}, {"t": "mcq", "stem": "I want to stay healthy. I try to eat lots of fruit.", "options": ["Although I try to eat lots of fruit, I stay healthy.", "I stay healthy though I eat lots of fruit.", "I try to eat lots of fruit in order to stay healthy.", "I eat lots of fruit, but I stay healthy."], "key": 2, "expl": "Ăn nhiều trái cây là để khỏe mạnh; 'in order to stay healthy' phải gắn với vế ăn trái cây."}, {"t": "mcq", "stem": "I didn't want to catch a cold. I wore a warm coat and a scarf.", "options": ["I wore a warm coat and a scarf though I didn't want to catch a cold.", "I wore a warm coat and a scarf, so I didn't want to catch a cold.", "I wore a warm coat and a scarf, but I didn't want to catch a cold.", "I wore a warm coat and a scarf in order not to catch a cold."], "key": 3, "expl": "Mặc áo ấm và quàng khăn là để không bị cảm lạnh; phủ định mục đích dùng 'in order not to catch'."}, {"t": "mcq", "stem": "Michelle likes travelling to Vietnam very much. She made a lot of friends while travelling there.", "options": ["Michelle likes travelling to Vietnam very much because she wants to make a lot of friends while travelling there.", "Michelle really likes travelling to Vietnam where she made a lot of friends while travelling.", "Michelle likes travelling to Vietnam very much, but she made a lot of friends while travelling there.", "Michelle likes travelling to Vietnam very much in spite of making a lot of friends while travelling there."], "key": 1, "expl": "Mệnh đề quan hệ 'where' nối địa điểm Việt Nam với việc cô ấy kết bạn khi du lịch tại đó."}, {"t": "mcq", "stem": "The students look forward to participating in the activities. They are arranged by the ASEAN volunteer program.", "options": ["The students look forward to arranging the activities together with the ASEAN volunteer program.", "The students look forward to participating in the activities arranged by the ASEAN volunteer program.", "The students, arranged by the ASEAN volunteer program, look forward to participating in the activities.", "The students look forward to participating in ASEAN volunteer program that arrange the activities."], "key": 1, "expl": "Cụm 'arranged by the ASEAN volunteer program' là dạng rút gọn của mệnh đề quan hệ bị động, giữ đúng nghĩa."}]}, {"title": "WRITING function showVocab(i,ev){if(ev)ev.stopPropagation();const v=VOCAB[i];document.getElementById('vword').textContent=v.word;document.getElementById('ven').textContent=v.en;document.getElementById('vvi').textContent=v.vi;document.getElementById('vpop').classList.add('on');document.getElementById('vback').classList.add('on')}

function itemHTML(si,ii,it){
  const id=ikey(si,ii);let h='<div class="item" id="it-'+id+'"><div class="stem">'+(ii+1)+'. '+fmt(it.stem)+'</div>';

    h+='<div class="opts">'+opts.map((o,oi)=>'<button onclick="pick(\''+id+'\','+si+','+ii+','+oi+')">'+'ABCD'[oi]+'. '+fmtP(o)+'</button>').join('')+'</div>';
  }else if(it.t==='fill'){
    h+='<div class="fillrow"><input id="in-'+id+'" placeholder="Gõ đáp án..." autocomplete="off"><button class="btn" onclick="checkFill(\''+id+'\','+si+','+ii+')">Check</button><button class="btn ghost" onclick="showAns(\''+id+'\','+si+','+ii+')">👁 Show</button></div><div class="hintline" id="at-'+id+'"></div>';

function correctIdx(it){return it.t==='tf'?(it.key?0:1):it.key}

  if(it.t==='fill')return it.answer;

}
function fbHTML(cls,it,head){

}
function pick(id,si,ii,oi){
  const it=DATA.sections[si].items[ii];const st=state[id]||(state[id]={s:'',a:0});
  if(st.s==='correct'||st.s==='shown')return;
  if(EXAM){
    if(st.s)return;
    st.o=oi;
    const box=$('#it-'+id),btns=box.querySelectorAll('.opts button'),fb=$('#fb-'+id);
    btns.forEach(b=>b.disabled=true);
    if(oi===correctIdx(it)){st.s='correct';st.f=1;btns[oi].classList.add('ok');fb.className='fb ok';fb.innerHTML=fbHTML('ok',it,'✓ Đúng! Đáp án:');}
    else{st.s='wrong';st.f=0;btns[oi].classList.add('bad');btns[correctIdx(it)].classList.add('ok');fb.className='fb no';fb.innerHTML=fbHTML('no',it,'✗ Sai. Đáp án đúng:');}
    save();updProg();return;
  }
  const box=$('#it-'+id),btns=box.querySelectorAll('.opts button'),fb=$('#fb-'+id);
  if(oi===correctIdx(it)){
    st.s='correct';save();
    btns.forEach((b,j)=>{b.disabled=true;if(j===oi)b.classList.add('ok')});
    fb.className='fb ok';fb.innerHTML=fbHTML('ok',it,'✓ Đúng! Đáp án:');
  }else{
    st.a=(st.a||0)+1;save();
    btns[oi].classList.add('bad');btns[oi].disabled=true;
    fb.className='fb';fb.style.display='block';fb.style.background='#fdf1f1';fb.style.border='1px solid #d64545';
    fb.innerHTML='✗ Chưa đúng — thử lại nhé.';
  }
  updProg();
}
function checkFill(id,si,ii){
  const it=DATA.sections[si].items[ii];const st=state[id]||(state[id]={s:'',a:0});
  if(st.s==='correct'||st.s==='shown')return;
  const inp=$('#in-'+id);const val=inp.value;st.text=val;
  const acc=(it.accept&&it.accept.length?it.accept:[it.answer]).map(norm);
  const fb=$('#fb-'+id);
  if(acc.includes(norm(val))){
    st.s='correct';if(EXAM)st.f=(st.a?0:1);save();inp.disabled=true;
    fb.className='fb ok';fb.innerHTML=fbHTML('ok',it,'✓ Đúng! Đáp án:');
  }else{
    st.a=(st.a||0)+1;save();
    $('#at-'+id).textContent='✗ Chưa đúng ('+st.a+' lần thử) — kiểm tra lại rồi gõ lại.';
    fb.className='fb';fb.style.display='none';
  }
  updProg();
}
function showAns(id,si,ii){
  const it=DATA.sections[si].items[ii];const st=state[id]||(state[id]={s:'',a:0});
  if(st.s==='correct')return;
  st.s='shown';save();
  const box=$('#it-'+id),fb=$('#fb-'+id);

  const inp=$('#in-'+id);if(inp)inp.disabled=true;

  updProg();

function restore(si,ii,it){
  const id=ikey(si,ii),st=state[id];if(!st||!st.s)return;
  if(it.t==='fill'){const inp=$('#in-'+id);if(inp&&st.text)inp.value=st.text}
  if(st.s==='correct'){
    if(it.t==='mcq'||it.t==='tf'){const box=$('#it-'+id);box.querySelectorAll('.opts button').forEach((b,j)=>{b.disabled=true;if(j===correctIdx(it))b.classList.add('ok')})}
    if(it.t==='fill'){const inp=$('#in-'+id);if(inp)inp.disabled=true}
    const fb=$('#fb-'+id);fb.className='fb ok';fb.innerHTML=fbHTML('ok',it,'✓ Đúng! Đáp án:');
  }else if(st.s==='wrong'){
    const box=$('#it-'+id);box.querySelectorAll('.opts button').forEach((b,j)=>{b.disabled=true;if(j===st.o)b.classList.add('bad');if(j===correctIdx(it))b.classList.add('ok')});

function counts(si){
  const s=DATA.sections[si];let c={tot:s.items.length,ok:0,sh:0,no:0};

function examStats(){
  const T={tot:0,first:0,done:0,wrong:0,blank:0};const per=[],review=[];
  DATA.sections.forEach((s,si)=>{const p={title:s.title,tot:s.items.length,first:0};const lab=s.title.split('—')[0].trim();
    s.items.forEach((it,ii)=>{const st=state[ikey(si,ii)];T.tot++;

      if(st&&(st.s==='correct'||st.s==='wrong'))T.done++;
      if(st&&st.s==='wrong'){T.wrong++;review.push(lab+' Q'+(ii+1))}
      else if(st&&st.s==='correct'&&st.f===0)review.push(lab+' Q'+(ii+1)+' (đúng, nhưng không phải lần đầu)');
      else if(!st||!st.s)T.blank++;
    });per.push(p)});
  return {T,per,review};

function makeSubmit(){$('#subtext').value=submitText()}
function downloadSubmit(){const stu=stuInfo();const blob=new Blob([submitText()],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KetQua_'+(stu.name||'HS').replace(/\s+/g,'_')+'.txt';a.click();URL.revokeObjectURL(a.href)}
function copySubmit(){const ta=$('#subtext');if(!ta.value)makeSubmit();ta.select();if(navigator.clipboard)navigator.clipboard.writeText(ta.value);else document.execCommand('copy');alert('Đã sao chép kết quả — dán vào tin nhắn gửi cho thầy nhé.')}
function exportSubmit(){
  const stu=stuInfo();
  if(!stu.name){alert('Chưa nhập họ tên — quay lên đầu trang nhập tên trước khi tạo file nộp nhé.');window.scrollTo({top:0});return}
  const payload=JSON.stringify({state:state,stu:stu}).split('<').join(String.fromCharCode(92)+'u003c');
  const inject='<script>window.__SUBMIT__='+payload+'</'+'script>';
  let out='<!DOCTYPE html>'+String.fromCharCode(10)+document.documentElement.outerHTML;
  const i=out.indexOf('<body');const j=out.indexOf('>',i);
  out=out.slice(0,j+1)+inject+out.slice(j+1);
  const blob=new Blob([out],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NopBai_'+stu.name.replace(/\s+/g,'_')+'.html';a.click();URL.revokeObjectURL(a.href);
}
function resetAll(){if(confirm('Xóa toàn bộ tiến độ và làm lại từ đầu?')){state={};save();location.reload()}}
let zoom=100;
function setZoom(d){zoom=Math.min(180,Math.max(70,zoom+d));document.documentElement.style.setProperty('--zoom',zoom/100);$('#zv').textContent=zoom+'%'}
build();
if(EXAM){document.body.classList.add('exam');$('#stu').style.display='block';const stu=stuInfo();$('#sname').value=stu.name||'';$('#sclass').value=stu.class||'';const sv=()=>localStorage.setItem(LS+'_stu',JSON.stringify({name:$('#sname').value.trim(),class:$('#sclass').value.trim()}));$('#sname').addEventListener('input',sv);$('#sclass').addEventListener('input',sv);const b0=document.querySelector('#dd button[data-t="s0"]');if(b0)b0.click()}
if(REVIEW){document.body.classList.add('review');const stuR=stuInfo();const rR=examStats();const stuEl=$('#stu');stuEl.style.display='block';stuEl.innerHTML='<b>📋 BÀI NỘP CỦA: '+esc(stuR.name||'')+'</b> — Lớp: '+esc(stuR.class||'')+' &nbsp;•&nbsp; <b>Điểm: '+rR.T.first+'/'+rR.T.tot+'</b> (đúng ngay lần đầu) • Đã trả lời: '+rR.T.done+'/'+rR.T.tot;document.querySelectorAll('#main .item button, #main .item input').forEach(el=>el.disabled=true);document.querySelectorAll('button[onclick="resetAll()"]').forEach(b=>b.style.display='none');const br=document.querySelector('#dd button[data-t="res"]');if(br)br.click()}
</script>
</body></html>
