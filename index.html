<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps - Hồ Hải Thượng</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#eef2ff; color:#1e293b; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:32px 16px; }
  h1 { font-size:26px; font-weight:800; color:#1e40af; text-align:center; }
  .sub { margin-top:6px; font-size:14px; color:#64748b; text-align:center; }
  .grid { margin-top:28px; display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px; width:100%; max-width:640px; }
  a.card { display:block; background:#fff; border-radius:16px; padding:22px 20px; text-decoration:none; color:#1e293b; box-shadow:0 2px 10px rgba(30,64,175,.10); border:1px solid #e2e8f0; }
  a.card:active { transform:scale(.98); }
  .ic { font-size:38px; }
  .nm { margin-top:10px; font-size:19px; font-weight:800; }
  .ds { margin-top:4px; font-size:13.5px; color:#64748b; line-height:1.45; }
  .go { margin-top:12px; font-size:13px; font-weight:700; color:#2563eb; }
  footer { margin-top:36px; font-size:12.5px; color:#94a3b8; text-align:center; }
</style>
</head>
<body>
  <h1>Apps của thầy Thượng</h1>
  <p class="sub">Chọn app cần mở</p>
  <div class="grid">
    <a class="card" href="./omr/">
      <div class="ic">📷</div>
      <div class="nm">Chấm trắc nghiệm OMR</div>
      <div class="ds">Chấm phiếu trả lời trắc nghiệm bằng camera điện thoại.</div>
      <div class="go">Mở app →</div>
    </a>
    <a class="card" href="./homework-space/">
      <div class="ic">🎉</div>
      <div class="nm">Homework Space</div>
      <div class="ds">Web bài tập về nhà cho lớp học thêm: giao bài, điểm danh, xếp hạng.</div>
      <div class="go">Mở app →</div>
    </a>
  </div>
  <footer>Cooked by Ho Hai Thuong. Have fun!</footer>
<script>
  // Don service worker cu o scope goc (app OMR truoc day cai o "/") de trinh duyet khong mo nham ban cu.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { if (r.scope === location.origin + "/") r.unregister(); });
    }).catch(function () {});
  }
</script>
</body>
</html>
